      loadExercise() {
        this.state.isAnswerCorrect = false;
        const btn = document.getElementById('btn-check-answer');
        if (btn) btn.src = 'journe 1/valider.png';
        const ex = this.currentLevelData[this.currentExIndex];
        document.getElementById('exercise-bg').src = ex.bg;

        const progress = ((this.currentExIndex) / this.currentLevelData.length) * 100;
        document.getElementById('exercise-progress-fill').style.width = progress + '%';

        document.getElementById('exercise-feedback').textContent = '';

        const container = document.getElementById('exercise-content-area');
        container.innerHTML = '<div class="exercise-instruction">' + ex.instruction + '</div>';

        if (ex.type === 'select-objects') {
          this.state.selected = new Set();
          const grid = document.createElement('div');
          grid.className = 'obj-grid';
          ex.objects.forEach(obj => {
            const card = document.createElement('div');
            card.className = 'obj-card';
            card.textContent = obj.label;
            card.onclick = () => {
              if (this.state.selected.has(obj.id)) {
                this.state.selected.delete(obj.id);
                card.classList.remove('selected');
              } else {
                this.state.selected.add(obj.id);
                card.classList.add('selected');
              }
            };
            grid.appendChild(card);
          });
          container.appendChild(grid);
        }
        else if (ex.type === 'highlight-words') {
          this.state.selected = new Set();
          const box = document.createElement('div');
          box.className = 'sentence-container';

          const words = ex.sentence.split(' ');
          words.forEach((w, idx) => {
            const span = document.createElement('span');
            span.className = 'word-token';
            span.textContent = w;
            span.onclick = () => {
              if (this.state.selected.has(idx)) {
                this.state.selected.delete(idx);
                span.classList.remove('highlighted');
              } else {
                this.state.selected.add(idx);
                span.classList.add('highlighted');
              }
            };
            box.appendChild(span);
          });
          container.appendChild(box);
        }
        else if (ex.type === 'match-syllables') {
          this.state.leftSel = null;
          this.state.matched = new Set();
          this.state.matchedLines = [];

          const flex = document.createElement('div');
          flex.className = 'match-container';

          const colL = document.createElement('div'); colL.className = 'match-col';
          const colR = document.createElement('div'); colR.className = 'match-col';

          ex.left.forEach(l => {
            const btn = document.createElement('button');
            btn.className = 'syllable-btn left-btn';
            btn.textContent = l;
            btn.id = 'left-' + l;
            btn.onclick = () => {
              if (this.state.matched.has(l)) return;
              document.querySelectorAll('.left-btn').forEach(b => b.classList.remove('selected-left'));
              btn.classList.add('selected-left');
              this.state.leftSel = l;
            };
            colL.appendChild(btn);
          });

          ex.right.forEach(r => {
            const btn = document.createElement('button');
            btn.className = 'syllable-btn right-btn';
            btn.textContent = r;
            btn.id = 'right-' + r;
            btn.onclick = () => {
              if (this.state.matched.has(r)) return;
              if (this.state.leftSel) {
                const l = this.state.leftSel;
                this.state.matchedLines.push({ left: l, right: r });
                this.state.matched.add(l);
                this.state.matched.add(r);
                document.getElementById('left-' + l).classList.add('matched');
                btn.classList.add('matched');
                document.querySelectorAll('.left-btn').forEach(b => b.classList.remove('selected-left'));
                this.state.leftSel = null;
              }
            };
            colR.appendChild(btn);
          });

          flex.appendChild(colL);
          flex.appendChild(colR);
          container.appendChild(flex);
        }
        else if (ex.type === 'build-sentence') {
          this.state.sentence = [];

          const dropzone = document.createElement('div');
          dropzone.className = 'dropzone';

          const pool = document.createElement('div');
          pool.className = 'labels-pool';

          ex.labels.forEach(lbl => {
            const btn = document.createElement('div');
            btn.className = 'word-label in-pool';
            btn.textContent = lbl;

            btn.onclick = () => {
              if (btn.classList.contains('in-pool')) {
                btn.classList.remove('in-pool');
                dropzone.appendChild(btn);
                this.state.sentence.push(lbl);
              } else {
                btn.classList.add('in-pool');
                pool.appendChild(btn);
                this.state.sentence = this.state.sentence.filter(x => x !== lbl);
              }
            };
            pool.appendChild(btn);
          });

          container.appendChild(dropzone);
          container.appendChild(pool);
        }
      },

      checkAnswer() {
        if (this.state.isAnswerCorrect) {
          this.nextExercise();
          return;
        }

        const ex = this.currentLevelData[this.currentExIndex];
        let isCorrect = false;
        const fb = document.getElementById('exercise-feedback');
        fb.textContent = "";

        if (ex.type === 'select-objects') {
          let fail = false;
          let validsFound = 0;
          this.state.selected.forEach(id => {
            const obj = ex.objects.find(o => o.id === id);
            if (!obj.valid) fail = true;
            else validsFound++;
          });

          const totalValids = ex.objects.filter(o => o.valid).length;
          if (!fail && validsFound === totalValids) isCorrect = true;
        }
        else if (ex.type === 'highlight-words') {
          const words = ex.sentence.split(' ');
          let selectedWords = [];
          this.state.selected.forEach(idx => {
            selectedWords.push(words[idx].replace(/[,\.]/g, ''));
          });

          let allValid = true;
          selectedWords.forEach(w => {
            if (!ex.validWords.includes(w)) allValid = false;
          });

          if (allValid && selectedWords.length === ex.validWords.length) isCorrect = true;
        }
        else if (ex.type === 'match-syllables') {
          let correctPairs = 0;
          let wrongPair = false;
          this.state.matchedLines.forEach(pair => {
            if (ex.matches[pair.left] === pair.right) correctPairs++;
            else wrongPair = true;
          });

          if (!wrongPair && correctPairs === Object.keys(ex.matches).length) isCorrect = true;
        }
        else if (ex.type === 'build-sentence') {
          const built = this.state.sentence.join(' ');
          if (ex.validSentences.includes(built)) {
            isCorrect = true;
          }
        }

        if (isCorrect) {
          if (window.SoundSystem) SoundSystem.playSuccess();
          this.state.isAnswerCorrect = true;
          const btn = document.getElementById('btn-check-answer');
          btn.src = 'journe 1/continuer.png';
        } else {
          if (window.SoundSystem) SoundSystem.playIncorrect();
          fb.textContent = "";
          if (ex.type === 'match-syllables') {
            setTimeout(() => this.loadExercise(), 1500);
          }
        }
      },

      nextExercise() {
        this.state.isAnswerCorrect = false;
        this.currentExIndex++;
        const btn = document.getElementById('btn-check-answer');
        btn.style.display = 'block';
        btn.src = 'journe 1/valider.png';
        if (this.currentExIndex >= this.currentLevelData.length) {
          document.getElementById('exercise-progress-fill').style.width = '100%';
          document.getElementById('exercise-content-area').innerHTML = '<div class="exercise-instruction" style="font-size: 50px; color: #FFD700; border-color: #FFD700;">Félicitations ! Tu as gagné des étoiles ! ⭐⭐⭐</div>';
          document.getElementById('exercise-feedback').textContent = "";
          document.getElementById('btn-check-answer').style.display = 'none';

          setTimeout(() => {
            this.close();
            MapSystem.state.unlockedLevel = window.currentSelectedLevel + 1;
            MapSystem.saveProgress();
            MapSystem.updateVisuals(false);
            const targetLevel = MAP_LEVELS.find(l => l.id === MapSystem.state.unlockedLevel);
            if (targetLevel) {
              MapCamera.focusOn(targetLevel, 1.8, 2000);
              setTimeout(() => {
                MapSystem.updateVisuals(true);
              }, 2100);
            }
          }, 3500);
        } else {
          this.loadExercise();
        }
      },

      // --- EVALUATION SESSION & FIRESTORE INTEGRATION ---
      EVAL_ACTIVE_DRAFT_KEY: 'ecripro_eval_active_draft_v3',
      EVAL_HISTORY_KEY: 'ecripro_eval_history_v3',
      evalPhase: 'draft',

      generateEvalSessionId() {
        return 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
      },

      resetInMemoryEvaluationState() {
        this.currentExIndex = 0;
        this.evalPhase = 'draft';
        this.evalSessionId = this.generateEvalSessionId();
        this.evalAnswers = { profile: null, q1: '', q2: '', q3: '', text: '' };
        this.evalScores = { situation: 0, character: 0, place: 0, time: 0, chronology: 0, writing: null, q1: null, q2: null, q3: null };
        this.evalQuestionResults = { q1: null, q2: null, q3: null };
        this.evalScore = 0;
        this.lastEvalDocId = null;
        this.lastSavedEvaluation = null;
        this._evalSubmitting = false;
        this._evalRetrying = false;
        this._evalShowingSuccess = false;
      },

      startNewEvaluationSession(options = {}) {
        this.clearActiveEvaluationDraft();
        this.resetInMemoryEvaluationState();
        console.log('[Evaluation] Started fresh evaluation session:', this.evalSessionId);
        if (options.render) {
          this.loadEvaluationActivity();
        }
      },

      getEvaluationDocId() {
        const profile = (this.evalAnswers && this.evalAnswers.profile) || {};
        const studentId = (profile.id || 'ANON').trim() || 'ANON';
        if (!this.evalSessionId) {
          this.evalSessionId = this.generateEvalSessionId();
        }
        const safeStudentId = studentId.replace(/[^a-zA-Z0-9_-]/g, '_');
        const docId = 'eval_' + safeStudentId + '_' + this.evalSessionId;
        this.lastEvalDocId = docId;
        return docId;
      },

      saveEvaluationSession() {
        try {
          // Never persist finished/submitted/results screen states as a resumable entry draft
          if (this.evalPhase === 'submitted' || typeof this.currentExIndex !== 'number' || this.currentExIndex < 0 || this.currentExIndex > 3) {
            return;
          }
          const ans = this.evalAnswers || {};
          const hasProfile = Boolean(ans.profile && (ans.profile.id || ans.profile.nom || ans.profile.prenom));
          const hasAnswers = Boolean((ans.q1 && ans.q1.trim()) || (ans.q2 && ans.q2.trim()) || (ans.q3 && ans.q3.trim()));
          if (this.currentExIndex === 0 && !hasProfile && !hasAnswers) {
            return;
          }
          const sessionData = {
            version: 3,
            evalPhase: 'draft',
            currentExIndex: this.currentExIndex,
            evalAnswers: ans,
            evalScores: this.evalScores || {},
            evalQuestionResults: this.evalQuestionResults || { q1: null, q2: null, q3: null },
            evalScore: this.computeAutoScore(),
            evalSessionId: this.evalSessionId || (this.evalSessionId = this.generateEvalSessionId()),
            lastEvalDocId: this.lastEvalDocId || null,
            updatedAt: new Date().toISOString()
          };
          localStorage.setItem(this.EVAL_ACTIVE_DRAFT_KEY, JSON.stringify(sessionData));
        } catch (e) {
          console.warn('Failed to save evaluation draft to localStorage:', e);
        }
      },

      restoreEvaluationSession() {
        try {
          // Remove legacy keys that previously caused completed results or old student profiles to leak
          try {
            localStorage.removeItem('ecripro_eval_session_v2');
            localStorage.removeItem('ecripro_eval_session');
            localStorage.removeItem('eval_student_profile');
          } catch (cleanupErr) {}

          const raw = localStorage.getItem(this.EVAL_ACTIVE_DRAFT_KEY);
          if (!raw) return false;
          const sessionData = JSON.parse(raw);
          if (
            !sessionData ||
            sessionData.version !== 3 ||
            sessionData.evalPhase !== 'draft' ||
            typeof sessionData.currentExIndex !== 'number' ||
            sessionData.currentExIndex < 0 ||
            sessionData.currentExIndex > 3 ||
            !sessionData.evalAnswers
          ) {
            this.clearActiveEvaluationDraft();
            return false;
          }
          const ans = sessionData.evalAnswers;
          const hasProfile = Boolean(ans.profile && (ans.profile.id || ans.profile.nom || ans.profile.prenom));
          const hasAnswers = Boolean((ans.q1 && ans.q1.trim()) || (ans.q2 && ans.q2.trim()) || (ans.q3 && ans.q3.trim()));
          if (!hasProfile && !hasAnswers) {
            this.clearActiveEvaluationDraft();
            return false;
          }
          this.evalPhase = 'draft';
          this.evalAnswers = ans;
          this.evalScores = sessionData.evalScores || { situation: 0, character: 0, place: 0, time: 0, chronology: 0, writing: null, q1: null, q2: null, q3: null };
          this.evalQuestionResults = sessionData.evalQuestionResults || { q1: null, q2: null, q3: null };
          this.evalScore = this.computeAutoScore();
          this.evalSessionId = sessionData.evalSessionId || this.generateEvalSessionId();
          this.lastEvalDocId = sessionData.lastEvalDocId || null;
          this.currentExIndex = sessionData.currentExIndex;
          console.log('[Evaluation] Active unfinished draft restored:', {
            sessionId: this.evalSessionId,
            currentExIndex: this.currentExIndex,
            studentId: ans.profile ? ans.profile.id : null
          });
          return true;
        } catch (e) {
          console.warn('Failed to restore evaluation draft:', e);
        }
        return false;
      },

      clearActiveEvaluationDraft() {
        try {
          localStorage.removeItem(this.EVAL_ACTIVE_DRAFT_KEY);
          localStorage.removeItem('ecripro_eval_session_v2');
          localStorage.removeItem('ecripro_eval_session');
          localStorage.removeItem('eval_student_profile');
        } catch (e) {}
      },

      clearEvaluationSession() {
        this.clearActiveEvaluationDraft();
      },

      getEvaluationHistory() {
        try {
          localStorage.removeItem(this.EVAL_HISTORY_KEY);
          localStorage.removeItem('eval_history_v1');
        } catch (e) {}
        return [];
      },

      archiveEvaluationToHistory(payload) {
        // Evaluation history is sourced exclusively from Firebase Firestore; keep local cache cleared
        try {
          localStorage.removeItem(this.EVAL_HISTORY_KEY);
          localStorage.removeItem('eval_history_v1');
        } catch (e) {}
      },

      computeAutoScore() {
        if (!this.evalScores) return 0;
        let sum = 0;
        ['situation', 'character', 'place', 'time', 'chronology'].forEach(k => {
          if (typeof this.evalScores[k] === 'number') {
            sum += this.evalScores[k];
          }
        });
        return Math.min(50, Math.max(0, sum));
      },

      isChronologyCorrect(order) {
        if (!Array.isArray(order) || order.length !== 4) return false;
        return (order[0] === 'arrive' && order[3] === 'commence' &&
               ((order[1] === 'rencontre' && order[2] === 'entre') ||
                (order[1] === 'entre' && order[2] === 'rencontre')));
      },

      getSentenceCount(text) {
        if (!text || !text.trim()) return 0;
        const matches = text.trim().match(/[^.!?]+[.!?]+|[^.!?]+$/g);
        if (!matches) return 0;
        return matches.filter(s => s.trim().length > 3).length;
      },

      getWordCount(text) {
        if (!text || !text.trim()) return 0;
        return text.trim().split(/\s+/).filter(w => w.trim().length > 0).length;
      },

      async submitEvaluationToFirestore(statusOverride, options = {}) {
        if (window.FirebaseService) {
          window.FirebaseService.init();
        }

        const profile = (this.evalAnswers && this.evalAnswers.profile) || {};
        const studentId = (profile.id || 'ANON').trim() || 'ANON';
        const studentNom = (profile.nom || '').trim();
        const studentPrenom = (profile.prenom || '').trim();
        const studentClasse = (profile.classe || '').trim();
        const docId = this.getEvaluationDocId();

        const autoScore = this.computeAutoScore();
        const q1Answer = (this.evalAnswers && typeof this.evalAnswers.q1 === 'string') ? this.evalAnswers.q1.trim() : '';
        const q2Answer = (this.evalAnswers && typeof this.evalAnswers.q2 === 'string') ? this.evalAnswers.q2.trim() : '';
        const q3Answer = (this.evalAnswers && typeof this.evalAnswers.q3 === 'string') ? this.evalAnswers.q3.trim() : '';
        const combinedText = [q1Answer, q2Answer, q3Answer].filter(Boolean).join('\n\n');
        const currentStatus = statusOverride || 'completed';
        const isFinalSubmission = (currentStatus === 'completed' || currentStatus === 'submit');

        const rubric = window.EVALUATION_RUBRIC_CONFIG;
        const prevQuestions = this.evalQuestionResults || { q1: null, q2: null, q3: null };

        // Initialize or preserve per-question entries cleanly
        const buildInitialQuestionEntry = (qKey, answerText) => {
          const existing = prevQuestions[qKey];
          if (existing && existing.status === 'evaluated' && existing.answer === answerText) {
            return existing;
          }
          const qCfg = rubric ? rubric.questions[qKey] : null;
          return {
            questionId: qKey,
            questionNumber: qCfg ? qCfg.number : Number(qKey.replace('q', '')),
            questionText: qCfg ? qCfg.questionText : qKey,
            answer: answerText,
            score: null,
            maxScore: qCfg ? qCfg.maxScore : 0,
            criteria: existing && existing.criteria ? existing.criteria : {},
            strengths: [],
            mistakes: [],
            feedback: null,
            suggestedCorrection: null,
            previousStatus: existing ? existing.status : null,
            errorDetails: existing && existing.errorDetails ? existing.errorDetails : null,
            status: isFinalSubmission ? 'pending' : 'in_progress'
          };
        };

        const questionsMap = {
          q1: buildInitialQuestionEntry('q1', q1Answer),
          q2: buildInitialQuestionEntry('q2', q2Answer),
          q3: buildInitialQuestionEntry('q3', q3Answer)
        };

        const payload = {
          studentId: studentId,
          studentNom: studentNom,
          studentPrenom: studentPrenom,
          studentClasse: studentClasse,
          sessionId: this.evalSessionId,
          docId: docId,
          evaluationVersion: "v3_3questions_9pts",
          rubricVersion: rubric ? rubric.version : "4eme_officiel_v2_9pts",
          module: "Module 1",
          journey: "Évaluation — Je construis mon histoire",
          submittedAt: new Date().toISOString(),
          status: isFinalSubmission ? 'grading' : currentStatus,
          autoScore: autoScore,
          maxAutoScore: 0,
          writingStatus: isFinalSubmission ? 'grading' : 'in_progress',
          writingScore: null,
          totalScore: null,
          finalScoreOutOf9: null,
          maxTotalScore: rubric ? rubric.overallMaxScore : 9,
          rubricConfig: rubric ? {
            version: rubric.version,
            overallMaxScore: rubric.overallMaxScore,
            criteriaOrder: rubric.criteriaOrder ? [...rubric.criteriaOrder] : ['C1', 'C3', 'C6'],
            criteriaMaxTotals: rubric.criteriaMaxTotals ? { ...rubric.criteriaMaxTotals } : { C1: 4.5, C3: 3.0, C6: 1.5 },
            questionMaxScores: {
              q1: rubric.questions.q1.maxScore,
              q2: rubric.questions.q2.maxScore,
              q3: rubric.questions.q3.maxScore
            }
          } : null,
          answers: {
            q1: q1Answer,
            q2: q2Answer,
            q3: q3Answer,
            writing: {
              q1: q1Answer,
              q2: q2Answer,
              q3: q3Answer,
              text: combinedText,
              sentenceCount: this.getSentenceCount(combinedText),
              wordCount: this.getWordCount(combinedText)
            }
          },
          scoresBreakdown: {
            q1: null,
            q2: null,
            q3: null,
            writing: null
          },
          writingEvaluation: {
            rubricVersion: rubric ? rubric.version : "4eme_officiel_v2_9pts",
            questions: questionsMap,
            question1Evaluation: questionsMap.q1,
            question2Evaluation: questionsMap.q2,
            question3Evaluation: questionsMap.q3,
            totalScore: null,
            maxScore: rubric ? rubric.overallMaxScore : 9,
            criteriaTotals: { C1: null, C3: null, C6: null },
            summary: null,
            status: isFinalSubmission ? 'grading' : 'in_progress'
          }
        };

        this.lastSavedEvaluation = payload;

        // Step 1: Persist initial answers immediately to Firestore so student responses are never lost
        if (window.FirebaseService) {
          try {
            await window.FirebaseService.saveEvaluation(docId, payload);
          } catch (err) {
            console.error('[Firebase] Error in initial saveEvaluation:', err);
          }
        }

        // Helper to build structured failed question entry while preserving attempt count & metadata
        const makeFailedEntry = (qKey, ans, errObj, reachedGeminiFlag) => {
          const qCfg = rubric.questions[qKey];
          const errMsg = (errObj && errObj.message) ? String(errObj.message) : 'Erreur inconnue';
          const errCode = (errObj && (errObj.code || errObj.name)) ? String(errObj.code || errObj.name) : 'unknown_error';
          const isFileProtocol = typeof window !== 'undefined' && window.location && window.location.protocol === 'file:';
          const isAppCheckError = Boolean(errObj && errObj.isAppCheckFatal) || /appCheck|recaptcha|401/i.test(errMsg + ' ' + errCode);
          const prevEntry = questionsMap[qKey] || {};
          const prevAttempt = (prevEntry.errorDetails && typeof prevEntry.errorDetails.attempt === 'number')
            ? prevEntry.errorDetails.attempt
            : (prevEntry.previousStatus === 'failed' ? 1 : 0);

          return {
            questionId: qKey,
            questionNumber: qCfg.number,
            questionText: qCfg.questionText,
            answer: ans,
            score: null,
            maxScore: qCfg.maxScore,
            criteria: {},
            strengths: [],
            mistakes: [],
            feedback: null,
            suggestedCorrection: null,
            error: errMsg,
            errorDetails: {
              message: errMsg,
              code: errCode,
              attempt: prevAttempt + 1,
              reachedGemini: Boolean(reachedGeminiFlag),
              protocol: (typeof window !== 'undefined' && window.location) ? window.location.protocol : 'unknown',
              origin: (typeof window !== 'undefined' && window.location) ? window.location.origin : 'unknown',
              model: window.GeminiAIService ? window.GeminiAIService.model : 'unknown',
              isFileProtocol,
              isAppCheckError,
              timestamp: new Date().toISOString()
            },
            status: 'failed',
            failedAt: new Date().toISOString()
          };
        };

        // Step 2: Mandatory App Check token verification BEFORE launching Gemini requests
        if (isFinalSubmission && window.GeminiAIService) {
          const answerMap = { q1: q1Answer, q2: q2Answer, q3: q3Answer };
          const qKeys = ['q1', 'q2', 'q3'];
          const pendingKeys = qKeys.filter(k => {
            const ex = questionsMap[k];
            return !(ex && ex.status === 'evaluated' && ex.answer === answerMap[k] && typeof ex.score === 'number');
          });

          let preflightOk = true;
          if (pendingKeys.length > 0 && typeof window.GeminiAIService.ensureAiReady === 'function') {
            try {
              await window.GeminiAIService.ensureAiReady();
            } catch (preflightErr) {
              preflightOk = false;
              console.error('[GeminiAI] Pre-flight App Check/AI verification failed. Aborting all ungraded Gemini calls:', preflightErr.code || '', preflightErr.message);
              pendingKeys.forEach(qKey => {
                const failedEntry = makeFailedEntry(qKey, answerMap[qKey], preflightErr, false);
                questionsMap[qKey] = failedEntry;
                this.evalQuestionResults[qKey] = failedEntry;
              });
            }
          }

          if (preflightOk) {
            for (let i = 0; i < qKeys.length; i++) {
              const qKey = qKeys[i];
              const ans = answerMap[qKey];
              const existing = questionsMap[qKey];

              // Idempotency guard: skip questions already evaluated for the exact same answer
              if (existing && existing.status === 'evaluated' && existing.answer === ans && typeof existing.score === 'number') {
                console.log(`[GeminiAI] Skipping already-evaluated ${qKey} (idempotent guard). Score: ${existing.score}/${existing.maxScore}`);
                continue;
              }

              if (typeof options.onProgress === 'function') {
                try { options.onProgress(i + 1, qKeys.length, qKey); } catch (e) {}
              }

              try {
                console.log(`[GeminiAI] Evaluating ${qKey} independently for student:`, studentId);
                const qEval = await window.GeminiAIService.evaluateQuestion(qKey, ans);
                questionsMap[qKey] = qEval;
                this.evalQuestionResults[qKey] = qEval;
              } catch (qErr) {
                const isFatalAuth = Boolean(qErr && qErr.isAppCheckFatal) || /appCheck|recaptcha|401/i.test(String(qErr?.code || '') + ' ' + String(qErr?.message || ''));
                const failedEntry = makeFailedEntry(qKey, ans, qErr, !isFatalAuth);
                console.warn(`[GeminiAI] Question ${qKey} evaluation failed (attempt ${failedEntry.errorDetails.attempt}, reachedGemini=${!isFatalAuth}):`, failedEntry.error);
                questionsMap[qKey] = failedEntry;
                this.evalQuestionResults[qKey] = failedEntry;

                // If App Check/authentication failed mid-loop, halt immediately rather than firing hopeless subsequent calls
                if (isFatalAuth) {
                  for (let j = i + 1; j < qKeys.length; j++) {
                    const remKey = qKeys[j];
                    const remExisting = questionsMap[remKey];
                    if (!(remExisting && remExisting.status === 'evaluated' && remExisting.answer === answerMap[remKey])) {
                      const remFail = makeFailedEntry(remKey, answerMap[remKey], qErr, false);
                      questionsMap[remKey] = remFail;
                      this.evalQuestionResults[remKey] = remFail;
                    }
                  }
                  break;
                }
              }
            }
          }

          // Reconcile per-question breakdown and final summary strictly from validated results
          payload.writingEvaluation.questions = questionsMap;
          payload.writingEvaluation.question1Evaluation = questionsMap.q1;
          payload.writingEvaluation.question2Evaluation = questionsMap.q2;
          payload.writingEvaluation.question3Evaluation = questionsMap.q3;

          payload.scoresBreakdown.q1 = (questionsMap.q1.status === 'evaluated' && typeof questionsMap.q1.score === 'number') ? questionsMap.q1.score : null;
          payload.scoresBreakdown.q2 = (questionsMap.q2.status === 'evaluated' && typeof questionsMap.q2.score === 'number') ? questionsMap.q2.score : null;
          payload.scoresBreakdown.q3 = (questionsMap.q3.status === 'evaluated' && typeof questionsMap.q3.score === 'number') ? questionsMap.q3.score : null;
          this.evalScores.q1 = payload.scoresBreakdown.q1;
          this.evalScores.q2 = payload.scoresBreakdown.q2;
          this.evalScores.q3 = payload.scoresBreakdown.q3;

          const evaluatedCount = qKeys.filter(k => questionsMap[k]?.status === 'evaluated' && typeof questionsMap[k]?.score === 'number').length;
          const failedCount = qKeys.filter(k => questionsMap[k]?.status === 'failed').length;

          let summary = null;
          if (evaluatedCount === 3) {
            try {
              summary = window.GeminiAIService.buildEvaluationSummary(questionsMap);
            } catch (sumErr) {
              console.error('[GeminiAI] Rubric validation error while summarizing:', sumErr.message);
            }
          }

          // Strict consistent status reconciliation across top-level status, writingStatus, and writingEvaluation.status
          if (summary && summary.status === 'evaluated') {
            payload.status = 'evaluated';
            payload.writingEvaluation.totalScore = summary.totalScore;
            payload.writingEvaluation.summary = summary;
            payload.writingEvaluation.status = 'evaluated';
            payload.writingStatus = 'evaluated';
            payload.writingScore = summary.totalScore;
            payload.scoresBreakdown.writing = summary.totalScore;
            payload.totalScore = summary.totalScore;
            payload.finalScoreOutOf9 = summary.totalScore;
            payload.maxTotalScore = summary.maxScore || summary.maxTotalScore || (rubric ? rubric.overallMaxScore : 9);
            payload.writingEvaluation.maxScore = payload.maxTotalScore;
            payload.writingEvaluation.criteriaTotals = summary.criteriaTotals || null;
            payload.criteriaTotals = summary.criteriaTotals || null;
            payload.aiEvaluation = summary;
            this.evalScores.writing = summary.totalScore;
            console.log(`[GeminiAI] All 3 questions evaluated independently! Final total: ${summary.totalScore}/${payload.maxTotalScore}`);
          } else {
            const resolvedStatus = failedCount > 0 ? (evaluatedCount > 0 ? 'partial_error' : 'grading_failed') : 'pending';
            payload.status = resolvedStatus;
            payload.writingStatus = resolvedStatus;
            payload.writingEvaluation.status = resolvedStatus;
            payload.writingEvaluation.totalScore = null;
            payload.writingEvaluation.criteriaTotals = { C1: null, C3: null, C6: null };
            payload.writingEvaluation.summary = null;
            payload.writingScore = null;
            payload.scoresBreakdown.writing = null;
            payload.totalScore = null;
            payload.finalScoreOutOf9 = null;
            payload.criteriaTotals = null;
            this.evalScores.writing = null;
          }

          if (typeof window.GeminiAIService.getDiagnostics === 'function') {
            payload.aiDiagnostics = window.GeminiAIService.getDiagnostics();
          }

          // Mark session submitted in memory and clear unfinished active draft immediately
          // (both on complete success and partial/failed grading) so future visits start fresh.
          this.evalPhase = 'submitted';
          this.lastSavedEvaluation = payload;
          this.clearActiveEvaluationDraft();

          // Step 3: Persist updated independent grades + summary + diagnostics to Firestore
          if (window.FirebaseService) {
            try {
              await window.FirebaseService.saveEvaluation(docId, payload);
            } catch (saveErr) {
              console.error('[Firebase] Error saving AI evaluation results:', saveErr);
            }
          }

          // Record submitted summary in separate browser history index
          this.archiveEvaluationToHistory(payload);
        } else if (isFinalSubmission) {
          payload.status = 'grading_failed';
          payload.writingStatus = 'grading_failed';
          payload.writingEvaluation.status = 'grading_failed';
          this.evalPhase = 'submitted';
          this.clearActiveEvaluationDraft();
          this.archiveEvaluationToHistory(payload);
        }

        return payload;
      },

            inp.style.cssText = 'position: absolute; left: ' + f.left + '%; top: ' + f.top + '%; width: ' + f.width + '%; height: ' + f.height + '%; background: transparent; border: none; outline: none; font-family: "Nunito", "Segoe UI", cursive, sans-serif; font-weight: 800; font-size: clamp(15px, 1.9vw, 25px); color: #1e3a8a; padding: 0 8px; box-sizing: border-box; z-index: 25; transition: all 0.15s ease; border-radius: 6px;';

            inp.onfocus = () => {
              playEvalClickSound();
              inp.style.background = 'rgba(37, 99, 235, 0.08)';
              inp.style.boxShadow = '0 0 0 2px rgba(37, 99, 235, 0.35)';
            };
            inp.onblur = () => {
              inp.style.background = 'transparent';
              inp.style.boxShadow = 'none';
            };
            inp.oninput = () => {
              inp.style.border = 'none';
              inp.style.background = 'rgba(37, 99, 235, 0.08)';
            };

            inp.onkeydown = (e) => {
              if (e.key === 'Enter') {
                if (f.id === 'id') {
                  const next = document.getElementById('eval-input-nom');
                  if (next) next.focus();
                } else if (f.id === 'nom') {
                  const next = document.getElementById('eval-input-prenom');
                  if (next) next.focus();
                } else if (f.id === 'prenom') {
                  const next = document.getElementById('eval-input-classe');
                  if (next) next.focus();
                } else if (f.id === 'classe') {
                  if (validateFn && validateFn()) {
                    playEvalClickSound();
                    this.currentExIndex++;
                    this.loadEvaluationActivity();
                  }
                }
              }
            };

            inputEls[f.id] = inp;
            imgContainer.appendChild(inp);
          });

          setTimeout(() => {
            const firstEmpty = activity.fields.find(f => !inputEls[f.id].value.trim());
            if (firstEmpty && inputEls[firstEmpty.id]) {
              inputEls[firstEmpty.id].focus();
            }
          }, 150);

          validateFn = () => {
            const missing = [];
            const collected = {};

            activity.fields.forEach(f => {
              const el = inputEls[f.id];
              const val = el ? el.value.trim() : '';
              collected[f.id] = val;
              if (f.required && !val) {
                missing.push(f.label);
                if (el) {
                  el.style.border = '2px solid #ef4444';
                  el.style.background = 'rgba(239, 68, 68, 0.12)';
                  el.animate([
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-3px)' },
                    { transform: 'translateX(3px)' },
                    { transform: 'translateX(0)' }
                  ], { duration: 250 });
                }
              } else if (el) {
                el.style.border = 'none';
              }
            });

            if (missing.length > 0) {
              showFeedback("⚠️ Remplis tous les champs obligatoires (" + missing.join(', ') + ") pour commencer !");
              const firstMiss = activity.fields.find(f => !collected[f.id]);
              if (firstMiss && inputEls[firstMiss.id]) {
                inputEls[firstMiss.id].focus();
              }
              return false;
            }

            this.evalAnswers.profile = collected;
            this.evalPhase = 'draft';
            this.saveEvaluationSession();

            this.submitEvaluationToFirestore('started').catch(err => {
              console.warn('[Firebase] Initial student sync notice:', err);
            });

            return true;
          };

          // Overlay Valider button on profile card bottom
          if (activity.valBtnPos) {

            btnWrapper.style.cssText = 'position: absolute; left: ' + activity.valBtnPos.left + '%; top: ' + activity.valBtnPos.top + '%; transform: translate(-50%, -50%); z-index: 80;';

          const hasDraftProfile = Boolean(profileData && (profileData.id || profileData.nom || profileData.prenom));

            clearDraftBtn.onclick = () => {

            `width: ${wb.width}%`,

            'background: transparent',
            'border: none',
            'outline: none',

            'font-family: "Nunito", "Segoe UI", "Comic Sans MS", sans-serif',

          vbtn.onmouseenter = () => { vbtn.style.transform = 'scale(1.06)'; vbtn.style.filter = 'brightness(1.08) drop-shadow(0 6px 14px rgba(0,0,0,0.34))'; };

          vbtn.onclick = async () => {

              this.submitEvaluationToFirestore('in_progress').catch(err => {

          valBtnWrapper.appendChild(vbtn);

          btnBack.draggable = false;
          btnBack.style.cssText = [
            'position: absolute',
            'left: -8.4%',
            'top: 6.4%',
            'width: 10.8%',
            'height: 10.7%',
            'object-fit: contain',
            'cursor: pointer',
            'z-index: 90',
            'filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35))',
            'transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease'

          btnBack.onmouseenter = () => { btnBack.style.transform = 'scale(1.1) translateY(-2px)'; btnBack.style.filter = 'drop-shadow(0 6px 14px rgba(0,0,0,0.45))'; };
          btnBack.onmouseleave = () => { btnBack.style.transform = 'scale(1)'; btnBack.style.filter = 'drop-shadow(0 4px 10px rgba(0,0,0,0.35))'; };
          btnBack.onmousedown = () => { btnBack.style.transform = 'scale(0.95) translateY(1px)'; };
          btnBack.onclick = (e) => {
            e.stopPropagation();
            if (this._evalSubmitting) return;
            playEvalClickSound();

              this.currentExIndex--;
              this.loadEvaluationActivity();

          imgContainer.appendChild(btnBack);

          wrapper.appendChild(imgContainer);

          // Focus textarea smoothly
          setTimeout(() => textarea.focus(), 120);
        } else {
          wrapper.appendChild(imgContainer);
        }

        container.appendChild(wrapper);

      /**
       * Creates and attaches a fullscreen canvas fireworks controller to a modal element.
       * Exposes start() and stop() so callers can trigger bursts conditionally (e.g. score >= 6).
       */
      createModalFireworksController(modal) {
        const canvas = document.createElement('canvas');
        canvas.id = 'j1-fireworks-canvas';
        canvas.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;';
        modal.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();

        let particles = [];
        let animId = null;
        let burstTimer = null;
        const initTimers = [];
        let isRunning = false;
        let isTabVisible = !document.hidden;
        const MAX_PARTICLES = 300;

        const palettes = [
          ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ffffff', '#ffd32a'],
          ['#e056fd', '#f0932b', '#6ab04c', '#22a6b3', '#ffffff', '#ffbe76'],
          ['#ff3838', '#ff9f1a', '#fff200', '#17c0eb', '#ffffff', '#c56cf0']
        ];

        const playFireworkBurstSound = () => {
          try {
            const audioCtx = (window.SoundSystem && window.SoundSystem.ctx) ||
              (window.evalAudioCtx = window.evalAudioCtx || new (window.AudioContext || window.webkitAudioContext)());
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260 + Math.random() * 90, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            const chime = audioCtx.createOscillator();
            const chimeGain = audioCtx.createGain();
            chime.type = 'sine';
            const notes = [784, 880, 1046.5, 1174.6, 1318.5, 1567.98, 1760];
            chime.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now + 0.03);
            chimeGain.gain.setValueAtTime(0.05, now + 0.03);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            chime.connect(chimeGain);
            chimeGain.connect(audioCtx.destination);
            chime.start(now + 0.03);
            chime.stop(now + 0.32);
          } catch (e) {}
        };

        const createBurst = (x, y) => {
          if (!isRunning || !isTabVisible || particles.length > MAX_PARTICLES) return;
          const palette = palettes[Math.floor(Math.random() * palettes.length)];
          const particleCount = 38 + Math.floor(Math.random() * 20);
          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2.2 + Math.random() * 6.5;
            particles.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 2 + Math.random() * 3,
              color: palette[Math.floor(Math.random() * palette.length)],
              alpha: 1,
              decay: 0.015 + Math.random() * 0.018,
              sparkle: Math.random() > 0.4
            });
          }
          playFireworkBurstSound();
        };

        const stop = () => {
          isRunning = false;
          while (initTimers.length) clearTimeout(initTimers.pop());
          if (burstTimer) { clearTimeout(burstTimer); burstTimer = null; }
          if (animId) { cancelAnimationFrame(animId); animId = null; }
          particles = [];
          window.removeEventListener('resize', resizeCanvas);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };

        const loop = () => {
          if (!isRunning || !modal.isConnected) {
            stop();
            return;
          }
          if (!isTabVisible) {
            animId = null;
            return;
          }
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.sparkle ? p.alpha * (0.6 + 0.4 * Math.sin(Date.now() * 0.03 + i)) : p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
          animId = requestAnimationFrame(loop);
        };

        const scheduleBurst = () => {
          if (!isRunning || !modal.isConnected) {
            stop();
            return;
          }
          if (isTabVisible && particles.length < MAX_PARTICLES) {
            createBurst(
              canvas.width * (0.15 + Math.random() * 0.70),
              canvas.height * (0.15 + Math.random() * 0.40)
            );
          }
          burstTimer = setTimeout(scheduleBurst, 600 + Math.random() * 450);
        };

        const handleVisibilityChange = () => {
          if (document.hidden) {
            isTabVisible = false;
            particles = [];
            if (animId) {
              cancelAnimationFrame(animId);
              animId = null;
            }
          } else {
            isTabVisible = true;
            particles = [];
            if (isRunning && !animId && modal.isConnected) {
              animId = requestAnimationFrame(loop);
            }
          }
        };

        const start = () => {
          if (isRunning) return;
          isRunning = true;
          resizeCanvas();
          window.addEventListener('resize', resizeCanvas);
          document.addEventListener('visibilitychange', handleVisibilityChange);
          loop();
          initTimers.push(setTimeout(() => createBurst(canvas.width * 0.22, canvas.height * 0.30), 80));
          initTimers.push(setTimeout(() => createBurst(canvas.width * 0.78, canvas.height * 0.30), 280));
          initTimers.push(setTimeout(() => createBurst(canvas.width * 0.50, canvas.height * 0.18), 480));
          burstTimer = setTimeout(scheduleBurst, 900);
        };

        return { start, stop };
      },

      showEvaluationSuccessPopup() {
        if (this._evalShowingSuccess) return;
        this._evalShowingSuccess = true;

        const CONTINUER_IMAGES = [
          'contiuer/bien joue.png',
          'contiuer/excellent.png',
          'contiuer/parfait.png',
          'contiuer/super.png'
        ];

        // Shuffle deck: cycles through all 4 celebration photos in randomized order before repeating
        if (!this.evalSuccessDeck || this.evalSuccessDeck.length === 0) {
          const deck = [...CONTINUER_IMAGES];
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
          if (deck[0] === this.lastEvalSuccessCard && deck.length > 1) {
            const swapIdx = 1 + Math.floor(Math.random() * (deck.length - 1));
            [deck[0], deck[swapIdx]] = [deck[swapIdx], deck[0]];
          }
          this.evalSuccessDeck = deck;
        }

        const chosenSrc = this.evalSuccessDeck.shift();
        this.lastEvalSuccessCard = chosenSrc;

        // Play specific celebration audio corresponding to the chosen photo
        const AUDIO_MAP = {
          'contiuer/bien joue.png': 'contiuer/bien joue.mp3',
          'contiuer/excellent.png': 'contiuer/excellent.mp3',
          'contiuer/parfait.png': 'contiuer/parfait.mp3',
          'contiuer/super.png': 'contiuer/super.mp3'
        };

        let cardAudio = null;
        const targetAudioSrc = AUDIO_MAP[chosenSrc];
        if (targetAudioSrc) {
          try {
            if (window.evalCurrentAudio) {
              window.evalCurrentAudio.pause();
              window.evalCurrentAudio = null;
            }
            cardAudio = new Audio(encodeURI(targetAudioSrc));
            window.evalCurrentAudio = cardAudio;
            cardAudio.play().catch(err => console.log('Card celebration audio playback deferred or blocked:', err));
          } catch (e) {
            console.warn('Card audio play error:', e);
          }
        } else if (window.SoundSystem && typeof window.SoundSystem.playSuccess === 'function') {
          window.SoundSystem.playSuccess();
        }

        // Remove any pre-existing modal if present
        const oldModal = document.getElementById('eval-success-modal');
        if (oldModal) oldModal.remove();

        // FULL SCREEN MODAL: attached to document.body so the blur covers the entire website!
        const modal = document.createElement('div');
        modal.id = 'eval-success-modal';
        modal.className = 'j1-success-modal show';

        const fireworks = this.createModalFireworksController(modal);
        fireworks.start();

        // Center Celebration Card (exact same sizing and styles as other journeys)
        const cardBox = document.createElement('div');
        cardBox.className = 'j1-success-card-box';

        const cardImg = document.createElement('img');
        cardImg.className = 'j1-success-card-img';
        cardImg.src = chosenSrc;
        cardImg.alt = 'Bravo !';
        cardImg.draggable = false;

        const continueBtn = document.createElement('button');
        continueBtn.className = 'j1-success-continue-btn';
        continueBtn.setAttribute('title', 'Continuer vers la prochaine activité');
        continueBtn.setAttribute('aria-label', 'Continuer');

        let clicked = false;
        continueBtn.onclick = (e) => {
          e.stopPropagation();
          if (clicked) return;
          clicked = true;
          this._evalShowingSuccess = false;

          if (typeof playEvalClickSound === 'function') {
            playEvalClickSound();
          }

          modal.classList.remove('show');
          cardBox.style.transform = 'scale(0.85)';
          cardBox.style.opacity = '0';
          cardBox.style.transition = 'transform 0.2s ease, opacity 0.2s ease';

          if (cardAudio) {
            try {
              cardAudio.pause();
              cardAudio.currentTime = 0;
            } catch (e) {}
            cardAudio = null;
          }
          if (window.evalCurrentAudio) {
            try {
              window.evalCurrentAudio.pause();
              window.evalCurrentAudio = null;
            } catch (e) {}
          }

          setTimeout(() => {
            fireworks.stop();
            modal.remove();

            this.currentExIndex++;
            this.loadEvaluationActivity();
          }, 240);
        };

        cardBox.appendChild(cardImg);
        cardBox.appendChild(continueBtn);
        modal.appendChild(cardBox);
        document.body.appendChild(modal);

        requestAnimationFrame(() => {
          modal.classList.add('show');
        });
      },

      async showEvaluationEndCelebration() {
        const container = document.getElementById('exercise-content-area');
        if (container) container.innerHTML = '';

        const oldModal = document.getElementById('j1-success-modal');
        if (oldModal) oldModal.remove();

        const fmtScore = (n) => {
          if (typeof n !== 'number' || Number.isNaN(n)) return '--';
          const r = Math.round((n + Number.EPSILON) * 100) / 100;
          return Number.isInteger(r) ? String(r) : String(r);
        };

        // Fullscreen blurred celebration modal matching other journeys; clicking anywhere exits to the map
        const modal = document.createElement('div');
        modal.id = 'j1-success-modal';
        modal.className = 'j1-success-modal';
        modal.style.cursor = 'pointer';
        modal.setAttribute('title', "Cliquer n'importe où pour retourner à la carte");

        const fireworks = this.createModalFireworksController(modal);

        const cardBox = document.createElement('div');
        cardBox.id = 'eval-end-card-box';
        cardBox.style.cssText = 'position: relative; display: inline-block; max-width: 92vw; max-height: 84vh; z-index: 10; animation: j1CardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; cursor: pointer;';

        const cardImg = document.createElement('img');
        cardImg.className = 'j1-success-card-img';
        cardImg.src = 'evalution/pop up end.png';
        cardImg.alt = 'Félicitations !';
        cardImg.draggable = false;
        cardImg.style.cssText = 'display: block; max-width: 92vw; max-height: 84vh; width: auto; height: auto; filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.7));';
        cardBox.appendChild(cardImg);

        const syncCardSizeVars = () => {
          const w = cardImg.clientWidth || cardImg.getBoundingClientRect().width;
          const h = cardImg.clientHeight || cardImg.getBoundingClientRect().height;
          if (w > 0 && h > 0) {
            cardBox.style.setProperty('--img-width', w + 'px');
            cardBox.style.setProperty('--img-height', h + 'px');
          }
        };
        const ro = new ResizeObserver(syncCardSizeVars);
        ro.observe(cardImg);
        cardImg.addEventListener('load', syncCardSizeVars);

        // Score displayed left of '/' and max score displayed right of '/' inside the purple dashed pill on pop up end.png
        const scoreBox = document.createElement('div');
        scoreBox.id = 'eval-final-score-box';
        scoreBox.style.cssText = 'position: absolute; left: 40.0%; top: 59.5%; width: 14.8%; height: 14.0%; display: flex; align-items: center; justify-content: flex-end; z-index: 50; pointer-events: none; user-select: none; font-family: "Segoe UI", "Nunito", Arial, sans-serif; font-weight: 900; font-size: clamp(24px, calc(var(--img-height, 550px) * 0.12), 74px); color: #3b1b49; line-height: 1;';
        scoreBox.textContent = '...';
        cardBox.appendChild(scoreBox);

        const maxBox = document.createElement('div');
        maxBox.id = 'eval-final-max-box';
        maxBox.style.cssText = 'position: absolute; left: 59.3%; top: 59.5%; width: 11.2%; height: 14.0%; display: flex; align-items: center; justify-content: flex-start; z-index: 50; pointer-events: none; user-select: none; font-family: "Segoe UI", "Nunito", Arial, sans-serif; font-weight: 900; font-size: clamp(24px, calc(var(--img-height, 550px) * 0.12), 74px); color: #3b1b49; line-height: 1;';
        maxBox.textContent = '9';
        cardBox.appendChild(maxBox);

        let clicked = false;
        const doFinish = (e) => {
          if (e) e.stopPropagation();
          if (clicked) return;
          clicked = true;

          if (window.SoundSystem && typeof window.SoundSystem.playClick === 'function') {
            window.SoundSystem.playClick();
          } else if (typeof playEvalClickSound === 'function') {
            playEvalClickSound();
          }

          modal.classList.remove('show');
          cardBox.style.transform = 'scale(0.85)';
          cardBox.style.opacity = '0';
          cardBox.style.transition = 'transform 0.2s ease, opacity 0.2s ease';

          if (window.evalCurrentAudio) {
            try {
              window.evalCurrentAudio.pause();
              window.evalCurrentAudio.currentTime = 0;
            } catch (err) {}
            window.evalCurrentAudio = null;
          }

          fireworks.stop();
          ro.disconnect();
          this.clearActiveEvaluationDraft();
          this.resetInMemoryEvaluationState();

          setTimeout(() => {
            modal.remove();
            this.close();
          }, 240);
        };

        cardBox.onclick = doFinish;
        modal.onclick = doFinish;

        modal.appendChild(cardBox);
        document.body.appendChild(modal);

        requestAnimationFrame(() => {
          modal.classList.add('show');
        });

        // Authoritative score retrieval from Firestore (no hardcoded scores, no Gemini call on load)
        const docId = this.lastEvalDocId || this.getEvaluationDocId();
        let fsDoc = null;
        let fetchFailed = false;

        if (window.FirebaseService && typeof window.FirebaseService.getEvaluation === 'function') {
          try {
            const readRes = await window.FirebaseService.getEvaluation(docId);
            if (readRes && readRes.success && readRes.exists && readRes.data) {
              fsDoc = readRes.data;
            } else if (!readRes || !readRes.success) {
              fetchFailed = true;
            }
          } catch (readErr) {
            console.warn('[Results] Error retrieving evaluation from Firestore:', readErr);
            fetchFailed = true;
          }
        } else {
          fetchFailed = true;
        }

        if (clicked || !modal.isConnected) return;

        const effectiveDoc = fsDoc || (this.lastSavedEvaluation && this.lastSavedEvaluation.docId === docId ? this.lastSavedEvaluation : null);
        const writingEval = effectiveDoc && effectiveDoc.writingEvaluation ? effectiveDoc.writingEvaluation : null;
        const qMap = writingEval && writingEval.questions ? writingEval.questions : {};
        const qKeys = ['q1', 'q2', 'q3'];
        const rubric = window.EVALUATION_RUBRIC_CONFIG;
        const helper = window.EvaluationRubricHelper;
        const expectedMax = helper ? helper.resolveEvaluationMaxScore(effectiveDoc) : (rubric ? rubric.overallMaxScore : 9);

        maxBox.style.fontSize = String(fmtScore(expectedMax)).length >= 2
          ? 'clamp(22px, calc(var(--img-height, 550px) * 0.105), 64px)'
          : 'clamp(24px, calc(var(--img-height, 550px) * 0.12), 74px)';
        maxBox.textContent = fmtScore(expectedMax);

        const qStates = qKeys.map((k) => {
          const entry = qMap[k] || {};
          const cfgMax = helper
            ? helper.resolveQuestionMaxScore(effectiveDoc, k, entry)
            : (rubric && rubric.questions[k] ? rubric.questions[k].maxScore : 3);
          const maxScore = (typeof entry.maxScore === 'number' && entry.maxScore > 0) ? entry.maxScore : cfgMax;
          const isEvaluated = entry.status === 'evaluated' && typeof entry.score === 'number' && !Number.isNaN(entry.score) && entry.score >= 0 && entry.score <= maxScore;
          return {
            score: entry.score,
            maxScore,
            isEvaluated
          };
        });

        const maxSum = Math.round((qStates.reduce((acc, q) => acc + q.maxScore, 0) + Number.EPSILON) * 100) / 100;
        const allEvaluated = !fetchFailed && Boolean(fsDoc) && qStates.every(q => q.isEvaluated) && Math.abs(maxSum - expectedMax) <= 0.01;

        if (allEvaluated) {
          // Compute overall total strictly as sum of the 3 saved Firebase question scores (capped at expectedMax)
          const rawTotal = Math.round((qStates.reduce((acc, q) => acc + q.score, 0) + Number.EPSILON) * 100) / 100;
          const overallTotal = Math.max(0, Math.min(expectedMax, rawTotal));
          const totalDisplay = fmtScore(overallTotal);

          scoreBox.style.fontSize = totalDisplay.length >= 3
            ? 'clamp(20px, calc(var(--img-height, 550px) * 0.092), 54px)'
            : 'clamp(26px, calc(var(--img-height, 550px) * 0.12), 74px)';
          scoreBox.textContent = totalDisplay;

          // Trigger fireworks and celebration audio when overall score is 6 or above
          if (overallTotal >= 6) {
            fireworks.start();
            try {
              if (window.evalCurrentAudio) {
                window.evalCurrentAudio.pause();
                window.evalCurrentAudio = null;
              }
              window.evalCurrentAudio = new Audio(encodeURI('contiuer/Felicitation.mp3'));
              window.evalCurrentAudio.play().catch(() => {});
            } catch (e) {}
          }
        } else {
          // Incomplete, failed, or unreachable Firestore read: NEVER fabricate a total score
          scoreBox.style.fontSize = 'clamp(22px, calc(var(--img-height, 550px) * 0.085), 56px)';
          scoreBox.textContent = '--';
        }
      },

      async openEvaluationHistoryModal() {
        const prev = document.getElementById('eval-history-modal');
        if (prev) prev.remove();

        const overlay = document.createElement('div');
        overlay.id = 'eval-history-modal';
        overlay.style.cssText = 'position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(5px); z-index: 9999999; display: flex; align-items: center; justify-content: center; padding: 18px; box-sizing: border-box;';

        const card = document.createElement('div');
        card.style.cssText = 'background: #ffffff; border-radius: 22px; max-width: 700px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 22px 26px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); font-family: "Nunito", "Segoe UI", sans-serif; color: #1e293b;';

        const header = document.createElement('div');
        header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e2e8f0; padding-bottom:12px; margin-bottom:14px;';
        const title = document.createElement('h2');
        title.style.cssText = 'margin:0; font-size:20px; color:#1e3a8a;';
        title.textContent = '📂 Évaluations enregistrées';
        const closeBtn = document.createElement('button');
        closeBtn.textContent = '✖';
        closeBtn.style.cssText = 'width:36px; height:36px; border-radius:50%; border:none; background:#ef4444; color:#fff; font-weight:bold; cursor:pointer; font-size:16px;';
        closeBtn.onclick = () => overlay.remove();
        header.appendChild(title);
        header.appendChild(closeBtn);
        card.appendChild(header);

        const body = document.createElement('div');
        body.innerHTML = '<div style="padding:20px; text-align:center; color:#64748b; font-weight:700;">⏳ Chargement depuis Firebase...</div>';
        card.appendChild(body);
        overlay.appendChild(card);
        document.body.appendChild(overlay);
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

        let history = [];
        try {
          if (window.FirebaseService && typeof window.FirebaseService.listEvaluations === 'function') {
            const res = await window.FirebaseService.listEvaluations(300);
            if (res && res.success && Array.isArray(res.items)) {
              history = res.items;
            }
          }
        } catch (e) {}

        title.textContent = `📂 Évaluations enregistrées (${history.length})`;
        body.innerHTML = '';

        if (history.length === 0) {
          const empty = document.createElement('div');
          empty.style.cssText = 'padding:20px; text-align:center; color:#64748b; font-weight:700;';
          empty.textContent = 'Aucune évaluation enregistrée dans Firebase.';
          body.appendChild(empty);
          return;
        }

        history.forEach(item => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border:1.5px solid #cbd5e1; border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#f8fafc;';

          const left = document.createElement('div');
          const nameLine = document.createElement('div');
          nameLine.style.cssText = 'font-weight:800; font-size:15px; color:#0f172a;';
          nameLine.textContent = `${item.studentPrenom || ''} ${item.studentNom || ''} (ID: ${item.studentId || 'ANON'}, ${item.studentClasse || 'N/A'})`.trim();
          left.appendChild(nameLine);

          const right = document.createElement('div');
          right.style.cssText = 'display:flex; align-items:center; gap:8px;';
          const statusBadge = document.createElement('span');
          const ok = item.writingStatus === 'evaluated' && typeof item.totalScore === 'number';
          const helper = window.EvaluationRubricHelper;
          const itemMax = (typeof item.maxTotalScore === 'number' && item.maxTotalScore > 0)
            ? item.maxTotalScore
            : (helper ? helper.resolveEvaluationMaxScore(item) : 9);
          statusBadge.style.cssText = `padding:5px 10px; border-radius:9999px; font-weight:800; font-size:13px; background:${ok ? '#ecfdf5' : '#fef2f2'}; color:${ok ? '#065f46' : '#991b1b'}; border:1.5px solid ${ok ? '#6ee7b7' : '#fca5a5'};`;
          statusBadge.textContent = ok ? `✅ ${item.totalScore} / ${itemMax}` : '⚠️ Incomplète';
          right.appendChild(statusBadge);

          const viewBtn = document.createElement('button');
          viewBtn.type = 'button';
          viewBtn.textContent = 'Ouvrir';
          viewBtn.style.cssText = 'padding:6px 12px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-weight:800; font-size:12px; cursor:pointer;';
          viewBtn.onclick = async () => {
            viewBtn.disabled = true;
            viewBtn.textContent = '...';
            try {
              if (window.FirebaseService && typeof window.FirebaseService.getEvaluation === 'function') {
                const res = await window.FirebaseService.getEvaluation(item.docId);
                if (res && res.success && res.exists && res.data) {
                  overlay.remove();
                  this.lastEvalDocId = item.docId;
                  this.evalSessionId = res.data.sessionId || item.sessionId;
                  this.evalPhase = 'submitted';
                  this.lastSavedEvaluation = res.data;
                  this.showEvaluationEndCelebration();
                  return;
                }
              }
            } catch (e) {}
            viewBtn.disabled = false;
            viewBtn.textContent = 'Indisponible';
          };
          right.appendChild(viewBtn);

          row.appendChild(left);
          row.appendChild(right);
          body.appendChild(row);
        });
      },

      openEvaluationDetailsModal(fsDoc, overallTotal) {
        const prev = document.getElementById('eval-details-modal');
        if (prev) prev.remove();

        const overlay = document.createElement('div');
        overlay.id = 'eval-details-modal';
        overlay.style.cssText = 'position: fixed; inset: 0; background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(5px); z-index: 9999999; display: flex; align-items: center; justify-content: center; padding: 18px; box-sizing: border-box;';

        const card = document.createElement('div');
        card.style.cssText = 'background: #ffffff; border-radius: 22px; max-width: 780px; width: 100%; max-height: 86vh; overflow-y: auto; padding: 22px 26px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); font-family: "Nunito", "Segoe UI", sans-serif; color: #1e293b;';

        const escapeHtml = (s) => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const writingEval = (fsDoc && fsDoc.writingEvaluation) || {};
        const questions = writingEval.questions || {};
        const headerHtml = `
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #e2e8f0; padding-bottom:12px; margin-bottom:16px;">
            <div>
              <h2 style="margin:0; font-size:20px; color:#1e3a8a;">📋 Correction détaillée — Total : ${escapeHtml(overallTotal)} / ${escapeHtml(window.EvaluationRubricHelper ? window.EvaluationRubricHelper.resolveEvaluationMaxScore(fsDoc) : (fsDoc && fsDoc.maxTotalScore === 10 ? 10 : 9))}${(window.EvaluationRubricHelper ? window.EvaluationRubricHelper.resolveEvaluationMaxScore(fsDoc) === 10 : (fsDoc && fsDoc.maxTotalScore === 10)) ? ' <span style="font-size:12px; background:#fef3c7; color:#92400e; padding:3px 8px; border-radius:9999px; margin-left:6px; vertical-align:middle;">Ancien barème /10</span>' : ''}</h2>
              <div style="font-size:13px; color:#64748b; margin-top:4px;">Élève : ${escapeHtml(fsDoc.studentPrenom || '')} ${escapeHtml(fsDoc.studentNom || '')} (${escapeHtml(fsDoc.studentClasse || '')})</div>
            </div>
            <button id="eval-details-close" style="width:36px; height:36px; border-radius:50%; border:none; background:#ef4444; color:#fff; font-weight:bold; cursor:pointer; font-size:16px;">✖</button>
          </div>`;

        const rubricHelper = window.EvaluationRubricHelper;
        const resolvedMaxTotal = rubricHelper ? rubricHelper.resolveEvaluationMaxScore(fsDoc) : 9;
        const resolvedRubricVer = rubricHelper ? rubricHelper.resolveRubricVersion(fsDoc) : '4eme_officiel_v2_9pts';
        const isLegacyV1 = resolvedRubricVer === '4eme_officiel_v1' || resolvedMaxTotal === 10;
        const cardsHtml = ['q1', 'q2', 'q3'].map((k, idx) => {
          const q = questions[k] || {};
          const critOrder = isLegacyV1 ? ['C1', 'C3', 'C6', 'C7'] : ['C1', 'C3', 'C6'];
          const orderedCrits = Object.values(q.criteria || {})
            .filter(c => c && c.code && critOrder.includes(c.code))
            .sort((a, b) => critOrder.indexOf(a.code) - critOrder.indexOf(b.code));
          const critHtml = orderedCrits.map(c =>
            `<div style="font-size:13px; margin:4px 0;">• <strong>${escapeHtml(c.code)} — ${escapeHtml(c.name)} :</strong> <span style="color:#1d4ed8; font-weight:800;">${escapeHtml(c.score)} / ${escapeHtml(c.max)}</span>${c.justification ? ` — ${escapeHtml(c.justification)}` : ''}</div>`
          ).join('');
          const indOrder = ['C2', 'C4', 'C5'];
          const orderedInds = isLegacyV1
            ? Object.values(q.indicators || {}).sort((a, b) => indOrder.indexOf(a.code) - indOrder.indexOf(b.code))
            : [];
          const indHtml = orderedInds.map(ind =>
            `<span style="display:inline-block; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:3px 8px; font-size:12px; margin:2px 4px 2px 0;"><strong>${escapeHtml(ind.code)} (${escapeHtml(ind.name)}) :</strong> ${escapeHtml(ind.level)}${ind.observation ? ` — ${escapeHtml(ind.observation)}` : ''}</span>`
          ).join('');
          const mistakesHtml = (q.mistakes || []).length
            ? `<div style="margin-top:6px; font-size:13px; color:#991b1b;"><strong>Erreurs relevées :</strong><ul style="margin:4px 0 0 18px; padding:0;">${q.mistakes.map(m => `<li>« ${escapeHtml(m.original)} » → <strong>${escapeHtml(m.correction)}</strong> (${escapeHtml(m.explanation)})</li>`).join('')}</ul></div>`
            : '';

          return `
            <div style="border:2px solid #dbeafe; border-radius:16px; padding:14px 16px; margin-bottom:14px; background:#f8fafc;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <strong style="font-size:16px; color:#0f172a;">Question ${idx + 1} : ${escapeHtml(q.questionText || '')}</strong>
                <span style="background:#dbeafe; color:#1e40af; padding:4px 12px; border-radius:9999px; font-weight:900;">${escapeHtml(q.score)} / ${escapeHtml(q.maxScore)}</span>
              </div>
              <div style="background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:8px 12px; margin-bottom:8px; font-size:14px;">
                <strong>Ta réponse :</strong> « ${escapeHtml(q.answer || '')} »
              </div>
              ${critHtml}
              <div style="margin-top:6px;">${indHtml}</div>
              ${mistakesHtml}
              ${q.suggestedCorrection ? `<div style="margin-top:6px; font-size:13px; color:#065f46;"><strong>Exemple de correction :</strong> « ${escapeHtml(q.suggestedCorrection)} »</div>` : ''}
              ${q.feedback ? `<div style="margin-top:6px; font-size:13px; color:#334155;"><strong>Avis du maître :</strong> ${escapeHtml(q.feedback)}</div>` : ''}
            </div>`;
        }).join('');

        card.innerHTML = headerHtml + cardsHtml;
        overlay.appendChild(card);
        document.body.appendChild(overlay);

        document.getElementById('eval-details-close').onclick = () => overlay.remove();
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
      }

    };
    window.ExerciseSystem = ExerciseSystem;

    document.addEventListener('DOMContentLoaded', () => {
      MapSystem.init();
    });
  </script>
  <script src="ambient_life.js"></script>
  <script src="sound_system.js"></script>
  <script src="dev_overlay.js"></script>
</body>

</html>

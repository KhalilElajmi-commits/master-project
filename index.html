<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royaume des Connaissances</title>
  <meta name="description" content="Royaume des Connaissances – Application éducative interactive." />

  <!-- Premium Friendly & Smooth French Educational Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700;800&family=Outfit:wght@600;700;800;900&display=swap"
    rel="stylesheet" />

  <style>
    /* ─── Reset & Base ──────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', 'Quicksand', 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: #15457a;
    }

    /* ─── Viewport Stage ────────────────────────────────────────────── */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* ─── Background World & Camera Zoom ────────────────────────────── */
    #initial-bg {
      position: absolute;
      top: -4%;
      left: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 1s ease;
      animation: homeBgSway 32s ease-in-out infinite alternate;
      will-change: transform;
      pointer-events: none;
    }

    @keyframes homeBgSway {
      0% {
        transform: translate3d(2.2%, 0.8%, 0) scale(1.02);
      }
      50% {
        transform: translate3d(-1.8%, -0.6%, 0) scale(1.04);
      }
      100% {
        transform: translate3d(2.2%, 0.8%, 0) scale(1.02);
      }
    }

    #home-ambient-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      transition: opacity 1.2s ease;
    }

    /* Ambient Life canvas (wind gusts, seagulls, sun motes) – driven by ambient_life.js */
    #home-ambient-canvas,
    #map-ambient-canvas,
    .ambient-canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }
    #map-ambient-canvas {
      z-index: 6;
    }

    /* Ocean Surface Sparkles */
    .sea-sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      background: radial-gradient(circle, #ffffff 0%, rgba(186, 230, 253, 0.85) 45%, rgba(255, 255, 255, 0) 75%);
      border-radius: 50%;
      animation: seaTwinkle 4.2s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95));
    }

    @keyframes seaTwinkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0.2) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.25) rotate(45deg);
      }
    }

    /* Soft Ambient Sunlight Caustics / Subtle Warm Sunbeam */
    .ambient-sun-glow {
      position: absolute;
      top: -10%;
      right: -10%;
      width: 65vw;
      height: 65vh;
      background: radial-gradient(circle at 80% 20%, rgba(254, 243, 199, 0.16) 0%, rgba(254, 215, 170, 0.08) 40%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      animation: sunGlowPulse 8s ease-in-out infinite alternate;
    }

    @keyframes sunGlowPulse {
      0% {
        opacity: 0.65;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    #world-camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transform: scale(1.18);
      transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    #world-camera.camera-zoom-out {
      transform: scale(1.0);
    }

    #map-world-content {
      position: absolute;
      top: -3%;
      left: -3%;
      width: 106%;
      height: 106%;
      animation: mapWorldSway 32s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes mapWorldSway {
      0% {
        transform: translate3d(1.8%, 0.6%, 0) scale(1.015);
      }
      50% {
        transform: translate3d(-1.4%, -0.5%, 0) scale(1.035);
      }
      100% {
        transform: translate3d(1.8%, 0.6%, 0) scale(1.015);
      }
    }

    #bg-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }

    /* ─── Cloud Layer ───────────────────────────────────────────────── */
    #clouds-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .cloud-wrap {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    .cloud-wrap.entering {
      transition: transform 2.2s cubic-bezier(0.2, 0.9, 0.3, 1),
        opacity 1.8s ease;
    }

    .cloud-wrap.reacting {
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    }

    .cloud-wrap.closing {
      transition: transform 2s cubic-bezier(0.65, 0, 0.15, 1) !important;
    }

    .cloud-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      /* Super soft edges for clouds to blend perfectly */
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    }

    /* To avoid hard masking on purely pure clouds, we only apply a very subtle mask or skip it for large pieces */
    .pure-edge {
      mask-image: none !important;
      -webkit-mask-image: none !important;
    }

    /* ─── Cloud Final Resting Positions (Massively dense coverage) ─── */
    /* LEFT SIDE */
    #cw-left-1 {
      /* Main TL Corner */
      top: -15%;
      left: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 25;
    }

    #cw-left-2 {
      /* Mid Left fill - shifted further left to hide cut edge */
      top: 25%;
      left: -20%;
      width: clamp(400px, 50vw, 750px);
      z-index: 24;
    }

    #cw-left-3 {
      /* Bottom Left Corner */
      bottom: -15%;
      left: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 26;
    }

    #cw-left-4 {
      /* Extra left edge density using pure cloud to cover gap */
      top: 40%;
      left: -18%;
      width: clamp(350px, 45vw, 650px);
      z-index: 22;
      transform-origin: center left;
    }

    /* RIGHT SIDE */
    #cw-right-1 {
      /* Main TR Corner */
      top: -15%;
      right: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 25;
    }

    #cw-right-2 {
      /* Mid Right fill */
      top: 20%;
      right: -15%;
      width: clamp(350px, 45vw, 650px);
      z-index: 24;
    }

    #cw-right-3 {
      /* Bottom Right Corner */
      bottom: -15%;
      right: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 26;
    }

    #cw-right-4 {
      /* Extra right edge density */
      top: 45%;
      right: -20%;
      width: clamp(400px, 50vw, 700px);
      z-index: 22;
      transform-origin: center right;
    }

    /* TOP & BOTTOM FILL */
    #cw-top-fill {
      top: -6%;
      left: 18%;
      width: clamp(500px, 64vw, 960px);
      z-index: 24;
    }

    #cw-bottom-fill {
      bottom: -15%;
      left: 10%;
      width: clamp(500px, 80vw, 1200px);
      z-index: 24;
    }

    /* ─── Constant Idle Floating ─────────────────────────────────────── */
    @keyframes floatVertical {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(15px);
      }
    }

    @keyframes floatVerticalRev {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-15px);
      }
    }

    @keyframes floatHorizontal {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(12px);
      }
    }

    @keyframes floatHorizontalRev {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-12px);
      }
    }

    .f-v1 {
      animation: floatVertical 4s ease-in-out infinite alternate;
    }

    .f-v2 {
      animation: floatVerticalRev 4.5s ease-in-out infinite alternate;
    }

    .f-h1 {
      animation: floatHorizontal 3.8s ease-in-out infinite alternate;
    }

    .f-h2 {
      animation: floatHorizontalRev 4.2s ease-in-out infinite alternate;
    }

    /* ─── UI Layer ─────────────────────────────────────────────────── */
    #ui-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 2.5vh;
      pointer-events: none;
      z-index: 60;
    }

    #logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 1vh;
      margin-bottom: 1.5vh;
      pointer-events: auto;
      z-index: 65;
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    #logo-img {
      width: clamp(290px, 33vw, 520px);
      height: auto;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
      display: block;
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    #buttons-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4vh;
      pointer-events: auto;
      z-index: 70;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #buttons-group.fade-out {
      opacity: 0;
      transform: scale(0.86) translateY(18px);
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s 0.4s;
    }

    #btn-commencer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(280px, 21vw, 350px);
      height: clamp(64px, 4.8vw, 76px);
      border-radius: 9999px;
      cursor: pointer;
      border: 3.5px solid #ffffff;
      outline: none;
      background: linear-gradient(180deg, #65cb2a 0%, #52b61f 38%, #3fa116 70%, #2d7a0e 100%);
      box-shadow: 0 0 0 2.5px #1f5209, 0 7px 0 #184406, 0 12px 24px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.7), inset 0 -2px 5px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-commencer:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 2.5px #1f5209, 0 9px 0 #184406, 0 15px 28px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.8), inset 0 -2px 5px rgba(0, 0, 0, 0.3);
    }

    #btn-commencer:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 2.5px #1f5209, 0 3px 0 #184406, 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 1px 3px rgba(255, 255, 255, 0.5), inset 0 -1px 3px rgba(0, 0, 0, 0.25);
    }

    #btn-commencer::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 10%;
      width: 80%;
      height: 42%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    #btn-commencer span.btn-label {
      position: relative;
      z-index: 5;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(26px, 2vw, 34px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2.5px 0 #1b4b08, 0 4px 10px rgba(0, 0, 0, 0.35);
      padding-top: 1px;
    }

    #btn-google {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: clamp(260px, 19vw, 315px);
      height: clamp(52px, 3.8vw, 60px);
      border-radius: 9999px;
      cursor: pointer;
      background: #ffffff;
      border: 1.8px solid #2d3b48;
      box-shadow: 0 3px 0 rgba(40, 55, 70, 0.15), 0 8px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 rgba(40, 55, 70, 0.15), 0 12px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    #btn-google:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(40, 55, 70, 0.15), 0 4px 10px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .google-icon {
      width: clamp(22px, 1.6vw, 26px);
      height: clamp(22px, 1.6vw, 26px);
      flex-shrink: 0;
    }

    .google-btn-text {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(15.5px, 1.15vw, 19px);
      font-weight: 800;
      color: #1a394d;
      white-space: nowrap;
    }

    /* ─── Skip Intro Button ───────────────────────────────────────── */
    #btn-skip-intro {
      position: absolute;
      top: 24px;
      right: 28px;
      width: clamp(56px, 5.5vw, 76px);
      height: clamp(56px, 5.5vw, 76px);
      z-index: 95;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      outline: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, opacity 0.4s ease;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btn-skip-intro.visible {
      display: flex;
    }

    #btn-skip-intro:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
    }

    #btn-skip-intro:active {
      transform: scale(0.95) translateY(1px);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }

    #btn-skip-intro img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* ─── Teacher Portal Button (Top-Left on Home, Fneck Intro, & Map) ── */
    #btn-teacher-portal {
      position: absolute;
      top: 66px;
      left: 20px;
      width: clamp(58px, 6.0vw, 86px);
      height: auto;
      aspect-ratio: 263 / 284;
      z-index: 96;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      outline: none;
      opacity: 1;
      pointer-events: auto;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      transition: opacity 0.6s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btn-teacher-portal:hover {
      transform: scale(1.08) translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
    }

    #btn-teacher-portal:active {
      transform: scale(0.95) translateY(1px);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }

    #btn-teacher-portal.teacher-btn-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #btn-teacher-portal.teacher-btn-exercise-hidden {
      display: none !important;
    }

    #btn-teacher-portal img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      #btn-teacher-portal {
        top: 108px;
        left: 16px;
        width: 56px;
      }
    }

    /* ─── Fneck Guide Layer ─────────────────────────────────────────── */
    #fneck-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    #fneck-guide {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.4));
      opacity: 0;
      display: none;
    }

    #fneck-guide.visible {
      display: block;
    }

    .fneck-image {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }

    /* Centered Text Overlay */
    .fneck-bubble-overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      pointer-events: none;
      box-sizing: border-box;
      padding: 5% 6%;
      /* Visual debugging can be removed later */
      /* border: 1px solid rgba(255,0,0,0.3); */
    }

    .fneck-dialogue-content {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      font-size: clamp(11px, 1.15vw, 16px);
      font-weight: 700;
      color: #2b1707;
      line-height: 1.3;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: opacity 0.3s ease;
      width: 100%;
      word-break: break-word;
    }

    #interactive-tap-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 75;
      cursor: pointer;
      display: none;
    }

    #interactive-tap-stage.active {
      display: block;
    }

    #btn-adventure-start {
      position: relative;
      margin-top: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 22px;
      border-radius: 9999px;
      cursor: pointer;
      pointer-events: auto;
      border: 2.5px solid #ffffff;
      outline: none;
      background: linear-gradient(180deg, #65cb2a 0%, #52b61f 38%, #3fa116 70%, #2d7a0e 100%);
      box-shadow: 0 0 0 2px #1f5209, 0 4px 0 #184406, 0 7px 14px rgba(0, 0, 0, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.55), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      font-family: 'Nunito', sans-serif;
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 0 #1b4b08, 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-adventure-start::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      width: 80%;
      height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    @keyframes bounceArrow {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .arrow-anim {
      animation: bounceArrow 1.5s infinite ease-in-out;
    }

    .pulse-marker {
      animation: pulseMarker 1.5s infinite;
      transform-origin: center;
    }

    @keyframes pulseMarker {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.3);
        opacity: 0.5;
      }
    }

    .clash-arrow-anim {
      animation: clashBounce 1.3s infinite;
      transform-origin: 0px 0px;
    }

    @keyframes clashBounce {
      0% {
        transform: translateY(-60px) scale(1, 1);
        animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
      }

      40% {
        transform: translateY(-5px) scale(1, 1);
        animation-timing-function: linear;
      }

      45% {
        transform: translateY(0px) scale(1.3, 0.6);
        animation-timing-function: linear;
      }

      50% {
        transform: translateY(-5px) scale(0.85, 1.15);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      100% {
        transform: translateY(-60px) scale(1, 1);
      }
    }

    /* POPUP STYLES */
    #level-popup-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #level-popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .level-popup-container {
      position: relative;
      width: 50vw;
      max-width: 700px;
      min-width: 350px;
      transform: scale(0.5);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #level-popup-overlay.active .level-popup-container {
      transform: scale(1);
    }

    .level-popup-bg {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;

            original: String(m.original || ""),
            correction: String(m.correction || ""),
            explanation: String(m.explanation || "")
          }))
        : [];

      const strengths = Array.isArray(parsed.strengths) ? parsed.strengths.map(s => String(s)) : [];

      return {
        questionId: qKey,
        questionNumber: qConfig.number,
        questionText: qConfig.questionText,
        answer: String(studentAnswer || ""),
        score: validatedScore,
        maxScore: qConfig.maxScore,
        rubricVersion: window.EVALUATION_RUBRIC_CONFIG.version,
        criteria: normalizedCriteria,
        strengths,
        mistakes,
        suggestedCorrection: typeof parsed.suggestedCorrection === "string" ? parsed.suggestedCorrection.trim() : "",
        feedback: isBlankAnswer
          ? "Aucune réponse n'a été écrite pour cette question."
          : (typeof parsed.feedback === "string" && parsed.feedback.trim() ? parsed.feedback.trim() : "Bonne participation !"),
        status: "evaluated",
        evaluatedAt: new Date().toISOString(),
        model: modelName,
        usedImageContext: Boolean(usedImageContext)
      };
    }

    window.GeminiAIService = {
      model: "gemini-3.5-flash-lite",

      validateRubric() {
        return validateRubricConfig(window.EVALUATION_RUBRIC_CONFIG);
      },

      buildQuestionPrompt(qKey, studentAnswer) {
        this.validateRubric();
        const qConfig = window.EVALUATION_RUBRIC_CONFIG.questions[qKey];
        if (!qConfig) throw new Error("Question inconnue dans le barème : " + qKey);
        return buildQuestionPrompt(qConfig, studentAnswer, window.EVALUATION_RUBRIC_CONFIG);
      },

      normalizeQuestionResponse(rawText, qKey, studentAnswer, usedImageContext = true) {
        this.validateRubric();
        const qConfig = window.EVALUATION_RUBRIC_CONFIG.questions[qKey];
        if (!qConfig) throw new Error("Question inconnue dans le barème : " + qKey);
        return normalizeQuestionEvaluation(rawText, qKey, qConfig, studentAnswer, usedImageContext, this.model);
      },

      getDiagnostics() {
        return lastAiDiagnostics ? { ...lastAiDiagnostics } : null;
      },

      async ensureAiReady() {
        this.validateRubric();
        const model = await initFirebaseAiLogic();
        return { ready: true, model, diagnostics: this.getDiagnostics() };
      },

      async evaluateQuestion(qKey, studentAnswer) {
        this.validateRubric();
        const qConfig = window.EVALUATION_RUBRIC_CONFIG.questions[qKey];
        if (!qConfig) {
          throw new Error("Question inconnue dans le barème : " + qKey);
        }
        const trimmed = (studentAnswer || "").trim();
        if (!trimmed) {
          throw new Error(`Aucune réponse fournie pour la question ${qConfig.number}.`);
        }

        const model = await initFirebaseAiLogic();
        const imagePart = await loadImageAsInlineData(qConfig.imageSrc);
        const prompt = buildQuestionPrompt(qConfig, studentAnswer, window.EVALUATION_RUBRIC_CONFIG);
        const contentPayload = imagePart ? [prompt, imagePart] : prompt;

        if (lastAiDiagnostics) {
          lastAiDiagnostics.reachedGemini = true;
        }
        console.log(`[GeminiAIService] Requesting independent evaluation for ${qKey} (image attached: ${Boolean(imagePart)}, max: ${qConfig.maxScore}, reachedGemini: true)...`);

        const generateWithTimeout = async () => {
          const generatePromise = model.generateContent(contentPayload);
          const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error(`Timeout dépassé lors de la correction de ${qKey}`)), 30000)
          );
          const result = await Promise.race([generatePromise, timeoutPromise]);
          const response = await result.response;
          const rawText = response.text();
          return normalizeQuestionEvaluation(rawText, qKey, qConfig, studentAnswer, Boolean(imagePart), this.model);
        };

        const isTransientError = (err) => {
          if (!err || err.isAppCheckFatal) return false;
          const msg = `${err.code || ''} ${err.message || err}`;
          if (/appCheck|recaptcha|401|403/i.test(msg)) return false;
          return /fetch-error|Failed to fetch|network|timeout|Timeout dépassé|high demand|429|500|502|503|504|unavailable/i.test(msg);
        };

        const retryDelaysMs = [1200, 2400];
        for (let attempt = 0; attempt <= retryDelaysMs.length; attempt++) {
          try {
            return await generateWithTimeout();
          } catch (genErr) {
            if (attempt < retryDelaysMs.length && isTransientError(genErr)) {
              console.warn(`[GeminiAIService] Transient error for ${qKey} (attempt ${attempt + 1}), retrying in ${retryDelaysMs[attempt]}ms:`, genErr.message || genErr);
              await new Promise(resolve => setTimeout(resolve, retryDelaysMs[attempt]));
              continue;
            }
            if (lastAiDiagnostics) {
              lastAiDiagnostics.lastErrorCode = genErr.code || genErr.name || 'gemini/request-failed';
              lastAiDiagnostics.lastErrorMessage = genErr.message || String(genErr);
            }
            throw genErr;
          }
        }
      },

      buildEvaluationSummary(questionsMap) {
        this.validateRubric();
        const rubric = window.EVALUATION_RUBRIC_CONFIG;
        const qKeys = ["q1", "q2", "q3"];
        const allowedCodes = rubric.activeCriteriaOrder || ["C1", "C3", "C6"];

        for (const k of qKeys) {
          const ev = questionsMap && questionsMap[k];
          if (!ev || ev.status !== "evaluated" || typeof ev.score !== "number" || Number.isNaN(ev.score)) {
            return null;
          }
          const maxAllowed = rubric.questions[k].maxScore;
          if (ev.score < 0 || ev.score > maxAllowed) {
            throw new Error(`Score invalide détecté pour ${k} : ${ev.score}/${maxAllowed}`);
          }
          for (const cCode of Object.keys(ev.criteria || {})) {
            if (!allowedCodes.includes(cCode)) {
              throw new Error(`Critère non autorisé ${cCode} détecté dans les résultats de ${k}.`);
            }
          }
        }

        const q1 = questionsMap.q1;
        const q2 = questionsMap.q2;
        const q3 = questionsMap.q3;

        const maxSum = roundScore(q1.maxScore + q2.maxScore + q3.maxScore);
        if (Math.abs(maxSum - rubric.overallMaxScore) > 0.01) {
          throw new Error(`Somme des maximums invalide (${maxSum} != ${rubric.overallMaxScore}).`);
        }

        const totalScore = roundScore(Math.max(0, Math.min(rubric.overallMaxScore, q1.score + q2.score + q3.score)));

        const criteriaTotals = {};
        for (const [cCode, cDef] of Object.entries(rubric.officialCriteriaTotals)) {
          let earned = 0;
          for (const k of qKeys) {
            const qCrit = questionsMap[k].criteria && questionsMap[k].criteria[cCode];
            if (qCrit && typeof qCrit.score === "number") {
              earned = roundScore(earned + Math.max(0, Math.min(rubric.questions[k].criteria[cCode].max, qCrit.score)));
            }
          }
          criteriaTotals[cCode] = {
            code: cCode,
            name: cDef.name,
            score: roundScore(Math.min(cDef.max, earned)),
            max: cDef.max
          };
        }

        return {
          rubricVersion: rubric.version,
          totalScore,
          maxScore: rubric.overallMaxScore,
          questionScores: {
            q1: { score: q1.score, maxScore: q1.maxScore },
            q2: { score: q2.score, maxScore: q2.maxScore },
            q3: { score: q3.score, maxScore: q3.maxScore }
          },
          criteriaTotals,
          combinedStrengths: [...(q1.strengths || []), ...(q2.strengths || []), ...(q3.strengths || [])].slice(0, 6),
          status: "evaluated",
          summarizedAt: new Date().toISOString()
        };
      }
    };
  </script>
</head>

        const delayMs = parseInt(wrap.getAttribute('data-delay'), 10);

        wrap.style.transform = startTransform;
        wrap.style.opacity = '0';

        setTimeout(() => {
          wrap.classList.add('entering');
          void wrap.offsetWidth;
          wrap.style.transform = 'translate(0, 0)';
          wrap.style.opacity = '1';
        }, delayMs);
      });
    }

      wraps.forEach(wrap => {

        const dy = (Math.random() - 0.5) * 10;
        wrap.classList.add('reacting');
        wrap.style.transform = `translate(${dx}px, ${dy}px)`;
        setTimeout(() => {
          wrap.style.transform = 'translate(0, 0)';
          setTimeout(() => wrap.classList.remove('reacting'), 1000);
        }, 450);

      fneckGuide.style.top = scene.containerPos.top;

      fneckGuide.style.left = scene.containerPos.left;

      fneckBubbleText.style.left = scene.bubbleArea.left;
      fneckBubbleText.style.width = scene.bubbleArea.width;
      fneckBubbleText.style.height = scene.bubbleArea.height;
    }

    let fneckCurrentAudio = null;

    function stopFneckAudio() {
      if (fneckCurrentAudio) {
        try {
          fneckCurrentAudio.pause();
          fneckCurrentAudio.currentTime = 0;
        } catch (e) {}
        fneckCurrentAudio = null;
      }
    }

    function playFneckAudio(audioSrc) {
      stopFneckAudio();
      if (!audioSrc) return;
      try {
        const audio = new Audio(encodeURI(audioSrc));
        fneckCurrentAudio = audio;
        audio.play().catch(err => {
          console.log('Fneck audio playback deferred or blocked by browser policy:', err);
        });
      } catch (err) {
        console.warn('Fneck audio creation error:', err);
      }
    }

        fneckGuide.style.transition = 'none';
        positionFneck(scene);
        fneckGuide.style.transform = scene.enterFrom;
        fneckGuide.style.opacity = '0';
        fneckGuide.style.pointerEvents = 'none';
        fneckGuide.classList.add('visible');
        void fneckGuide.offsetWidth;

        fneckGuide.style.transition = 'transform 0.75s cubic-bezier(0.34, 1.35, 0.64, 1), opacity 0.5s ease';
        void fneckGuide.offsetWidth;
        fneckGuide.style.transform = scene.enterTo;
        fneckGuide.style.opacity = '1';

        fneckDialogue.style.opacity = '0';
        setTimeout(() => {
          fneckDialogue.textContent = scene.text;
          fneckDialogue.style.opacity = '1';

        _computeDocSummary(rawDoc) {
          const helper = window.EvaluationRubricHelper;
          const doc = rawDoc || {};
          const maxScore = helper
            ? helper.resolveEvaluationMaxScore(doc)
            : (doc.maxTotalScore === 10 ? 10 : 9);
          const rubricVer = helper
            ? helper.resolveRubricVersion(doc)
            : (maxScore === 10 ? '4eme_officiel_v1' : '4eme_officiel_v2_9pts');
          const isLegacyV1 = rubricVer === '4eme_officiel_v1' || maxScore === 10;

          const we = doc.writingEvaluation || {};
          const qs = we.questions || {};
          const qData = {};
          let allQEvaluated = true;
          let sumQ = 0;

          ['q1', 'q2', 'q3'].forEach((qk) => {

            const cfgMax = helper
              ? helper.resolveQuestionMaxScore(doc, qk, entry)
              : (isLegacyV1 && qk === 'q3' ? 4 : 3);
            const qMax = (typeof entry.maxScore === 'number' && entry.maxScore > 0) ? entry.maxScore : cfgMax;
            const fallbackQScore = doc.questionScores && typeof doc.questionScores[qk] === 'number'
              ? doc.questionScores[qk] : null;
            const qScore = typeof entry.score === 'number' && !Number.isNaN(entry.score) ? entry.score : fallbackQScore;
            const qOk = (entry.status === 'evaluated' || doc.writingStatus === 'evaluated') && typeof qScore === 'number';
            if (qOk) {
              sumQ += Math.max(0, Math.min(qMax, qScore));
            } else {
              allQEvaluated = false;
            }
            qData[qk] = { score: qScore, maxScore: qMax, evaluated: qOk };
          });

          const totalScore = allQEvaluated
            ? Math.max(0, Math.min(maxScore, Math.round((sumQ + Number.EPSILON) * 100) / 100))
            : (typeof doc.totalScore === 'number' ? Math.max(0, Math.min(maxScore, doc.totalScore)) : null);
          const isEvaluated = (doc.writingStatus === 'evaluated' || doc.status === 'evaluated' || allQEvaluated)
            && typeof totalScore === 'number';

          const critTotals = {};
          const critCodes = isLegacyV1 ? ['C1', 'C3', 'C6', 'C7'] : ['C1', 'C3', 'C6'];
          let hasCrit = false;
          ['q1', 'q2', 'q3'].forEach((qk) => {
            const crits = (qs[qk] && qs[qk].criteria) || {};
            critCodes.forEach((cc) => {
              if (crits[cc] && typeof crits[cc].score === 'number' && !Number.isNaN(crits[cc].score)) {
                critTotals[cc] = (critTotals[cc] || 0) + crits[cc].score;
                hasCrit = true;
              }
            });
          });
          if (hasCrit) {
            critCodes.forEach((cc) => {
              if (typeof critTotals[cc] === 'number') {
                critTotals[cc] = Math.round((critTotals[cc] + Number.EPSILON) * 100) / 100;
              }
            });
          } else if (!isLegacyV1 && doc.criteriaTotals && typeof doc.criteriaTotals === 'object') {
            ['C1', 'C3', 'C6'].forEach((cc) => {
              const cv = doc.criteriaTotals[cc];
              const numVal = typeof cv === 'number' ? cv : (cv && typeof cv.score === 'number' ? cv.score : null);
              if (typeof numVal === 'number' && !Number.isNaN(numVal)) {
                critTotals[cc] = Math.round((numVal + Number.EPSILON) * 100) / 100;
                hasCrit = true;
              }
            });
          }

          return {
            doc,
            docId: doc.docId || '',
            maxScore,
            rubricVersion: rubricVer,
            isLegacyV1,
            qData,
            totalScore,
            isEvaluated,
            criteriaTotals: hasCrit ? critTotals : null
          };

        _matchesFilter(doc, rawFilter) {

          const haystack = [
            doc.studentClasse,
            doc.studentId,
            doc.studentNom,
            doc.studentPrenom,
            doc.docId,
            doc.sessionId
          ].filter(Boolean).join(' ').toLowerCase();
          return haystack.includes(f);

          const fmtNum = (n) => typeof n === 'number' ? (Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '')) : String(n ?? '—');
          const avatarColors = ['#3b82f6','#ec4899','#10b981','#f59e0b','#8b5cf6','#0ea5e9','#ef4444','#14b8a6'];
          const getAvatarColor = (name) => avatarColors[Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0)) % avatarColors.length];
          const getInitials = (prenom, nom) => ((prenom||'')[0]||'') + ((nom||'')[0]||'');
          const getScoreBadgeStyle = (score, maxScore) => {

              <button type="button" id="td-nav-results" aria-label="Résultats des évaluations" title="Résultats des évaluations"

              <button type="button" id="td-nav-settings" aria-label="Paramètres" title="Paramètres du barème et accès"
                style="position:absolute;left:4.6%;top:60.0%;width:18.6%;height:7.4%;border-radius:14px;background:transparent;border:none;outline:none;cursor:pointer;z-index:26;transition:box-shadow 0.15s,background 0.15s;"></button>

              <button type="button" id="td-logout-btn" aria-label="Déconnexion" title="Déconnexion"
                style="position:absolute;left:5.0%;top:84.5%;width:16.6%;height:7.4%;border-radius:9999px;background:transparent;border:none;outline:none;cursor:pointer;z-index:26;transition:background 0.15s,box-shadow 0.15s;"></button>

              <!-- Compact summary pills sitting in empty cream strip left of Exporter -->
              <div id="td-stats-bar"
                style="position:absolute;left:24.6%;top:39.5%;width:55.8%;height:5.8%;display:flex;align-items:center;gap:calc(var(--td-h, 675px) * 0.012);overflow:hidden;z-index:22;"></div>

              <!-- Main changeable table panel sitting cleanly in the cleared cream area of tet dachbored.png -->
              <div id="td-table-wrap"
                style="position:absolute;left:24.5%;top:47.0%;width:69.8%;height:44.0%;background:rgba(255,251,246,0.97);border-radius:calc(var(--td-h, 675px) * 0.022);border:1.5px solid #eadcc8;box-shadow:0 6px 20px rgba(120,53,15,0.09);display:flex;flex-direction:column;overflow:hidden;z-index:24;">
                <div id="td-table-header"
                  style="background:linear-gradient(180deg,#ede0ff 0%,#e1cffc 100%);color:#3b1b6b;display:grid;grid-template-columns:7% 35% 14% 15% 16% 13%;align-items:center;padding:0 calc(var(--td-h, 675px) * 0.022);height:15.5%;min-height:32px;flex-shrink:0;border-bottom:1.5px solid #d7c3f7;">
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;text-align:center;">#</div>
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;">Étudiant</div>
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;text-align:center;">Classe</div>
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;text-align:center;">Score</div>
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;text-align:center;">Détails</div>
                  <div style="font-size:calc(var(--td-h, 675px) * 0.0235);font-weight:900;text-align:center;">Actions</div>
                </div>
                <div id="td-list-body" style="background:transparent;flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;"></div>
              </div>
            </div>
          `;

          document.body.appendChild(overlay);

          const stageBox = overlay.querySelector('#td-stage-box');
          const syncVars = () => {
            // Use clientHeight/clientWidth so CSS transform scale animation (j1CardPop) never shrinks --td-h
            const h = stageBox.clientHeight || stageBox.getBoundingClientRect().height;
            const w = stageBox.clientWidth || stageBox.getBoundingClientRect().width;
            if (h > 0) {
              stageBox.style.setProperty('--td-h', h + 'px');
              stageBox.style.setProperty('--td-w', w + 'px');
            }
          };
          const tdRo = new ResizeObserver(syncVars);
          tdRo.observe(stageBox);
          overlay._tdRo = tdRo;
          requestAnimationFrame(syncVars);

          const addHoverFx = (el, glowColor) => {
            el.addEventListener('mouseenter', () => {
              el.style.background = 'rgba(255,255,255,0.14)';
              el.style.boxShadow = `0 0 14px ${glowColor}`;
            });
            el.addEventListener('mouseleave', () => {
              el.style.background = 'transparent';
              el.style.boxShadow = 'none';
            });
          };
          const classInput = overlay.querySelector('#td-class-input');
          const nameInput = overlay.querySelector('#td-name-input');
          const statsBar = overlay.querySelector('#td-stats-bar');
          const tableHeader = overlay.querySelector('#td-table-header');
          const listBody = overlay.querySelector('#td-list-body');
          const consultBtn = overlay.querySelector('#td-consult-btn');
          const exportBtn = overlay.querySelector('#td-export-btn');
          const closeBtn = overlay.querySelector('#td-close-all-btn');
          const navResultsBtn = overlay.querySelector('#td-nav-results');
          const navSettingsBtn = overlay.querySelector('#td-nav-settings');
          const logoutBtn = overlay.querySelector('#td-logout-btn');

          addHoverFx(consultBtn, 'rgba(34,197,94,0.45)');
          addHoverFx(exportBtn, 'rgba(124,58,237,0.45)');
          addHoverFx(closeBtn, 'rgba(239,68,68,0.45)');
          addHoverFx(logoutBtn, 'rgba(220,38,38,0.28)');

          classInput.value = state.classFilter;

          const exportToCsv = (rows) => {
            const header = ['Nom','Prénom','ID','Classe','Q1 (/3)','Q2 (/3)','Q3 (/3)','C1 (/4.5)','C3 (/3)','C6 (/1.5)','Score','Max','Statut'];
            const csvRows = rows.map(s => {
              const doc = s.doc;
              const ct = s.criteriaTotals || {};
              return [
                doc.studentNom||'', doc.studentPrenom||'', doc.studentId||'', doc.studentClasse||'',
                s.qData?.q1?.score ?? '', s.qData?.q2?.score ?? '', s.qData?.q3?.score ?? '',
                typeof ct.C1 === 'number' ? ct.C1 : (ct.C1?.score ?? ''),
                typeof ct.C3 === 'number' ? ct.C3 : (ct.C3?.score ?? ''),
                typeof ct.C6 === 'number' ? ct.C6 : (ct.C6?.score ?? ''),
                s.totalScore ?? '', s.maxScore ?? '', s.isEvaluated ? 'Corrigée' : 'Incomplète'
              ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
            });
            const csv = [header.join(','), ...csvRows].join('\n');
            const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'evaluations_espace_enseignant.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          };

          const matchesAllFilters = (summary) => {
            const doc = summary.doc;
            const classF = state.classFilter.toLowerCase();
            const nameF = state.nameFilter.toLowerCase();
            if (classF) {
              const classStr = (doc.studentClasse || doc.studentId || '').toLowerCase();
              if (!classStr.includes(classF)) return false;
            }
            if (nameF) {
              const nameStr = `${doc.studentNom||''} ${doc.studentPrenom||''} ${doc.studentId||''}`.toLowerCase();
              if (!nameStr.includes(nameF)) return false;
            }
            return true;
          };

          const render = () => {
            navSettingsBtn.style.boxShadow = state.activeTab === 'settings' ? '0 0 0 2.5px #7c3aed' : 'none';
            navResultsBtn.style.boxShadow = state.activeTab === 'results' ? '0 0 10px rgba(124,58,237,0.35)' : 'none';

            if (state.activeTab === 'settings') {
              tableHeader.style.display = 'none';
              statsBar.innerHTML = `<span style="background:#ede9fe;color:#5b21b6;padding:3px 12px;border-radius:9999px;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.017);">⚙️ Paramètres de l'évaluation</span>`;
              listBody.innerHTML = `
                <div style="padding:calc(var(--td-h, 675px) * 0.028);display:flex;flex-direction:column;gap:12px;color:#3b1b49;font-size:calc(var(--td-h, 675px) * 0.02);">
                  <div style="background:#fef9ec;border:1.5px solid #fde68a;border-radius:14px;padding:12px 16px;">
                    <div style="font-weight:900;margin-bottom:4px;">📐 Barème actif : / 9 points (3 questions × 3 points)</div>
                    <div style="font-weight:700;color:#78350f;font-size:0.9em;">• C1 (Adéquation) : 4.5 pts (1.5/question) • C3 (Correction) : 3 pts (1.0/question) • C6 (Richesse) : 1.5 pt (0.5/question)</div>
                  </div>
                  <div style="background:#f5effe;border:1.5px solid #d5c2f7;border-radius:14px;padding:12px 16px;">
                    <div style="font-weight:900;margin-bottom:4px;">🔥 Source des données : Firebase Firestore uniquement</div>
                    <div style="font-weight:700;color:#5b21b6;font-size:0.9em;">Toutes les copies proviennent en direct de Firestore (sans cache local).</div>
                  </div>
                  <div style="background:#dcfce7;border:1.5px solid #86efac;border-radius:14px;padding:12px 16px;">
                    <div style="font-weight:900;margin-bottom:4px;">🔒 Sécurité : Accès protégé par mot de passe</div>
                    <div style="font-weight:700;color:#15803d;font-size:0.9em;">Déconnectez-vous via « Déconnexion » pour verrouiller à nouveau l'Espace Enseignant.</div>
                  </div>
                </div>`;
              return;
            }

            tableHeader.style.display = 'grid';

            if (state.loading) {
              statsBar.innerHTML = `<span style="background:#fef3c7;color:#78350f;padding:3px 12px;border-radius:9999px;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.017);">⏳ Chargement depuis Firebase...</span>`;
              listBody.innerHTML = `<div style="text-align:center;padding:calc(var(--td-h, 675px) * 0.06);color:#78350f;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.021);">⏳ Récupération des évaluations depuis Firebase...</div>`;
              return;
            }

            const filtered = state.rows.filter(s => matchesAllFilters(s));
            const evaluatedRows = filtered.filter(r => r.isEvaluated && !r.isLegacyV1);
            const avg9 = evaluatedRows.length ? fmtNum(evaluatedRows.reduce((a,r)=>a+r.totalScore,0)/evaluatedRows.length) : '—';

            statsBar.innerHTML = `
              <span style="background:#ede9fe;color:#5b21b6;padding:4px 12px;border-radius:9999px;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.020);white-space:nowrap;">📊 ${filtered.length} résultat(s)</span>
              <span style="background:#dcfce7;color:#15803d;padding:4px 12px;border-radius:9999px;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.020);white-space:nowrap;">✅ Corrigées : ${evaluatedRows.length} (Moy. ${avg9}/9)</span>
              ${state.loadError ? `<span style="background:#fee2e2;color:#991b1b;padding:4px 12px;border-radius:9999px;font-weight:700;font-size:calc(var(--td-h, 675px) * 0.020);white-space:nowrap;">⚠️ ${escHtml(state.loadError)}</span>` : ''}
            `;

            if (filtered.length === 0) {
              listBody.innerHTML = `<div style="text-align:center;padding:calc(var(--td-h, 675px) * 0.06);color:#78350f;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.021);">Aucune évaluation trouvée dans Firebase.<br><small style="font-weight:600;opacity:0.75;">Effacez les filtres et cliquez sur Consulter.</small></div>`;
              return;
            }

            listBody.innerHTML = '';
            filtered.forEach((summary, idx) => {
              const doc = summary.doc;
              const prenom = doc.studentPrenom || '';
              const nom = doc.studentNom || '';
              const name = `${prenom} ${nom}`.trim() || 'Élève anonyme';
              const initials = getInitials(prenom, nom) || '?';
              const avatarColor = getAvatarColor(name);
              const classe = doc.studentClasse || '—';
              const isConfirming = state.pendingDeleteId === summary.docId;
              const scoreStyle = summary.isEvaluated ? getScoreBadgeStyle(summary.totalScore, summary.maxScore) : 'background:#ef4444;color:#ffffff;';
              const scoreText = summary.isEvaluated ? `${fmtNum(summary.totalScore)} / ${fmtNum(summary.maxScore)}` : '—';

              const row = document.createElement('div');
              row.className = 'teacher-eval-row';
              row.dataset.docId = summary.docId;
              row.style.cssText = `display:grid;grid-template-columns:7% 35% 14% 15% 16% 13%;padding:calc(var(--td-h, 675px) * 0.014) calc(var(--td-h, 675px) * 0.022);align-items:center;border-bottom:1px solid #f2e7d7;background:${idx%2===0?'rgba(255,255,255,0.92)':'rgba(252,247,238,0.92)'};transition:background 0.15s;`;
              row.onmouseenter = () => { row.style.background = '#fef4dc'; };
              row.onmouseleave = () => { row.style.background = idx%2===0?'rgba(255,255,255,0.92)':'rgba(252,247,238,0.92)'; };

              const eyeSvg = `<svg viewBox="0 0 24 24" style="width:calc(var(--td-h, 675px) * 0.025);height:calc(var(--td-h, 675px) * 0.025);fill:#6d28d9;flex-shrink:0;"><path d="M12 5C6.5 5 2 9.5 1 12c1 2.5 5.5 7 11 7s10-4.5 11-7c-1-2.5-5.5-7-11-7zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>`;
              const trashSvg = `<svg viewBox="0 0 24 24" style="width:calc(var(--td-h, 675px) * 0.026);height:calc(var(--td-h, 675px) * 0.026);fill:${isConfirming?'#ffffff':'#dc2626'};display:block;"><path d="M6 7h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7zm3-4h6l1 2h4v2H4V5h4l1-2zm1 6v9h2V9h-2zm4 0v9h2V9h-2z"/></svg>`;

              row.innerHTML = `
                <div style="font-size:calc(var(--td-h, 675px) * 0.024);font-weight:800;color:#3b1b49;text-align:center;">${idx+1}</div>
                <div style="display:flex;align-items:center;gap:calc(var(--td-h, 675px) * 0.015);min-width:0;">
                  <div style="width:calc(var(--td-h, 675px) * 0.052);height:calc(var(--td-h, 675px) * 0.052);border-radius:50%;background:${avatarColor};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--td-h, 675px) * 0.021);border:2px solid #ffffff;box-shadow:0 2px 5px rgba(0,0,0,0.16);flex-shrink:0;">${escHtml(initials.toUpperCase())}</div>
                  <span style="font-size:calc(var(--td-h, 675px) * 0.024);font-weight:800;color:#2d1b12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(name)}</span>
                </div>
                <div style="display:flex;justify-content:center;">
                  <span style="background:#ede6fb;color:#3b1b6b;border-radius:9999px;padding:calc(var(--td-h, 675px) * 0.005) calc(var(--td-h, 675px) * 0.019);font-size:calc(var(--td-h, 675px) * 0.021);font-weight:800;white-space:nowrap;">${escHtml(classe)}</span>
                </div>
                <div style="display:flex;justify-content:center;">
                  <span style="padding:calc(var(--td-h, 675px) * 0.006) calc(var(--td-h, 675px) * 0.021);border-radius:9999px;font-weight:900;font-size:calc(var(--td-h, 675px) * 0.022);white-space:nowrap;${scoreStyle}">${escHtml(scoreText)}</span>
                </div>
                <div style="display:flex;justify-content:center;">
                  <button type="button" class="td-details-btn" style="background:#f6f0fe;color:#3b1b6b;border:1.5px solid #d5c1f5;border-radius:9999px;padding:calc(var(--td-h, 675px) * 0.005) calc(var(--td-h, 675px) * 0.019);font-weight:800;font-size:calc(var(--td-h, 675px) * 0.022);cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 4px rgba(109,40,217,0.12);">
                    ${eyeSvg}<span>Voir</span>
                  </button>
                </div>
                <div style="display:flex;justify-content:center;">
                  <button type="button" class="td-delete-btn" style="background:${isConfirming?'#dc2626':'transparent'};border:${isConfirming?'1.5px solid #991b1b':'none'};border-radius:8px;padding:5px 8px;font-weight:800;font-size:calc(var(--td-h, 675px) * 0.020);color:${isConfirming?'#ffffff':'#dc2626'};cursor:pointer;display:inline-flex;align-items:center;gap:3px;" title="${isConfirming?'Confirmer la suppression':'Supprimer'}">
                    ${isConfirming ? '✓ ?' : trashSvg}
                  </button>
                </div>
              `;

              row.querySelector('.td-details-btn').addEventListener('click', async () => {
                let targetDoc = doc;
                if ((!doc.writingEvaluation || !doc.writingEvaluation.questions) && window.FirebaseService && summary.docId) {
                  try {
                    const fetched = await window.FirebaseService.getEvaluation(summary.docId);
                    if (fetched && fetched.success && fetched.exists && fetched.data) targetDoc = fetched.data;
                  } catch(e) {}
                }
                if (window.ExerciseSystem && typeof window.ExerciseSystem.openEvaluationDetailsModal === 'function') {
                  window.ExerciseSystem.openEvaluationDetailsModal(targetDoc, summary.totalScore);
                  const detailsOverlay = document.getElementById('eval-details-modal');
                  if (detailsOverlay) detailsOverlay.style.zIndex = '1000005';
                }
              });

              row.querySelector('.td-delete-btn').addEventListener('click', async () => {
                if (state.pendingDeleteId !== summary.docId) {
                  state.pendingDeleteId = summary.docId;
                  render();
                  return;
                }
                state.pendingDeleteId = null;
                let deletedOk = true;
                if (window.FirebaseService && typeof window.FirebaseService.deleteEvaluation === 'function' && summary.docId) {
                  const delRes = await window.FirebaseService.deleteEvaluation(summary.docId);
                  if (delRes && delRes.success === false) {
                    deletedOk = false;
                    state.loadError = delRes.error || 'Suppression impossible.';
                  }
                }
                if (deletedOk) {
                  this._clearLocalHistoryStorage();
                  state.rows = state.rows.filter(r => r.docId !== summary.docId);
                }
                render();
              });

              listBody.appendChild(row);
            });
          };

          const loadRows = async () => {
            this._clearLocalHistoryStorage();
            state.loading = true;
            state.loadError = null;
            render();
            const byId = new Map();
            try {
              if (window.FirebaseService && typeof window.FirebaseService.listEvaluations === 'function') {
                const res = await window.FirebaseService.listEvaluations(300);
                const remoteItems = res && Array.isArray(res.items) ? res.items : (res && Array.isArray(res.data) ? res.data : null);
                if (res && res.success && remoteItems) {
                  remoteItems.forEach(d => { if (d && d.docId) byId.set(d.docId, d); });
                } else if (res && res.error) {
                  state.loadError = res.error;
                }
              } else {
                state.loadError = 'Service Firebase indisponible.';
              }
            } catch(e) {
              state.loadError = e && e.message ? e.message : String(e);
            }
            const docs = Array.from(byId.values()).sort((a,b) => (Date.parse(b.submittedAt||0)||0) - (Date.parse(a.submittedAt||0)||0));
            state.rows = docs.map(d => this._computeDocSummary(d));
            state.loading = false;
            render();
          };

          const applyFiltersAndRefresh = async () => {
            state.activeTab = 'results';
            state.classFilter = classInput.value.trim();
            state.nameFilter = nameInput.value.trim();
            state.pendingDeleteId = null;
            await loadRows();
          };

          nameInput.addEventListener('input', () => { state.activeTab = 'results'; state.nameFilter = nameInput.value.trim(); state.pendingDeleteId = null; render(); });
          classInput.addEventListener('input', () => { state.activeTab = 'results'; state.classFilter = classInput.value.trim(); state.pendingDeleteId = null; render(); });
          classInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyFiltersAndRefresh(); });
          nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyFiltersAndRefresh(); });
          consultBtn.addEventListener('click', () => applyFiltersAndRefresh());
          navResultsBtn.addEventListener('click', () => { state.activeTab = 'results'; state.pendingDeleteId = null; render(); });
          navSettingsBtn.addEventListener('click', () => { state.activeTab = 'settings'; state.pendingDeleteId = null; render(); });

          exportBtn.addEventListener('click', () => {
            const toExport = state.rows.filter(s => matchesAllFilters(s));
            if (toExport.length === 0) { alert('Aucune évaluation à exporter.'); return; }
            exportToCsv(toExport);
          });

          const onEscKey = (e) => {
            if (e.key === 'Escape') this.closeDashboard(true);
          };
          overlay._onEscKey = onEscKey;
          document.addEventListener('keydown', onEscKey);

          closeBtn.addEventListener('click', () => this.closeDashboard(true));

    const MapCamera = {
      scale: 1,
      x: 0,
      y: 0,
      isDragging: false,
      startX: 0,
      startY: 0,
      initialX: 0,
      initialY: 0,
      el: null,

      init() {
        this.el = document.getElementById('world-camera');
        const stage = document.getElementById('game-stage');

        this.el.style.transformOrigin = '0 0';

        stage.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.zoom(e.clientX, e.clientY, -Math.sign(e.deltaY) * 0.2 * this.scale);
        }, { passive: false });

        stage.addEventListener('mousedown', (e) => {
          this.isDragging = true;
          this.startX = e.clientX;
          this.startY = e.clientY;
          this.initialX = this.x;
          this.initialY = this.y;
          this.el.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          const dx = e.clientX - this.startX;
          const dy = e.clientY - this.startY;
          this.x = this.initialX + dx;
          this.y = this.initialY + dy;
          this.clamp();
          this.update();
        });

        window.addEventListener('mouseup', () => {
          this.isDragging = false;
        });

        // Touch events
        stage.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.isDragging = true;
            this.startX = e.touches[0].clientX;
            this.startY = e.touches[0].clientY;
            this.initialX = this.x;
            this.initialY = this.y;
            this.el.style.transition = 'none';
          }
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
          if (!this.isDragging) return;
          const dx = e.touches[0].clientX - this.startX;
          const dy = e.touches[0].clientY - this.startY;
          this.x = this.initialX + dx;
          this.y = this.initialY + dy;
          this.clamp();
          this.update();
        }, { passive: false });
        window.addEventListener('touchend', () => {
          this.isDragging = false;
        });
      },

      getScreenCoords(percentX, percentY) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const imgA = 3436 / 1832;
        const winA = w / h;

        let screenX, screenY;

        if (winA > imgA) {
          const scale = w / 3436;
          const scaledH = 1832 * scale;
          const topEdge = (h - scaledH) / 2;
          screenX = (percentX / 100) * w;
          screenY = topEdge + (percentY / 100) * scaledH;
        } else {
          const scale = h / 1832;
          const scaledW = 3436 * scale;
          const leftEdge = (w - scaledW) / 2;
          screenX = leftEdge + (percentX / 100) * scaledW;
          screenY = (percentY / 100) * h;
        }

        return { x: screenX, y: screenY };
      },

      zoom(px, py, delta) {
        this.el.style.transition = 'none';
        const xs = (px - this.x) / this.scale;
        const ys = (py - this.y) / this.scale;

        this.scale = Math.max(1, Math.min(4, this.scale + delta));

        this.x = px - xs * this.scale;
        this.y = py - ys * this.scale;

        this.clamp();
        this.update();
      },

      focusOn(level, zoomLevel, durationMs = 2500) {
        this.el.style.transition = "transform " + durationMs + "ms cubic-bezier(0.25, 1, 0.5, 1)";
        this.scale = zoomLevel;

        const percentX = ((level.x + (level.w / 2)) / 3436) * 100;
        const percentY = ((level.y + (level.h / 2)) / 1832) * 100;
        const coords = this.getScreenCoords(percentX, percentY);

        const w = window.innerWidth;
        const h = window.innerHeight;

        this.x = (w / 2) - (coords.x * this.scale);
        this.y = (h / 2) - (coords.y * this.scale);

        this.clamp();
        this.update();
      },

      clamp() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const minX = w - w * this.scale;
        const minY = h - h * this.scale;

        this.x = Math.max(minX, Math.min(0, this.x));
        this.y = Math.max(minY, Math.min(0, this.y));
      },

      update() {
        this.el.style.transform = "translate(" + this.x + "px, " + this.y + "px) scale(" + this.scale + ")";
      }
    };

    const MapSystem = {
      state: {
        unlockedLevel: 1,
        introducedLevels: []
      },

      isLevelUnlocked(levelOrId) {
        const id = typeof levelOrId === 'object' && levelOrId !== null ? levelOrId.id : levelOrId;
        const name = typeof levelOrId === 'object' && levelOrId !== null ? levelOrId.name : null;
        if (id >= 1 && id <= 8) {
          return id <= this.state.unlockedLevel;
        }
        // Evaluation (id 10 / Layer_7) unlocks only after completing all 8 preceding journeys (unlockedLevel >= 9)
        if (id === 10 || name === 'Layer_7') {
          return this.state.unlockedLevel >= 9;
        }
        return false;
      },

      getActiveTargetLevelId() {
        return this.state.unlockedLevel >= 9 ? 10 : this.state.unlockedLevel;
      },

      init() {
        this.loadProgress();
        this.renderMap();
        MapCamera.init();

        this.updateVisuals(false);

        // Zoom toward the currently unlocked location
        const targetLevel = MAP_LEVELS.find(l => l.id === this.getActiveTargetLevelId());
        if (targetLevel) {
          MapCamera.focusOn(targetLevel, 1.8, 2600);
          setTimeout(() => {
            this.updateVisuals(true);
          }, 2700);
        }
      },

      loadProgress() {
        try {
          const saved = localStorage.getItem('tunisiaMapProgress');
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state.unlockedLevel = parsed.unlockedLevel || 1;
            this.state.introducedLevels = parsed.introducedLevels || [];
          } else {
            this.state.unlockedLevel = 1;
          }
        } catch (e) {
          console.error("Could not load progress", e);
        }
      },

      saveProgress() {
        localStorage.setItem('tunisiaMapProgress', JSON.stringify(this.state));
      },

      advanceAfterCompletion(completedLevelId) {
        const nextLevelId = (Number(completedLevelId) || 1) + 1;
        this.state.unlockedLevel = Math.max(this.state.unlockedLevel || 1, nextLevelId);
        this.saveProgress();
        this.updateVisuals(false);
        const focusId = nextLevelId >= 9 ? 10 : nextLevelId;
        const targetLevel = MAP_LEVELS.find(l => l.id === focusId);
        if (targetLevel) {
          MapCamera.focusOn(targetLevel, 1.8, 2000);
          setTimeout(() => {
            this.updateVisuals(true);
          }, 2100);
        }
      },

      renderMap() {
        const overlaysGroup = document.getElementById('map-overlays');
        const hitboxesGroup = document.getElementById('map-hitboxes');

        overlaysGroup.innerHTML = '';
        hitboxesGroup.innerHTML = '';

        MAP_LEVELS.forEach(level => {
          if (level.name) {
            const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
            img.setAttribute("id", `overlay-${level.id}`);
            img.setAttribute("href", `map_assets_full/${level.name}.png`);
            img.setAttributeNS("http://www.w3.org/1999/xlink", "href", `map_assets_full/${level.name}.png`);
            img.setAttribute("x", "0");
            img.setAttribute("y", "0");
            img.setAttribute("width", "3436");
            img.setAttribute("height", "1832");
            img.style.pointerEvents = "none";
            img.style.transition = "opacity 0.8s ease";
            overlaysGroup.appendChild(img);
          }

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("id", `hitbox-${level.id}`);
          rect.setAttribute("x", level.x);
          rect.setAttribute("y", level.y);
          rect.setAttribute("width", level.w);
          rect.setAttribute("height", level.h);
          rect.setAttribute("fill", "transparent");

          rect.addEventListener("click", () => this.handleLevelClick(level.id));
          hitboxesGroup.appendChild(rect);
        });
      },

      updateVisuals(showArrow = true) {
        const arrow = document.getElementById('tutorial-arrow');
        let arrowTarget = null;
        const activeTargetId = this.getActiveTargetLevelId();

        MAP_LEVELS.forEach(level => {
          const overlay = document.getElementById("overlay-" + level.id);
          const hitbox = document.getElementById("hitbox-" + level.id);

          const isUnlocked = this.isLevelUnlocked(level);
          const isIntroduced = this.state.introducedLevels.includes(level.id);

          if (overlay) {
            if (isUnlocked) {
              overlay.style.opacity = "0";
            } else {
              overlay.style.opacity = "1";
            }

          if (hitbox) {
            hitbox.style.cursor = isUnlocked ? "pointer" : "not-allowed";
            hitbox.style.pointerEvents = (level.id <= 8 || level.id === 10 || level.name === 'Layer_7') ? "auto" : "none";
          }

          arrow.style.display = "block";

                    targetCircle.style.boxShadow = 'none';
                    targetCircle.innerHTML = '';
                  }
                  return;
                }
                if (targetBtn) {
                  targetBtn.style.border = isSelected ? '2.5px solid #0284c7' : '2.5px solid transparent';
                  targetBtn.style.backgroundColor = isSelected ? 'rgba(2, 132, 199, 0.28)' : 'transparent';
                }
              };

              btn.onmouseenter = () => {
                if (isAnswerCorrect || selected.get(group.id).has(opt.id)) return;
                if (circleEl) {
                  circleEl.style.backgroundColor = 'rgba(2, 132, 199, 0.22)';
                } else {
                  btn.style.backgroundColor = 'rgba(59, 130, 246, 0.12)';
                }
              };
              btn.onmouseleave = () => {
                if (selected.get(group.id).has(opt.id)) return;
                if (circleEl) {
                  circleEl.style.backgroundColor = 'transparent';
                } else {
                  btn.style.backgroundColor = 'transparent';
                }
              };

              btn.onclick = () => {
                if (isAnswerCorrect) return;
                const groupSet = selected.get(group.id);
                if (group.single) {
                  group.options.forEach(other => {
                    groupSet.delete(other.id);
                    setOptionVisual(other.id, false);
                  });
                  groupSet.add(opt.id);
                  setOptionVisual(opt.id, true);
                } else {
                  if (groupSet.has(opt.id)) {
                    groupSet.delete(opt.id);
                    setOptionVisual(opt.id, false);
                  } else {
                    groupSet.add(opt.id);
                    setOptionVisual(opt.id, true);

          mountValidateButton((vbtn) => {
            if (isAnswerCorrect) {
              onNext();

            const fb = createFeedback(feedbackTop());
            const allAnswered = activity.groups.every(g => selected.get(g.id).size > 0);
            if (!allAnswered) {

              fb.style.color = '#ea580c';

            let allCorrect = true;
            activity.groups.forEach(g => {
              if (g.id === 'qui') {
                const groupSel = selected.get(g.id);
                if (groupSel.size === 0) {
                  allCorrect = false;
                } else {
                  groupSel.forEach(selId => {
                    const opt = g.options.find(o => o.id === selId);
                    if (!opt || !opt.correct) allCorrect = false;
                  });

              } else {
                g.options.forEach(opt => {
                  const isSel = selected.get(g.id).has(opt.id);

            if (allCorrect) {

          });

        }

        if (activity.type === 'j7-build-sentences') {
          const sentenceStates = activity.sentences.map(s => ({
            id: s.id,
            picked: [],

          }));

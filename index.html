          activity.sentences.forEach(s => {
            const disp = document.createElement('div');
            disp.style.position = 'absolute';
            disp.style.left = s.displayBox.left + '%';
            disp.style.top = s.displayBox.top + '%';
            disp.style.width = s.displayBox.width + '%';
            disp.style.height = s.displayBox.height + '%';
            disp.style.display = 'flex';
            disp.style.alignItems = 'center';
            disp.style.gap = '8px';
            disp.style.zIndex = '25';
            disp.style.fontFamily = "'Nunito', 'Quicksand', sans-serif";
            disp.style.fontSize = 'calc(var(--img-width) * 0.016)';
            disp.style.fontWeight = 'bold';
            disp.style.color = '#1e293b';
            disp.style.pointerEvents = 'none';
            imgContainer.appendChild(disp);

            s.words.forEach(w => {
              const btn = document.createElement('div');
              btn.id = `${prefix}-w-${w.id}`;
              btn.style.position = 'absolute';
              btn.style.left = w.left + '%';
              btn.style.top = w.top + '%';
              btn.style.width = w.width + '%';
              btn.style.height = w.height + '%';
              btn.style.cursor = 'pointer';
              btn.style.border = '3px solid transparent';
              btn.style.borderRadius = '16px';
              btn.style.transition = 'all 0.18s ease';
              btn.style.zIndex = '20';

              btn.onmouseenter = () => { btn.style.transform = 'scale(1.03)'; };
              btn.onmouseleave = () => { btn.style.transform = 'scale(1)'; };

              btn.onclick = () => {
                if (isAnswerCorrect) return;
                const state = sentenceStates.find(st => st.id === s.id);
                if (state.picked.includes(w.id)) {
                  state.picked = state.picked.filter(id => id !== w.id);
                  btn.style.border = '3px solid transparent';
                  btn.style.backgroundColor = 'transparent';
                } else {
                  state.picked.push(w.id);
                  btn.style.border = '3px solid ' + w.border;
                  btn.style.backgroundColor = w.bg;
                  btn.animate([
                    { transform: 'scale(0.92)' },
                    { transform: 'scale(1.06)' },
                    { transform: 'scale(1)' }
                  ], { duration: 180 });
                }

                const wordsOrdered = state.picked.map(pid => s.words.find(word => word.id === pid).text);
                disp.innerHTML = wordsOrdered.map((txt, idx) => `
                  <span style="background: rgba(255,255,255,0.92); padding: 3px 10px; border-radius: 9999px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); border: 1.5px solid #0284c7; color: #0369a1;">
                    <span style="color: #64748b; font-size: 0.85em; margin-right: 4px;">${idx + 1}.</span>${txt}
                  </span>
                `).join('');
              };

              imgContainer.appendChild(btn);
            });
          });

          mountValidateButton((vbtn) => {
            if (isAnswerCorrect) {
              onNext();
              return;
            }

            const fb = createFeedback(feedbackTop());
            let allComplete = true;
            let allCorrect = true;

            activity.sentences.forEach(s => {
              const state = sentenceStates.find(st => st.id === s.id);
              if (state.picked.length < s.words.length) allComplete = false;
              const currentSentence = state.picked.map(pid => s.words.find(word => word.id === pid).text).join(' ');
              if (currentSentence !== s.target.join(' ')) allCorrect = false;
            });

            if (!allComplete) {
              fb.textContent = 'Complète toutes les phrases avant de valider !';
              fb.style.color = '#ea580c';
              if (window.j1GentleShake) window.j1GentleShake(fb);
              return;
            }

            if (allCorrect) {
              isAnswerCorrect = true;
              vbtn.src = 'journe 1/continuer.png';
              vbtn.animate([
                { transform: 'scale(0.85)' },
                { transform: 'scale(1.2)' },
                { transform: 'scale(1)' }
              ], { duration: 320 });
              onSuccess(vbtn, fb, 'Bravo ! Toutes tes phrases sont parfaitement construites !');
            } else {
              fb.textContent = "L'ordre des mots n'est pas correct. Suis les aides progressives à droite !";
              fb.style.color = '#dc2626';
              if (window.j1GentleShake) window.j1GentleShake(fb);
            }
          });
          return true;
        }

        if (activity.type === 'j7-line-match') {
          let activeDrag = null;
          let selectedCircle = null;
          const userMatches = {};
          let isAnswerCorrect = false;

          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 100 100');
          svg.setAttribute('preserveAspectRatio', 'none');
          svg.style.position = 'absolute';
          svg.style.left = '0';
          svg.style.top = '0';
          svg.style.width = '100%';
          svg.style.height = '100%';
          svg.style.pointerEvents = 'none';
          svg.style.zIndex = '24';
          imgContainer.appendChild(svg);

          const getCircleCenter = (c) => ({
            x: c.left + c.width / 2,
            y: c.top + c.height / 2
          });

          const lineColors = [
            { stroke: '#0284c7', glow: '#38bdf8' },
            { stroke: '#ec4899', glow: '#f472b6' },
            { stroke: '#10b981', glow: '#34d399' }
          ];

          const redrawSVG = () => {
            svg.innerHTML = `
              <defs>
                <filter id="${prefix}-glow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
                  <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0284c7" flood-opacity="0.6"/>
                </filter>
                <filter id="${prefix}-glow-drag" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
                  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.75"/>
                </filter>
              </defs>
            `;

            let pairIdx = 0;
            Object.entries(userMatches).forEach(([topIdStr, botId]) => {
              const topObj = activity.topCircles.find(c => c.id === Number(topIdStr));
              const botObj = activity.bottomCircles.find(c => c.id === botId);
              if (!topObj || !botObj) return;

              const p1 = getCircleCenter(topObj);
              const p2 = getCircleCenter(botObj);
              const color = lineColors[pairIdx % lineColors.length];
              pairIdx++;

              const dy = (p2.y - p1.y) * 0.5;
              const pathD = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y + dy}, ${p2.x} ${p2.y - dy}, ${p2.x} ${p2.y}`;

              const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              path.setAttribute('d', pathD);
              path.setAttribute('fill', 'none');
              path.setAttribute('stroke', color.stroke);
              path.setAttribute('stroke-width', '2.4');
              path.setAttribute('stroke-linecap', 'round');
              path.setAttribute('filter', `url(#${prefix}-glow)`);
              svg.appendChild(path);

              [p1, p2].forEach(p => {
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', p.x);
                dot.setAttribute('cy', p.y);
                dot.setAttribute('r', '1.6');
                dot.setAttribute('fill', color.stroke);
                dot.setAttribute('stroke', '#ffffff');
                dot.setAttribute('stroke-width', '0.5');
                svg.appendChild(dot);
              });
            });

            if (activeDrag) {
              const p1 = getCircleCenter(activeDrag.startCircle);
              const p2 = { x: activeDrag.currentX, y: activeDrag.currentY };
              const dy = (p2.y - p1.y) * 0.5;
              const pathD = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y + dy}, ${p2.x} ${p2.y - dy}, ${p2.x} ${p2.y}`;

              const dragPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              dragPath.setAttribute('d', pathD);
              dragPath.setAttribute('fill', 'none');
              dragPath.setAttribute('stroke', '#f59e0b');
              dragPath.setAttribute('stroke-width', '2.6');
              dragPath.setAttribute('stroke-dasharray', '3.5, 2');
              dragPath.setAttribute('stroke-linecap', 'round');
              dragPath.setAttribute('filter', `url(#${prefix}-glow-drag)`);
              svg.appendChild(dragPath);

              const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              dot.setAttribute('cx', p2.x);
              dot.setAttribute('cy', p2.y);
              dot.setAttribute('r', '1.6');
              dot.setAttribute('fill', '#f59e0b');
              dot.setAttribute('stroke', '#ffffff');
              dot.setAttribute('stroke-width', '0.5');
              svg.appendChild(dot);
            }
          };

          const styleCircleGroup = (circles, circleType, domPrefix) => {
            circles.forEach(c => {
              const el = document.getElementById(`${prefix}-${domPrefix}-${c.id}`);
              if (!el) return;
              const isMatched = circleType === 'top'
                ? userMatches[c.id] !== undefined
                : Object.values(userMatches).includes(c.id);
              const isSelected = selectedCircle && selectedCircle.type === circleType && selectedCircle.id === c.id;
              const isDragging = activeDrag && activeDrag.startType === circleType && activeDrag.startCircle.id === c.id;

              if (isSelected || isDragging) {
                el.style.border = '4px solid #0284c7';
                el.style.backgroundColor = 'rgba(2, 132, 199, 0.45)';
                el.style.boxShadow = '0 0 14px rgba(2, 132, 199, 0.85)';
                el.style.transform = 'scale(1.22)';
              } else if (isMatched) {
                el.style.border = '3px solid #16a34a';
                el.style.backgroundColor = 'rgba(22, 163, 74, 0.35)';
                el.style.boxShadow = '0 0 8px rgba(22, 163, 74, 0.5)';
                el.style.transform = 'scale(1)';
              } else {
                el.style.border = '2.5px solid rgba(2, 132, 199, 0.5)';
                el.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
                el.style.boxShadow = 'none';
                el.style.transform = 'scale(1)';
              }
            });
          };

          const updateCirclesUI = () => {
            styleCircleGroup(activity.topCircles, 'top', 'tcirc');
            styleCircleGroup(activity.bottomCircles, 'bottom', 'bcirc');
            redrawSVG();
          };

          const connectCircles = (topId, botId) => {
            delete userMatches[topId];
            Object.keys(userMatches).forEach(k => {
              if (userMatches[k] === botId) delete userMatches[k];
            });
            userMatches[topId] = botId;
            selectedCircle = null;
            activeDrag = null;
            updateCirclesUI();
          };

          const onGlobalPointerMove = (e) => {
            if (!activeDrag) return;
            const rect = imgContainer.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            activeDrag.currentX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            activeDrag.currentY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
            redrawSVG();
          };

          const onGlobalPointerUp = (e) => {
            if (!activeDrag) return;
            const rect = imgContainer.getBoundingClientRect();
            const clientX = e.clientX !== undefined ? e.clientX : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0].clientY : 0);
            const dropX = ((clientX - rect.left) / rect.width) * 100;
            const dropY = ((clientY - rect.top) / rect.height) * 100;

            const targets = (activeDrag.startType === 'top') ? activity.bottomCircles : activity.topCircles;
            const hit = targets.find(c => {
              const dx = Math.abs((c.left + c.width / 2) - dropX);
              const dy = Math.abs((c.top + c.height / 2) - dropY);
              return dx < (c.width * 2.2) && dy < (c.height * 2.2);
            });

            if (hit) {
              if (activeDrag.startType === 'top') {
                connectCircles(activeDrag.startCircle.id, hit.id);
              } else {
                connectCircles(hit.id, activeDrag.startCircle.id);
              }
            } else {
              activeDrag = null;
              updateCirclesUI();
            }
          };

          const cleanupPointerListeners = () => {
            window.removeEventListener('mousemove', onGlobalPointerMove);
            window.removeEventListener('mouseup', onGlobalPointerUp);
            window.removeEventListener('touchmove', onGlobalPointerMove);
            window.removeEventListener('touchend', onGlobalPointerUp);
          };

          window.addEventListener('mousemove', onGlobalPointerMove);
          window.addEventListener('mouseup', onGlobalPointerUp);
          window.addEventListener('touchmove', onGlobalPointerMove, { passive: true });
          window.addEventListener('touchend', onGlobalPointerUp);
          this.registerActivityCleanup(cleanupPointerListeners);

          const createCircleEndpoint = (c, circleType, domPrefix) => {
            const circle = document.createElement('div');
            circle.id = `${prefix}-${domPrefix}-${c.id}`;
            circle.style.position = 'absolute';
            circle.style.left = c.left + '%';
            circle.style.top = c.top + '%';
            circle.style.width = c.width + '%';
            circle.style.height = c.height + '%';
            circle.style.borderRadius = '50%';
            circle.style.cursor = 'pointer';
            circle.style.zIndex = '28';
            circle.style.boxSizing = 'border-box';
            circle.style.transition = 'transform 0.15s ease, background 0.15s ease';
            circle.title = c.label + ' (Glisse ou clique pour relier)';

            const handleStart = (clientX, clientY) => {
              if (isAnswerCorrect) return;
              if (circleType === 'top') {
                if (selectedCircle && selectedCircle.type === 'bottom') {
                  connectCircles(c.id, selectedCircle.id);
                  return;
                }
                if (userMatches[c.id] !== undefined && !selectedCircle) {
                  delete userMatches[c.id];
                  updateCirclesUI();
                  return;
                }
              } else {
                if (selectedCircle && selectedCircle.type === 'top') {
                  connectCircles(selectedCircle.id, c.id);
                  return;
                }
                const matchedTopKey = Object.keys(userMatches).find(k => userMatches[k] === c.id);
                if (matchedTopKey !== undefined && !selectedCircle) {
                  delete userMatches[matchedTopKey];
                  updateCirclesUI();
                  return;
                }
              }

              selectedCircle = { id: c.id, type: circleType };
              const rect = imgContainer.getBoundingClientRect();
              activeDrag = {
                startCircle: c,
                startType: circleType,
                currentX: ((clientX - rect.left) / rect.width) * 100,
                currentY: ((clientY - rect.top) / rect.height) * 100
              };
              updateCirclesUI();
            };

            circle.onmousedown = (e) => { e.preventDefault(); handleStart(e.clientX, e.clientY); };
            circle.ontouchstart = (e) => {
              if (e.touches && e.touches[0]) handleStart(e.touches[0].clientX, e.touches[0].clientY);
            };
            imgContainer.appendChild(circle);
          };

          activity.topCircles.forEach(tc => createCircleEndpoint(tc, 'top', 'tcirc'));
          activity.bottomCircles.forEach(bc => createCircleEndpoint(bc, 'bottom', 'bcirc'));

          mountValidateButton((vbtn) => {
            if (isAnswerCorrect) {
              cleanupPointerListeners();
              onNext();
              return;
            }

            const fb = createFeedback(feedbackTop());
            if (Object.keys(userMatches).length < activity.topCircles.length) {
              fb.textContent = "Relie chaque image \u00e0 une partie de l'histoire (D\u00e9but, Ensuite, Fin) !";
              fb.style.color = '#ea580c';
              if (window.j1GentleShake) window.j1GentleShake(fb);
              return;
            }

            const allCorrect = activity.topCircles.every(tc => userMatches[tc.id] === tc.matchWith);
            if (allCorrect) {
              isAnswerCorrect = true;
              vbtn.src = 'journe 1/continuer.png';
              vbtn.animate([
                { transform: 'scale(0.85)' },
                { transform: 'scale(1.2)' },
                { transform: 'scale(1)' }
              ], { duration: 320 });
              onSuccess(vbtn, fb, "Bravo ! Tu as parfaitement reli\u00e9 la chronologie de l'histoire !");
            } else {
              fb.textContent = "Certaines liaisons ne sont pas correctes. R\u00e9fl\u00e9chis \u00e0 ce qui se passe en premier !";
              fb.style.color = '#dc2626';
              if (window.j1GentleShake) window.j1GentleShake(fb);
            }
          });

          updateCirclesUI();
          return true;
        }

        return false;
      },

          'contiuer/excellent.png',
          'contiuer/parfait.png',
          'contiuer/super.png'
        ];

        // Shuffle deck: cycles through all 4 celebration photos in randomized order before repeating
        if (!this.j6SuccessDeck || this.j6SuccessDeck.length === 0) {
          const deck = [...CONTINUER_IMAGES];
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
          if (deck[0] === this.lastJ6SuccessCard && deck.length > 1) {
            const swapIdx = 1 + Math.floor(Math.random() * (deck.length - 1));
            [deck[0], deck[swapIdx]] = [deck[swapIdx], deck[0]];
          }
          this.j6SuccessDeck = deck;
        }

        const chosenSrc = this.j6SuccessDeck.shift();
        this.lastJ6SuccessCard = chosenSrc;

          try {
            const ctx = (window.SoundSystem && window.SoundSystem.ctx) || (window.j1AudioCtx = window.j1AudioCtx || new (window.AudioContext || window.webkitAudioContext)());
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            // Soft celebratory pop sound
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260 + Math.random() * 90, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            // Twinkling spark chime
            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();
            chime.type = 'sine';
            const notes = [784, 880, 1046.5, 1174.6, 1318.5, 1567.98, 1760];
            chime.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now + 0.03);
            chimeGain.gain.setValueAtTime(0.05, now + 0.03);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);
            chime.start(now + 0.03);
            chime.stop(now + 0.32);
          } catch (e) {}
        };

        // Play specific celebration audio corresponding to the chosen photo
        const AUDIO_MAP = {
          'contiuer/bien joue.png': 'contiuer/bien joue.mp3',
          'contiuer/excellent.png': 'contiuer/excellent.mp3',
          'contiuer/parfait.png': 'contiuer/parfait.mp3',
          'contiuer/super.png': 'contiuer/super.mp3'
        };

        let cardAudio = null;
        const targetAudioSrc = AUDIO_MAP[chosenSrc];
        if (targetAudioSrc) {
          try {
            if (window.j6CurrentAudio) {
              window.j6CurrentAudio.pause();
              window.j6CurrentAudio.currentTime = 0;
            }
            cardAudio = new Audio(encodeURI(targetAudioSrc));
            window.j6CurrentAudio = cardAudio;
            cardAudio.play().catch(err => console.log('Card celebration audio playback deferred or blocked:', err));
          } catch (e) {
            console.warn('Card audio play error:', e);
          }
        } else if (window.SoundSystem && typeof window.SoundSystem.playSuccess === 'function') {
          window.SoundSystem.playSuccess();
        }

        // Remove any pre-existing modal if present
        const oldModal = document.getElementById('j1-success-modal');
        if (oldModal) oldModal.remove();

        // FULL SCREEN MODAL: attached to document.body so the blur covers the entire website!
        const modal = document.createElement('div');
        modal.id = 'j1-success-modal';
        modal.className = 'j1-success-modal';

        // Background Fireworks Canvas
        const canvas = document.createElement('canvas');
        canvas.id = 'j1-fireworks-canvas';
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '1';
        modal.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();

      showJourney1EndCelebration() {
        // Stop any running activity audio
        if (window.j1CurrentAudio) {
          try {
            window.j1CurrentAudio.pause();
            window.j1CurrentAudio.currentTime = 0;
          } catch (e) {}
          window.j1CurrentAudio = null;
        }

        // Play Felicitation audio
        try {
          const felicitationAudio = new Audio(encodeURI("contiuer/Felicitation.mp3"));
          window.j1CurrentAudio = felicitationAudio;
          felicitationAudio.play().catch(err => console.log('Felicitation audio playback deferred or blocked:', err));
        } catch (err) {
          console.warn('Felicitation audio error:', err);
        }

        // Web Audio synthesized sound generator for fireworks bursts and chimes
        const playFireworkBurstSound = () => {
          try {
            const ctx = (window.SoundSystem && window.SoundSystem.ctx) || (window.j1AudioCtx = window.j1AudioCtx || new (window.AudioContext || window.webkitAudioContext)());
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260 + Math.random() * 90, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();
            chime.type = 'sine';
            const notes = [784, 880, 1046.5, 1174.6, 1318.5, 1567.98, 1760];
            chime.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now + 0.03);
            chimeGain.gain.setValueAtTime(0.05, now + 0.03);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);
            chime.start(now + 0.03);
            chime.stop(now + 0.32);
          } catch (e) {}
        };

        // Remove any pre-existing celebration modal
        const oldModal = document.getElementById('j1-success-modal');
        if (oldModal) oldModal.remove();

        // Fullscreen celebration modal with backdrop blur
        const modal = document.createElement('div');
        modal.id = 'j1-success-modal';
        modal.className = 'j1-success-modal';

        // Background Fireworks Canvas
        const canvas = document.createElement('canvas');
        canvas.id = 'j1-fireworks-canvas';
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '1';
        modal.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        let animId = null;
        let isRunning = true;
        let isTabVisible = !document.hidden;
        let particles = [];
        let burstTimer = null;
        const MAX_PARTICLES = 300;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const palettes = [
          ['#ffd700', '#ffeb3b', '#ffa726', '#ffffff'],
          ['#ff4081', '#ff80ab', '#f50057', '#ffffff'],
          ['#00e5ff', '#18ffff', '#00b0ff', '#ffffff'],
          ['#76ff03', '#b2ff59', '#64dd17', '#ffffff'],
          ['#d500f9', '#e040fb', '#aa00ff', '#ffffff']
        ];

        const createBurst = (x, y) => {
          if (!isRunning || !isTabVisible) return;
          if (particles.length > MAX_PARTICLES) return;

          const palette = palettes[Math.floor(Math.random() * palettes.length)];
          const particleCount = 40 + Math.floor(Math.random() * 20);
          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2.5 + Math.random() * 6.5;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 2 + Math.random() * 3.5,
              color: palette[Math.floor(Math.random() * palette.length)],
              alpha: 1,
              decay: 0.014 + Math.random() * 0.016,
              sparkle: Math.random() > 0.4
            });
          }
          playFireworkBurstSound();
        };

        const loop = () => {
          if (!isRunning) return;
          if (!isTabVisible) {
            animId = null;
            return;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.sparkle ? p.alpha * (0.6 + 0.4 * Math.sin(Date.now() * 0.03 + i)) : p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animId = requestAnimationFrame(loop);
        };
        loop();

        // Initial burst triplet
        setTimeout(() => createBurst(canvas.width * 0.22, canvas.height * 0.30), 80);
        setTimeout(() => createBurst(canvas.width * 0.78, canvas.height * 0.30), 280);
        setTimeout(() => createBurst(canvas.width * 0.50, canvas.height * 0.18), 480);

        // Continuous festive bursts while card is showing
        const scheduleBurst = () => {
          if (!isRunning) return;
          if (isTabVisible && particles.length < MAX_PARTICLES) {
            const x = canvas.width * (0.15 + Math.random() * 0.70);
            const y = canvas.height * (0.15 + Math.random() * 0.40);
            createBurst(x, y);
          }
          burstTimer = setTimeout(scheduleBurst, 550 + Math.random() * 400);
        };
        burstTimer = setTimeout(scheduleBurst, 900);

        // Visibilitychange handler to prevent tab freeze
        const handleVisibilityChange = () => {
          if (document.hidden) {
            isTabVisible = false;
            particles = [];
            if (animId) {
              cancelAnimationFrame(animId);
              animId = null;
            }
          } else {
            isTabVisible = true;
            particles = [];
            if (isRunning && !animId) {
              animId = requestAnimationFrame(loop);
            }
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        // Center End Card Container
        const cardBox = document.createElement('div');
        cardBox.className = 'j1-end-card-box';

        const cardImg = document.createElement('img');
        cardImg.className = 'j1-success-card-img';
        cardImg.src = 'journe 1/end journe 1.png';
        cardImg.alt = 'F\u00E9licitations !';
        cardImg.draggable = false;

        const finishBtn = document.createElement('button');
        finishBtn.className = 'j1-end-finish-btn';
        finishBtn.setAttribute('title', 'Retourner \u00E0 la carte');
        finishBtn.setAttribute('aria-label', 'Terminer la journ\u00E9e');

        let clicked = false;
        const doFinish = (e) => {
          if (e) e.stopPropagation();
          if (clicked) return;
          clicked = true;

          if (window.SoundSystem && typeof window.SoundSystem.playClick === 'function') {
            window.SoundSystem.playClick();
          }

          modal.classList.remove('show');
          cardBox.style.transform = 'scale(0.85)';
          cardBox.style.opacity = '0';
          cardBox.style.transition = 'transform 0.2s ease, opacity 0.2s ease';

          if (window.j1CurrentAudio) {
            try {
              window.j1CurrentAudio.pause();
              window.j1CurrentAudio.currentTime = 0;
            } catch (err) {}
            window.j1CurrentAudio = null;
          }

          isRunning = false;
          window.removeEventListener('resize', resizeCanvas);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (animId) cancelAnimationFrame(animId);
          if (burstTimer) clearTimeout(burstTimer);
          particles = [];

          setTimeout(() => {
            modal.remove();
            this.finishJourney1();
          }, 240);
        };

        finishBtn.onclick = doFinish;
        cardBox.onclick = doFinish;

        cardBox.appendChild(cardImg);
        cardBox.appendChild(finishBtn);
        modal.appendChild(cardBox);

        document.body.appendChild(modal);

        requestAnimationFrame(() => {
          modal.classList.add('show');
        });
      },

        if (activity.type === 'match') {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

          let currentLeft = null;

          const setupMatchBtn = (opt, isLeft) => {
            const btn = document.createElement('div');

            btn.onclick = () => {

                  this.currentActivityState.lines.push({ l: currentLeft.id, r: opt.id });

                  // Smooth curved bezier connector with animated glow
                  const x1 = currentLeft.left + currentLeft.width;
                  const y1 = currentLeft.top + currentLeft.height / 2;
                  const x2 = opt.left;
                  const y2 = opt.top + opt.height / 2;
                  const dx = (x2 - x1) * 0.45;
                  const pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

                  // Ensure defs and filter exist
                  if (!svg.querySelector('#match-glow')) {
                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    defs.innerHTML = `
                      <filter id="match-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.35"/>
                      </filter>
                      <linearGradient id="match-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#0ea5e9"/>
                        <stop offset="50%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                      </linearGradient>
                    `;
                    svg.insertBefore(defs, svg.firstChild);
                  }

                  // Path element
                  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                  path.setAttribute('d', pathD);
                  path.setAttribute('fill', 'none');
                  path.setAttribute('stroke', 'url(#match-grad)');
                  path.setAttribute('stroke-width', '4.5');
                  path.setAttribute('stroke-linecap', 'round');
                  path.setAttribute('filter', 'url(#match-glow)');
                  svg.appendChild(path);

                  // Endpoint dots
                  const startDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                  startDot.setAttribute('cx', x1 + '%');
                  startDot.setAttribute('cy', y1 + '%');
                  startDot.setAttribute('r', '4');
                  startDot.setAttribute('fill', '#0284c7');
                  svg.appendChild(startDot);

                  const endDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                  endDot.setAttribute('cx', x2 + '%');
                  endDot.setAttribute('cy', y2 + '%');
                  endDot.setAttribute('r', '0');
                  endDot.setAttribute('fill', '#2563eb');
                  svg.appendChild(endDot);

                  const len = path.getTotalLength();
                  path.style.strokeDasharray = len;
                  path.style.strokeDashoffset = len;
                  const anim = path.animate(
                    [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
                    { duration: 480, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
                  );
                  anim.onfinish = () => {
                    path.style.strokeDashoffset = 0;
                    endDot.animate([
                      { r: 0, opacity: 0 },
                      { r: 6, opacity: 1 },

                    resBox.style.top = targetResBox.top + '%';

                    resBox.style.height = targetResBox.height + '%';
                    resBox.style.display = 'flex';
                    resBox.style.alignItems = 'center';
                    resBox.style.justifyContent = 'center';
                    resBox.style.color = '#1e3a8a';
                    resBox.style.fontFamily = "'Quicksand', 'Nunito', sans-serif";
                    resBox.style.fontSize = 'calc(var(--img-width) * 0.026)';
                    resBox.style.fontWeight = '700';
                    resBox.style.letterSpacing = '0.5px';
                    resBox.style.textShadow = '0 1px 2px rgba(255,255,255,0.8)';
                    resBox.style.pointerEvents = 'none';
                    resBox.textContent = currentLeft.text + opt.text;
                    imgContainer.appendChild(resBox);

                    // Elegant pop-in and float animation
                    resBox.animate([
                      { transform: 'scale(0.5) translateY(4px)', opacity: 0, filter: 'blur(3px)' },
                      { transform: 'scale(1.12) translateY(-2px)', opacity: 0.9, filter: 'blur(0px)', offset: 0.7 },
                      { transform: 'scale(1) translateY(0)', opacity: 1 }
                    ], { duration: 450, delay: 200, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });

                    // Confetti / sparkle burst at the result box
                    try {
                      const conf = document.createElement('div');
                      conf.style.position = 'absolute';
                      conf.style.left = (targetResBox.left + targetResBox.width / 2) + '%';
                      conf.style.top = (targetResBox.top + targetResBox.height / 2) + '%';
                      conf.style.pointerEvents = 'none';
                      conf.style.zIndex = '35';
                      conf.innerHTML = '✨';
                      conf.style.fontSize = 'calc(var(--img-width) * 0.02)';
                      imgContainer.appendChild(conf);
                      conf.animate([
                        { transform: 'translate(-50%, -50%) scale(0.2) rotate(0deg)', opacity: 1 },
                        { transform: 'translate(-50%, -120%) scale(1.4) rotate(45deg)', opacity: 1, offset: 0.6 },
                        { transform: 'translate(-50%, -160%) scale(0.8) rotate(90deg)', opacity: 0 }
                      ], { duration: 650, delay: 350, easing: 'ease-out' }).onfinish = () => conf.remove();
                    } catch (e) { }

                  // Flash highlight on the completed buttons
                  [btn, document.querySelector('.match-left-active')].forEach(el => {

                  document.querySelectorAll('.match-left-active').forEach(e => {

                  document.querySelectorAll('.match-left-active').forEach(e => {
                    e.style.border = 'none'; e.classList.remove('match-left-active'); e.style.transform = 'scale(1)';
                  });
                  currentLeft = null;
                }
              }
            };
            imgContainer.appendChild(btn);
          };

          activity.left.forEach(opt => setupMatchBtn(opt, true));
          activity.right.forEach(opt => setupMatchBtn(opt, false));
        }

        if (activity.type === 'drawing') {
          this.currentActivityState.drawings = {};

          const resamplePath = (points, numPoints) => {
            if (points.length === 0) return [];
            if (points.length === 1) return Array(numPoints).fill(points[0]);
            let totalLength = 0;
            for (let i = 1; i < points.length; i++) {
              totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
            }
            const step = totalLength / (numPoints - 1);
            const newPoints = [points[0]];
            let currentD = 0;
            for (let i = 1; i < points.length; i++) {
              let p0 = points[i - 1];
              let p1 = points[i];
              let dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
              while (currentD + dist >= step && newPoints.length < numPoints - 1) {
                let t = (step - currentD) / dist;
                let nx = p0.x + t * (p1.x - p0.x);
                let ny = p0.y + t * (p1.y - p0.y);
                newPoints.push({ x: nx, y: ny });
                p0 = { x: nx, y: ny };
                dist -= (step - currentD);
                currentD = 0;
              }
              currentD += dist;
            }
            while (newPoints.length < numPoints) newPoints.push(points[points.length - 1]);
            return newPoints;
          };



          activity.boxes.forEach(box => {
            this.currentActivityState.drawings[box.id] = { points: [], passed: false, evalTimeout: null };
            const state = this.currentActivityState.drawings[box.id];

            const canvasWrapper = document.createElement('div');
            canvasWrapper.style.position = 'absolute';
            canvasWrapper.style.left = box.left + '%';
            canvasWrapper.style.top = box.top + '%';
            canvasWrapper.style.width = box.width + '%';
            canvasWrapper.style.height = box.height + '%';
            canvasWrapper.style.borderRadius = '10px';
            canvasWrapper.style.zIndex = '25';
            canvasWrapper.style.touchAction = 'none';

            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.touchAction = 'none';
            canvas.style.cursor = 'crosshair';
            canvasWrapper.appendChild(canvas);

            const btnClear = document.createElement('button');
            btnClear.textContent = '✖';
            btnClear.title = 'Effacer';
            btnClear.style.position = 'absolute';
            btnClear.style.top = '5px';
            btnClear.style.right = '5px';
            btnClear.style.width = '30px';
            btnClear.style.height = '30px';
            btnClear.style.borderRadius = '50%';

            btnClear.style.fontWeight = 'bold';
            btnClear.style.cursor = 'pointer';
            btnClear.style.boxShadow = '0 2px 5px rgba(0,0,0,0.3)';
            canvasWrapper.appendChild(btnClear);

            imgContainer.appendChild(canvasWrapper);

            let ctx = canvas.getContext('2d');
            let isDrawing = false;

            const ensureCanvasSize = () => {
              const rect = canvas.getBoundingClientRect();
              const w = Math.round(rect.width || canvas.clientWidth || canvasWrapper.clientWidth);
              const h = Math.round(rect.height || canvas.clientHeight || canvasWrapper.clientHeight);
              if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w;
                canvas.height = h;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#2d3436';
                ctx.fillStyle = '#2d3436';
                if (state.points && state.points.length > 0) {
                  redrawStrokes(state.passed ? '#4ade80' : '#2d3436');
                }
              }
            };

            ensureCanvasSize();
            img.addEventListener('load', () => {
              ensureCanvasSize();
              setTimeout(ensureCanvasSize, 50);
              setTimeout(ensureCanvasSize, 250);
            });
            setTimeout(ensureCanvasSize, 50);
            setTimeout(ensureCanvasSize, 200);
            setTimeout(ensureCanvasSize, 600);

            const getPos = (e) => {
              ensureCanvasSize();
              const rect = canvas.getBoundingClientRect();
              let clientX = e.clientX;
              let clientY = e.clientY;
              if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
              } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
              }
              const rw = rect.width || canvas.clientWidth || 1;
              const rh = rect.height || canvas.clientHeight || 1;
              return {
                x: (clientX - rect.left) * (canvas.width / rw),
                y: (clientY - rect.top) * (canvas.height / rh),
                nx: Math.max(0, Math.min(1, (clientX - rect.left) / rw)),
                ny: Math.max(0, Math.min(1, (clientY - rect.top) / rh))
              };
            };

            const redrawStrokes = (color) => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              if (state.points.length === 0) return;
              ctx.strokeStyle = color;
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              const p0 = state.points[0];
              const p0x = p0.nx != null ? p0.nx * canvas.width : p0.x;
              const p0y = p0.ny != null ? p0.ny * canvas.height : p0.y;
              ctx.moveTo(p0x, p0y);
              for (let i = 1; i < state.points.length; i++) {
                const pi = state.points[i];
                const pix = pi.nx != null ? pi.nx * canvas.width : pi.x;
                const piy = pi.ny != null ? pi.ny * canvas.height : pi.y;
                ctx.lineTo(pix, piy);
              }
              ctx.stroke();
            };

            state.evaluate = () => {
              if (state.passed) return true;
              const pts = state.points;
              if (pts.length < 5) return false;

              const N = 30;
              const userResampled = resamplePath(pts, N);
              const expectedResampled = resamplePath(box.expected, N);

              let totalDist = 0;
              let totalDistRev = 0;
              const revExpected = [...expectedResampled].reverse();
              for (let i = 0; i < N; i++) {
                totalDist += Math.hypot(userResampled[i].x - expectedResampled[i].x, userResampled[i].y - expectedResampled[i].y);
                totalDistRev += Math.hypot(userResampled[i].x - revExpected[i].x, userResampled[i].y - revExpected[i].y);
              }
              const avgDist = Math.min(totalDist / N, totalDistRev / N);

              let minX = 1, maxX = 0, minY = 1, maxY = 0;
              pts.forEach(p => {
                const px = p.nx != null ? p.nx : p.x;
                const py = p.ny != null ? p.ny : p.y;
                if (px < minX) minX = px;
                if (px > maxX) maxX = px;
                if (py < minY) minY = py;
                if (py > maxY) maxY = py;
              });
              const spanX = maxX - minX;
              const spanY = maxY - minY;

              if (avgDist < 0.48 || (spanX > 0.20 && spanY > 0.20 && pts.length >= 8)) {
                state.passed = true;
                btnClear.style.display = 'none';
                redrawStrokes('#4ade80');
                return true;
              }
              return false;
            };

            const startDraw = (e) => {
              if (state.passed) return;
              if (e.cancelable) e.preventDefault();
              ensureCanvasSize();
              isDrawing = true;

              const pos = getPos(e);
              ctx.strokeStyle = '#2d3436';
              ctx.fillStyle = '#2d3436';
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
              ctx.fill();

              ctx.beginPath();
              ctx.moveTo(pos.x, pos.y);
              state.points.push({ x: pos.nx, y: pos.ny, nx: pos.nx, ny: pos.ny });
            };

            const moveDraw = (e) => {
              if (!isDrawing || state.passed) return;
              if (e.cancelable) e.preventDefault();
              const pos = getPos(e);
              ctx.lineTo(pos.x, pos.y);
              ctx.stroke();
              state.points.push({ x: pos.nx, y: pos.ny, nx: pos.nx, ny: pos.ny });
            };

            const endDraw = (e) => {
              if (isDrawing) {
                if (e && e.cancelable) e.preventDefault();
                isDrawing = false;
              }
            };

            if (window.PointerEvent) {
              canvas.addEventListener('pointerdown', startDraw);
              canvas.addEventListener('pointermove', moveDraw);
              window.addEventListener('pointerup', endDraw);
              window.addEventListener('pointercancel', endDraw);
            } else {
              canvas.addEventListener('mousedown', startDraw);
              canvas.addEventListener('mousemove', moveDraw);
              window.addEventListener('mouseup', endDraw);

              canvas.addEventListener('touchstart', startDraw, { passive: false });
              canvas.addEventListener('touchmove', moveDraw, { passive: false });
              window.addEventListener('touchend', endDraw);
            }

            btnClear.onclick = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              state.points = [];
              state.passed = false;
              const fb = document.getElementById('j1-feedback');
              if (fb) fb.textContent = '';
            };
          });

      validateJourney1Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j1-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids) isCorrect = true;
        }
        else if (activity.type === 'highlight' || activity.type === 'underline') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'match') {
          let correctPairs = 0;
          let wrongPair = false;
          state.lines.forEach(pair => {
            if (activity.matches[pair.l] === pair.r) correctPairs++;
            else wrongPair = true;
          });
          if (!wrongPair && correctPairs === Object.keys(activity.matches).length) isCorrect = true;
        }
        else if (activity.type === 'sentence') {
          const normalize = str => (str || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[.\s]+/g, ' ')
            .trim();

          const builtNorm = normalize(state.sentence.join(' '));

          const validNorms = [
            "au souk aziza achete du raisin et des fraises",
            "aziza achete du raisin et des fraises au souk",
            "au souk aziza achete des fraises et du raisin",
            "aziza achete des fraises et du raisin au souk"
          ];

          if (validNorms.includes(builtNorm) || activity.validSentences.some(v => normalize(v) === builtNorm)) {
            isCorrect = true;
          }
        }
        else if (activity.type === 'drawing') {
          let fail = false;
          let checkAllDone = true;
          activity.boxes.forEach(box => {
            const drawState = this.currentActivityState.drawings[box.id];
            if (drawState.points.length < 10) checkAllDone = false;
            else if (!drawState.evaluate()) fail = true;
          });
          if (checkAllDone && !fail) isCorrect = true;
        }

        if (isCorrect) {
          const fb = document.getElementById('j1-feedback');
          if (fb) {
            fb.textContent = '';
            fb.style.display = 'none';
          }
          this.showJourney1SuccessPopup();
        } else {
          if (activity.type === 'underline') {
            fb.textContent = "Essaie encore ! Écoute bien le son [z].";
          } else {
            fb.textContent = "Oups, ce n'est pas tout à fait ça. Réessaie !";
          }
          fb.style.color = '#f87171';
          window.j1GentleShake(fb);

          // Optional: hide error after a few seconds or allow immediate retry
          if (activity.type === 'match' || activity.type === 'sentence') {
            setTimeout(() => this.loadJourney1Activity(), 1500);
          }
        }
      },

      showJourney1SuccessPopup() {
        const CONTINUER_IMAGES = [
          'contiuer/bien joue.png',
          'contiuer/excellent.png',
          'contiuer/parfait.png',
          'contiuer/super.png'
        ];

        // Shuffle deck: cycles through all 4 celebration photos in randomized order before repeating
        if (!this.j1SuccessDeck || this.j1SuccessDeck.length === 0) {
          const deck = [...CONTINUER_IMAGES];
          for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
          }
          if (deck[0] === this.lastJ1SuccessCard && deck.length > 1) {
            const swapIdx = 1 + Math.floor(Math.random() * (deck.length - 1));
            [deck[0], deck[swapIdx]] = [deck[swapIdx], deck[0]];
          }
          this.j1SuccessDeck = deck;
        }

        const chosenSrc = this.j1SuccessDeck.shift();
        this.lastJ1SuccessCard = chosenSrc;

        // Hide stray feedback and validation button
        const fb = document.getElementById('j1-feedback');
        if (fb) {
          fb.textContent = '';
          fb.style.display = 'none';
        }
        const valBtnWrapper = document.getElementById('j1-val-btn-wrapper');
        if (valBtnWrapper) {
          valBtnWrapper.style.display = 'none';
        }

        // Web Audio synthesized sound generator for fireworks bursts and chimes
        const playFireworkBurstSound = () => {
          try {
            const ctx = (window.SoundSystem && window.SoundSystem.ctx) || (window.j1AudioCtx = window.j1AudioCtx || new (window.AudioContext || window.webkitAudioContext)());
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            // Soft celebratory pop sound
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260 + Math.random() * 90, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);

            // Twinkling spark chime
            const chime = ctx.createOscillator();
            const chimeGain = ctx.createGain();
            chime.type = 'sine';
            const notes = [784, 880, 1046.5, 1174.6, 1318.5, 1567.98, 1760];
            chime.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], now + 0.03);
            chimeGain.gain.setValueAtTime(0.05, now + 0.03);
            chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            chime.connect(chimeGain);
            chimeGain.connect(ctx.destination);
            chime.start(now + 0.03);
            chime.stop(now + 0.32);
          } catch (e) {}
        };

        // Play specific celebration audio corresponding to the chosen photo
        const AUDIO_MAP = {
          'contiuer/bien joue.png': 'contiuer/bien joue.mp3',
          'contiuer/excellent.png': 'contiuer/excellent.mp3',
          'contiuer/parfait.png': 'contiuer/parfait.mp3',
          'contiuer/super.png': 'contiuer/super.mp3'
        };

        let cardAudio = null;
        const targetAudioSrc = AUDIO_MAP[chosenSrc];
        if (targetAudioSrc) {
          try {
            if (window.j1CurrentAudio) {
              window.j1CurrentAudio.pause();
              window.j1CurrentAudio.currentTime = 0;
            }
            cardAudio = new Audio(encodeURI(targetAudioSrc));
            window.j1CurrentAudio = cardAudio;
            cardAudio.play().catch(err => console.log('Card celebration audio playback deferred or blocked:', err));
          } catch (e) {
            console.warn('Card audio play error:', e);
          }
        } else if (window.SoundSystem && typeof window.SoundSystem.playSuccess === 'function') {
          window.SoundSystem.playSuccess();
        }

        // Remove any pre-existing modal if present
        const oldModal = document.getElementById('j1-success-modal');
        if (oldModal) oldModal.remove();

        // FULL SCREEN MODAL: attached to document.body so the blur covers the entire website!
        const modal = document.createElement('div');
        modal.id = 'j1-success-modal';
        modal.className = 'j1-success-modal';

        // Background Fireworks Canvas
        const canvas = document.createElement('canvas');
        canvas.id = 'j1-fireworks-canvas';
        canvas.style.position = 'absolute';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '1';
        modal.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        let animId = null;
        let isRunning = true;
        let isTabVisible = !document.hidden;
        let particles = [];
        let burstTimer = null;
        const MAX_PARTICLES = 300;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const palettes = [
          ['#ffd700', '#ffeb3b', '#ffa726', '#ffffff'],
          ['#ff4081', '#ff80ab', '#f50057', '#ffffff'],
          ['#00e5ff', '#18ffff', '#00b0ff', '#ffffff'],
          ['#76ff03', '#b2ff59', '#64dd17', '#ffffff'],
          ['#d500f9', '#e040fb', '#aa00ff', '#ffffff']
        ];

        const createBurst = (x, y) => {
          if (!isRunning || !isTabVisible) return;
          if (particles.length > MAX_PARTICLES) return;

          const palette = palettes[Math.floor(Math.random() * palettes.length)];
          const particleCount = 35 + Math.floor(Math.random() * 15);
          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2.5 + Math.random() * 6.0;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: 2 + Math.random() * 3,
              color: palette[Math.floor(Math.random() * palette.length)],
              alpha: 1,
              decay: 0.015 + Math.random() * 0.018,
              sparkle: Math.random() > 0.4
            });
          }
          playFireworkBurstSound();
        };

        const loop = () => {
          if (!isRunning) return;

          // If the tab is hidden, suspend rendering loop until user returns
          if (!isTabVisible) {
            animId = null;
            return;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;
            p.vx *= 0.985;
            p.vy *= 0.985;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.globalAlpha = p.sparkle ? p.alpha * (0.6 + 0.4 * Math.sin(Date.now() * 0.03 + i)) : p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          animId = requestAnimationFrame(loop);
        };
        loop();

        // Initial burst triplet
        setTimeout(() => createBurst(canvas.width * 0.22, canvas.height * 0.30), 80);
        setTimeout(() => createBurst(canvas.width * 0.78, canvas.height * 0.30), 280);
        setTimeout(() => createBurst(canvas.width * 0.50, canvas.height * 0.18), 480);

        // Continuous festive bursts while card is showing
        const scheduleBurst = () => {
          if (!isRunning) return;
          if (isTabVisible && particles.length < MAX_PARTICLES) {
            const x = canvas.width * (0.15 + Math.random() * 0.70);
            const y = canvas.height * (0.15 + Math.random() * 0.40);

          }

        const handleVisibilityChange = () => {
          if (document.hidden) {
            isTabVisible = false;
            // Purge existing particles so they don't backlog
            particles = [];
            if (animId) {
              cancelAnimationFrame(animId);
              animId = null;
            }
          } else {
            isTabVisible = true;
            particles = [];
            if (isRunning && !animId) {
              animId = requestAnimationFrame(loop);
            }
          }
        };

          }

            } catch (e) {}
            cardAudio = null;
          }
          if (window.j1CurrentAudio) {

          }

          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (animId) cancelAnimationFrame(animId);
          if (burstTimer) clearTimeout(burstTimer);
          particles = [];

          setTimeout(() => {
            modal.remove();
            if (fb) fb.style.display = '';
            this.handleJourney1Next();
          }, 240);
        };

        cardBox.appendChild(cardImg);
        cardBox.appendChild(continueBtn);
        modal.appendChild(cardBox);

        document.body.appendChild(modal);

          modal.classList.add('show');
        });

      validateJourney2Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j2-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'match') {
          let correctPairs = 0;
          let wrongPair = false;
          state.lines.forEach(pair => {
            if (activity.matches[pair.l] === pair.r) correctPairs++;
            else wrongPair = true;
          });
          if (!wrongPair && correctPairs === Object.keys(activity.matches).length) isCorrect = true;
        }
        else if (activity.type === 'sentence') {
          const normalize = str => str.toLowerCase().replace(/[.\s]+/g, ' ').trim().replace(/è/g, 'e');
          const builtNorm = normalize(state.sentence.join(' '));
          isCorrect = activity.validSentences.some(s => normalize(s) === builtNorm) || builtNorm === 'karim achete un bouquet de jasmin';
        }
        else if (activity.type === 'writing') {
          const inputs = activity.inputs.map(inp => (document.getElementById(inp.id).value || '').trim());

          // Helper to clean accents, punctuation and normalize spaces
          const cleanStr = (s) => {
            return s.toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()'"’]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          };

          // Key concepts for Sentence 1: recreation/cour, caroline, joue, camarades/amis
          const checkSentence1 = (raw) => {
            const c = cleanStr(raw);
            if (c.length < 8) return false;
            const hasSubject = c.includes('caroline') || c.includes('elle');
            const hasAction = c.includes('joue') || c.includes('jouer') || c.includes('amuse') || c.includes('court') || c.includes('parle');
            const hasContext = c.includes('recreation') || c.includes('cour') || c.includes('camarade') || c.includes('ami') || c.includes('eleve');
            // Match either key content or good semantic coverage
            return (hasSubject && (hasAction || hasContext)) || (hasAction && hasContext) || c.includes('pendant la recreation');
          };

          // Key concepts for Sentence 2: camarades/amis, elle/caroline, parle, rit, amuse
          const checkSentence2 = (raw) => {
            const c = cleanStr(raw);
            if (c.length < 8) return false;
            const hasAction = c.includes('parle') || c.includes('rit') || c.includes('amuse') || c.includes('joue') || c.includes('sourit');
            const hasContext = c.includes('camarade') || c.includes('ami') || c.includes('elle') || c.includes('caroline') || c.includes('avec');
            return hasAction && hasContext;
          };

          const s1Ok = checkSentence1(inputs[0] || '');
          const s2Ok = checkSentence2(inputs[1] || '');

          state.writingTrials = (state.writingTrials || 0) + 1;

          if (s1Ok && s2Ok) {
            isCorrect = true;
          } else {
            // Escalate hints based on trials
            const hintEl = document.getElementById('j2-hints-area');
            if (hintEl) {
              if (state.writingTrials === 1) {
                hintEl.innerHTML = `
                  <div style="font-weight: 700; color: #ea580c; margin-bottom: 2px;">💡 Indice (Essai 1) :</div>
                  <div style="font-size: 0.95em; color: #1e293b;">
                    Essaye de commencer ainsi :
                  </div>
                  <div style="background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-weight: 600; font-size: 0.9em; color: #0f172a; border-left: 3px solid #f97316;">
                    1. Pendant la récréation, Caroline joue...<br>
                    2. Avec ses camarades, elle...
                  </div>
                `;
              } else {
                // After 2 trials, show the full model sentences clearly
                hintEl.innerHTML = `
                  <div style="font-weight: 700; color: #16a34a; margin-bottom: 2px;">⭐ Réponses modèles :</div>
                  <div style="font-size: 0.92em; color: #1e293b; line-height: 1.4;">
                    Tu peux t'inspirer ou recopier :
                  </div>
                  <div style="background: #f0fdf4; padding: 6px 10px; border-radius: 6px; font-size: 0.88em; color: #166534; border-left: 3px solid #22c55e;">
                    <b>1.</b> Pendant la récréation, Caroline joue avec ses nouveaux camarades dans la cour.<br>
                    <b>2.</b> Avec ses camarades, elle parle, rit et s’amuse.
                  </div>
                `;
              }
              hintEl.animate([{ transform: 'scale(0.96)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
            }
          }
        }

        if (isCorrect) {
          const fb = document.getElementById('j2-feedback');
          if (fb) {
            fb.textContent = '';
            fb.style.display = 'none';
          }
          this.showJourney2SuccessPopup();

          if (activity.type === 'match' || activity.type === 'sentence') {
            setTimeout(() => this.loadJourney2Activity(), 1500);
          }
        }
      },

        if (activity.type === 'match') {

            btn.style.top = opt.top + '%';

            btn.onclick = (e) => {

                // Deselect previous left selection

                // Highlight this left selection with a vibrant blue glow outline

                btn.style.transform = 'scale(1.04)';

                // Right side syllable clicked

                if (activity.matches[currentLeft.id] === opt.id) {
                  // CORRECT MATCH!
                  this.currentActivityState.selected.add(currentLeft.id);
                  this.currentActivityState.selected.add(opt.id);
                  this.currentActivityState.lines.push({ l: currentLeft.id, r: opt.id });

                  // Calculate start & end coordinates for SVG arrow
                  const x1 = currentLeft.left + currentLeft.width;
                  const y1 = currentLeft.top + currentLeft.height / 2;
                  const x2 = opt.left;
                  const y2 = opt.top + opt.height / 2;
                  const dx = (x2 - x1) * 0.45;
                  const pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

                  // Ensure defs (gradient, glow, arrowhead marker) exist
                  if (!svg.querySelector('#match-glow')) {
                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    defs.innerHTML = `
                      <filter id="match-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.35"/>
                      </filter>
                      <linearGradient id="match-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#0ea5e9"/>
                        <stop offset="50%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                      </linearGradient>
                      <marker id="match-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
                      </marker>
                    `;
                    svg.insertBefore(defs, svg.firstChild);
                  }

                  // Path element (the connecting arrow)
                  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                  path.setAttribute('d', pathD);
                  path.setAttribute('fill', 'none');
                  path.setAttribute('stroke', 'url(#match-grad)');
                  path.setAttribute('stroke-width', '4.5');
                  path.setAttribute('stroke-linecap', 'round');
                  path.setAttribute('filter', 'url(#match-glow)');
                  path.setAttribute('marker-end', 'url(#match-arrow)');
                  svg.appendChild(path);

                  // Start dot
                  const startDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                  startDot.setAttribute('cx', x1 + '%');
                  startDot.setAttribute('cy', y1 + '%');
                  startDot.setAttribute('r', '4');
                  startDot.setAttribute('fill', '#0284c7');
                  svg.appendChild(startDot);

                  // Animate the path stroke
                  const len = path.getTotalLength();
                  path.style.strokeDasharray = len;
                  path.style.strokeDashoffset = len;
                  path.animate(
                    [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
                    { duration: 420, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
                  ).onfinish = () => {
                    path.style.strokeDashoffset = 0;
                  };

                  // Write the assembled word in the corresponding 3rd column result box!
                  const targetResBox = currentLeft.resBox || opt.resBox;
                  if (targetResBox) {
                    const resBox = document.createElement('div');
                    resBox.style.position = 'absolute';
                    resBox.style.left = targetResBox.left + '%';
                    resBox.style.top = targetResBox.top + '%';
                    resBox.style.width = targetResBox.width + '%';
                    resBox.style.height = targetResBox.height + '%';
                    resBox.style.display = 'flex';
                    resBox.style.alignItems = 'center';
                    resBox.style.justifyContent = 'center';
                    resBox.style.color = '#1e3a8a';
                    resBox.style.fontFamily = "'Quicksand', 'Nunito', sans-serif";
                    resBox.style.fontSize = 'calc(var(--img-width) * 0.026)';
                    resBox.style.fontWeight = '700';
                    resBox.style.letterSpacing = '0.5px';
                    resBox.style.textShadow = '0 1px 2px rgba(255,255,255,0.8)';
                    resBox.style.pointerEvents = 'none';
                    resBox.textContent = currentLeft.text + opt.text;
                    imgContainer.appendChild(resBox);

                    resBox.animate([
                      { transform: 'scale(0.5) translateY(4px)', opacity: 0, filter: 'blur(3px)' },
                      { transform: 'scale(1.12) translateY(-2px)', opacity: 0.9, filter: 'blur(0px)', offset: 0.7 },
                      { transform: 'scale(1) translateY(0)', opacity: 1 }
                    ], { duration: 450, delay: 180, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });

                    // Confetti sparkle ✨
                    try {
                      const conf = document.createElement('div');
                      conf.style.position = 'absolute';
                      conf.style.left = (targetResBox.left + targetResBox.width / 2) + '%';
                      conf.style.top = (targetResBox.top + targetResBox.height / 2) + '%';
                      conf.style.pointerEvents = 'none';
                      conf.style.zIndex = '35';
                      conf.innerHTML = '✨';
                      conf.style.fontSize = 'calc(var(--img-width) * 0.02)';
                      imgContainer.appendChild(conf);
                      conf.animate([
                        { transform: 'translate(-50%, -50%) scale(0.2) rotate(0deg)', opacity: 1 },
                        { transform: 'translate(-50%, -120%) scale(1.4) rotate(45deg)', opacity: 1, offset: 0.6 },
                        { transform: 'translate(-50%, -160%) scale(0.8) rotate(90deg)', opacity: 0 }
                      ], { duration: 600, delay: 300, easing: 'ease-out' }).onfinish = () => conf.remove();
                    } catch (e) {}
                  }

                  // Gentle bounce animation on completed syllables
                  [btn, document.querySelector('.match-left-active')].forEach(el => {
                    if (el) {
                      el.animate([
                        { transform: 'scale(1.08)', filter: 'brightness(1.15)' },
                        { transform: 'scale(1)', filter: 'brightness(1)' }
                      ], { duration: 320, easing: 'ease-out' });
                    }
                  });

                  // Clear active state
                  document.querySelectorAll('.match-left-active').forEach(el => {
                    el.style.border = 'none';
                    el.style.boxShadow = 'none';
                    el.classList.remove('match-left-active');
                    el.style.transform = 'scale(1)';
                  });
                  currentLeft = null;

                  const fb = document.getElementById('j3-feedback');
                  if (fb) fb.textContent = '';
                } else {
                  // WRONG MATCH
                  const fb = document.getElementById('j3-feedback');
                  if (fb) {
                    fb.textContent = "Essaie encore ! Ce n'est pas la bonne syllabe.";
                    fb.style.color = '#f87171';
                    if (window.j1GentleShake) window.j1GentleShake(fb);
                  }
                  if (window.j1GentleShake) window.j1GentleShake(btn);

                  // Keep selection or reset
                  document.querySelectorAll('.match-left-active').forEach(el => {
                    el.style.border = 'none';
                    el.style.boxShadow = 'none';
                    el.classList.remove('match-left-active');
                    el.style.transform = 'scale(1)';
                  });
                  currentLeft = null;
                }
              }
            };

            imgContainer.appendChild(btn);
          };

          activity.left.forEach(opt => setupMatchBtn(opt, true));
          activity.right.forEach(opt => setupMatchBtn(opt, false));
        }

        if (activity.type === 'drawing' || activity.type === 'mixed') {
          this.currentActivityState.drawings = {};

          const resamplePath = (points, numPoints) => {
            if (points.length === 0) return [];
            if (points.length === 1) return Array(numPoints).fill(points[0]);
            let totalLength = 0;
            for (let i = 1; i < points.length; i++) {
              totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
            }
            const step = totalLength / (numPoints - 1);
            const newPoints = [points[0]];
            let currentD = 0;
            for (let i = 1; i < points.length; i++) {
              let p0 = points[i - 1];
              let p1 = points[i];
              let dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
              while (currentD + dist >= step && newPoints.length < numPoints - 1) {
                let t = (step - currentD) / dist;
                let nx = p0.x + t * (p1.x - p0.x);
                let ny = p0.y + t * (p1.y - p0.y);
                newPoints.push({ x: nx, y: ny });
                p0 = { x: nx, y: ny };
                dist -= (step - currentD);
                currentD = 0;
              }
              currentD += dist;
            }
            while (newPoints.length < numPoints) newPoints.push(points[points.length - 1]);
            return newPoints;
          };

          activity.boxes.forEach(box => {
            this.currentActivityState.drawings[box.id] = { points: [], passed: false, evalTimeout: null };
            const state = this.currentActivityState.drawings[box.id];

            const canvasWrapper = document.createElement('div');

            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';

            const btnClear = document.createElement('button');
            btnClear.textContent = '✖';
            btnClear.title = 'Effacer';
            btnClear.style.position = 'absolute';
            btnClear.style.top = '5px';
            btnClear.style.right = '5px';
            btnClear.style.width = '30px';
            btnClear.style.height = '30px';
            btnClear.style.borderRadius = '50%';
            btnClear.style.border = '2px solid white';
            btnClear.style.background = '#d63031';

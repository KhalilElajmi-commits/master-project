            if (l.cx !== undefined) d.dataset.cx = l.cx;
            if (l.cy !== undefined) d.dataset.cy = l.cy;
            d.style.position = 'absolute'; d.style.left = l.left + '%'; d.style.top = l.top + '%';
            d.style.width = l.width + '%'; d.style.height = l.height + '%';
            d.style.cursor = 'pointer'; d.style.borderRadius = '10px'; d.style.border = '2px solid transparent';

            d.onmousedown = (e) => {
              activeStartId = l.id;
              activeLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              activeLine.setAttribute('stroke', '#facc15');
              activeLine.setAttribute('stroke-width', '4');
              activeLine.setAttribute('stroke-linecap', 'round');
              const center = getCenter(d);
              activeLine.setAttribute('x1', center.x + '%');
              activeLine.setAttribute('y1', center.y + '%');
              activeLine.setAttribute('x2', center.x + '%');
              activeLine.setAttribute('y2', center.y + '%');
              svg.appendChild(activeLine);
            };
            imgContainer.appendChild(d);
          });

          activity.right.forEach(r => {
            const d = document.createElement('div');
            if (r.cx !== undefined) d.dataset.cx = r.cx;
            if (r.cy !== undefined) d.dataset.cy = r.cy;
            d.style.position = 'absolute'; d.style.left = r.left + '%'; d.style.top = r.top + '%';
            d.style.width = r.width + '%'; d.style.height = r.height + '%';
            d.style.cursor = 'pointer'; d.style.borderRadius = '10px'; d.style.border = '2px solid transparent';

            d.onmouseup = () => {
              if (activeLine && activeStartId) {
                const center = getCenter(d);
                activeLine.setAttribute('x2', center.x + '%');
                activeLine.setAttribute('y2', center.y + '%');
                this.currentActivityState.lines.push({ l: activeStartId, r: r.id, line: activeLine });
                activeLine = null;
                activeStartId = null;
              }
            };
            imgContainer.appendChild(d);
          });

          imgContainer.onmousemove = (e) => {
            if (activeLine) {
              const rect = imgContainer.getBoundingClientRect();
              const x = ((e.clientX - rect.left) / rect.width) * 100;
              const y = ((e.clientY - rect.top) / rect.height) * 100;
              activeLine.setAttribute('x2', x + '%');
              activeLine.setAttribute('y2', y + '%');
            }
          };

          imgContainer.onmouseup = () => {
            if (activeLine) {
              activeLine.remove();
              activeLine = null;
              activeStartId = null;
            }
          };
        }

        if (activity.type === 'sentence') {
          const overlayText = document.createElement('div');
          overlayText.style.position = 'absolute';
          overlayText.style.left = activity.textBox.left + '%';
          overlayText.style.top = activity.textBox.top + '%';
          overlayText.style.width = activity.textBox.width + '%';
          overlayText.style.height = activity.textBox.height + '%';
          overlayText.style.display = 'flex';
          overlayText.style.alignItems = 'center';
          overlayText.style.justifyContent = 'flex-start';
          overlayText.style.whiteSpace = 'nowrap';
          overlayText.style.overflowX = 'auto';
          // Hide scrollbar but keep functionality
          overlayText.style.scrollbarWidth = 'none';
          overlayText.style.msOverflowStyle = 'none';
          overlayText.style.fontSize = '2vw';
          overlayText.style.fontFamily = 'Nunito, sans-serif';
          overlayText.style.color = '#1e3a8a';
          overlayText.style.fontWeight = 'bold';
          overlayText.style.background = 'transparent';
          overlayText.style.borderRadius = '10px';
          // Add padding so it doesn't touch the very edge
          overlayText.style.padding = '0 10px';
          imgContainer.appendChild(overlayText);

          activity.labels.forEach(lbl => {
            const btn = document.createElement('div');
            btn.style.position = 'absolute';
            btn.style.left = lbl.left + '%';
            btn.style.top = lbl.top + '%';

            btn.style.height = lbl.height + '%';

            btn.onclick = () => {
              if (this.currentActivityState.sentence.includes(lbl.text)) {
                this.currentActivityState.sentence = this.currentActivityState.sentence.filter(t => t !== lbl.text);
                btn.style.background = 'transparent';

                btn.style.background = 'rgba(0,0,0,0.1)';

            imgContainer.appendChild(btn);

        wrapper.appendChild(imgContainer);

        var feedbackMsg = document.createElement('div');
        feedbackMsg.id = 'j2-feedback';
        feedbackMsg.style.fontFamily = 'Nunito, sans-serif';

        feedbackMsg.style.fontWeight = 'bold';
        feedbackMsg.style.height = '35px';
        feedbackMsg.style.marginTop = '15px';
        feedbackMsg.style.textShadow = '0 2px 4px rgba(0,0,0,0.8)';
        wrapper.appendChild(feedbackMsg);

        if (activity.valBtnPos) {
          const btnWrapper = document.createElement('div');
          btnWrapper.style.position = 'absolute';
          btnWrapper.style.left = activity.valBtnPos.left + '%';
          btnWrapper.style.top = activity.valBtnPos.top + '%';
          btnWrapper.style.transform = 'translate(-50%, -50%)';
          btnWrapper.style.zIndex = '50';

          const valBtn = document.createElement('img');
          valBtn.id = 'j2-val-btn';
          valBtn.draggable = false;
          valBtn.style.cursor = 'pointer';
          valBtn.style.width = activity.valBtnPos.width ? ('calc(var(--img-width) * ' + (activity.valBtnPos.width / 100) + ')') : 'calc(var(--img-width) * 0.20)';
          valBtn.style.height = 'auto';
          valBtn.style.display = 'block';
          valBtn.style.transition = 'transform 0.15s ease, filter 0.15s ease';

          valBtn.onmouseenter = () => { valBtn.style.transform = 'scale(1.03)'; valBtn.style.filter = 'brightness(1.05)'; };
          valBtn.onmouseleave = () => { valBtn.style.transform = 'scale(1)'; valBtn.style.filter = 'brightness(1)'; };

          valBtn.onclick = () => {
            if (valBtn.getAttribute('data-action') === 'next') {
              this.handleJourney2Next();
            } else if (activity.needsValidation) {
              this.validateJourney2Activity(activity);
            }
          };

          btnWrapper.appendChild(valBtn);
          imgContainer.appendChild(btnWrapper);

          if (activity.needsValidation) {
            valBtn.src = 'journe 1/valider.png'; // reuse asset
            valBtn.setAttribute('data-action', 'validate');

            valBtn.setAttribute('data-action', 'next');

        // --- JOURNEY 2 NAVIGATION BUTTONS: BACK (TOP-LEFT) & HOME (TOP-RIGHT) ---
        const navBackPos = (activity.navPos && activity.navPos.back) || { top: '3%', left: '3%' };
        const navHomePos = (activity.navPos && activity.navPos.home) || { top: '3%', right: '3%' };

        const btnBack = document.createElement('img');

        btnBack.onmouseenter = () => { btnBack.style.transform = (navBackPos.transform ? navBackPos.transform + ' ' : '') + 'scale(1.1) translateY(-2px)'; btnBack.style.filter = 'drop-shadow(0 6px 12px rgba(0,0,0,0.45))'; };

        btnHome.style.width = navHomePos.width || 'clamp(44px, 5.2vw, 68px)';
        btnHome.style.height = navHomePos.height || 'clamp(44px, 5.2vw, 68px)';

        btnHome.onmouseenter = () => { btnHome.style.transform = (navHomePos.transform ? navHomePos.transform + ' ' : '') + 'scale(1.1) translateY(-2px)'; btnHome.style.filter = 'drop-shadow(0 6px 12px rgba(0,0,0,0.45))'; };
        btnHome.onmouseleave = () => { btnHome.style.transform = navHomePos.transform || 'scale(1)'; btnHome.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,0.35))'; };
        btnHome.onmousedown = () => { btnHome.style.transform = (navHomePos.transform ? navHomePos.transform + ' ' : '') + 'scale(0.95) translateY(1px)'; };
        btnHome.onclick = (e) => {

        requestAnimationFrame(() => {
          wrapper.style.opacity = '1';
          wrapper.style.transform = 'scale(1)';
        });
      },

      validateJourney2Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j2-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'match') {
          let correctPairs = 0;
          let wrongPair = false;
          state.lines.forEach(pair => {
            if (activity.matches[pair.l] === pair.r) correctPairs++;
            else wrongPair = true;
          });
          if (!wrongPair && correctPairs === Object.keys(activity.matches).length) isCorrect = true;
        }
        else if (activity.type === 'sentence') {
          const built = state.sentence.join(' ');
          if (activity.validSentences.includes(built)) {
            isCorrect = true;
          }
        }

              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')

              .replace(/\s+/g, ' ')

          const checkSentence1 = (raw) => {
            const c = cleanStr(raw);
            if (c.length < 8) return false;
            const hasSubject = c.includes('caroline') || c.includes('elle');
            const hasAction = c.includes('joue') || c.includes('jouer') || c.includes('amuse') || c.includes('court') || c.includes('parle');
            const hasContext = c.includes('recreation') || c.includes('cour') || c.includes('camarade') || c.includes('ami') || c.includes('eleve');

            return (hasSubject && (hasAction || hasContext)) || (hasAction && hasContext) || c.includes('pendant la recreation');

          const checkSentence2 = (raw) => {
            const c = cleanStr(raw);
            if (c.length < 8) return false;
            const hasAction = c.includes('parle') || c.includes('rit') || c.includes('amuse') || c.includes('joue') || c.includes('sourit');
            const hasContext = c.includes('camarade') || c.includes('ami') || c.includes('elle') || c.includes('caroline') || c.includes('avec');
            return hasAction && hasContext;
          };

          const s1Ok = checkSentence1(inputs[0] || '');
          const s2Ok = checkSentence2(inputs[1] || '');

          state.writingTrials = (state.writingTrials || 0) + 1;

          if (s1Ok && s2Ok) {
            isCorrect = true;
          } else {
            // Escalate hints based on trials
            const hintEl = document.getElementById('j2-hints-area');
            if (hintEl) {

                `;

          wrapper.appendChild(feedbackMsg);

          if (activity.type === 'drawing' || activity.type === 'mixed') {
            this.currentActivityState.drawings = {};

            const resamplePath = (points, numPoints) => {
              if (points.length === 0) return [];
              if (points.length === 1) return Array(numPoints).fill(points[0]);
              let totalLength = 0;
              for (let i = 1; i < points.length; i++) {
                totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
              }
              const step = totalLength / (numPoints - 1);
              const newPoints = [points[0]];
              let currentD = 0;
              for (let i = 1; i < points.length; i++) {
                let p0 = points[i - 1];
                let p1 = points[i];
                let dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
                while (currentD + dist >= step && newPoints.length < numPoints - 1) {
                  let t = (step - currentD) / dist;
                  let nx = p0.x + t * (p1.x - p0.x);
                  let ny = p0.y + t * (p1.y - p0.y);
                  newPoints.push({ x: nx, y: ny });
                  p0 = { x: nx, y: ny };
                  dist -= (step - currentD);
                  currentD = 0;
                }
                currentD += dist;
              }
              while (newPoints.length < numPoints) newPoints.push(points[points.length - 1]);
              return newPoints;
            };



            activity.boxes.forEach(box => {
              this.currentActivityState.drawings[box.id] = { points: [], passed: false, evalTimeout: null };
              const state = this.currentActivityState.drawings[box.id];

              let ctx = canvas.getContext('2d');

              setTimeout(() => {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#2d3436';
              }, 50);

              const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;
                if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX;
                  clientY = e.touches[0].clientY;
                }
                return {
                  x: clientX - rect.left,
                  y: clientY - rect.top,
                  nx: (clientX - rect.left) / rect.width,
                  ny: (clientY - rect.top) / rect.height
                };
              };

              const redrawStrokes = (color) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (state.points.length === 0) return;
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.moveTo(state.points[0].nx * canvas.width, state.points[0].ny * canvas.height);
                for (let i = 1; i < state.points.length; i++) {
                  // For simplicity in auto-eval, if points jump drastically it might be a new stroke.
                  // But connecting them is fine for the visual feedback of passing.
                  ctx.lineTo(state.points[i].nx * canvas.width, state.points[i].ny * canvas.height);
                }
                ctx.stroke();
              };

              state.evaluate = () => {
                if (state.passed) return true;
                const pts = state.points;
                if (pts.length < 10) return false;

                const N = 30;
                const userResampled = resamplePath(pts, N);
                const expectedResampled = resamplePath(box.expected, N);

                let totalDist = 0;
                for (let i = 0; i < N; i++) {
                  totalDist += Math.hypot(userResampled[i].x - expectedResampled[i].x, userResampled[i].y - expectedResampled[i].y);
                }
                const avgDist = totalDist / N;

                if (avgDist < 0.45) { // Generous tolerance for children
                  state.passed = true;
                  btnClear.style.display = 'none';
                  redrawStrokes('#4ade80');
                  return true;
                }
                return false;
              };

              const startDraw = (e) => {
                if (state.passed) return;
                e.preventDefault();
                isDrawing = true;

                const pos = getPos(e);
                ctx.strokeStyle = '#2d3436';
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                state.points.push({ x: pos.nx, y: pos.ny });
              };

              const moveDraw = (e) => {
                if (!isDrawing || state.passed) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                state.points.push({ x: pos.nx, y: pos.ny });
              };

              const endDraw = (e) => {
                if (isDrawing) {
                  e.preventDefault();
                  isDrawing = false;
                }
              };

              canvas.addEventListener('mousemove', moveDraw);

      validateJourney3Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j3-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice' || activity.type === 'underline') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'match') {
          let correctPairs = 0;
          let wrongPair = false;
          state.lines.forEach(pair => {
            if (activity.matches[pair.l] === pair.r) correctPairs++;
            else wrongPair = true;
          });
          if (!wrongPair && correctPairs === Object.keys(activity.matches).length) isCorrect = true;
        }
        else if (activity.type === 'sentence') {
          const built = state.sentence.join(' ');
          if (activity.validSentences.includes(built)) {
            isCorrect = true;
          }
        }
        else if (activity.type === 'writing') {
          let fail = false;
          activity.inputs.forEach(inp => {
            const val = document.getElementById(inp.id).value.trim();
            if (val.length < 3) fail = true;
          });
          if (!fail) isCorrect = true;
        }
        else if (activity.type === 'drawing') {
          let fail = false;
          let checkAllDone = true;
          activity.boxes.forEach(box => {
            const drawState = this.currentActivityState.drawings[box.id];
            if (drawState.points.length < 10) checkAllDone = false;
            else if (!drawState.evaluate()) fail = true;
          });
          if (checkAllDone && !fail) isCorrect = true;
        }
        else if (activity.type === 'mixed') {
          // 1. Check multiple choice
          let mcFail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) mcFail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (mcFail || validsFound !== totalValids || totalValids === 0) mcFail = true;

          // 2. Check drawing
          let drawFail = false;
          let checkAllDone = true;
          activity.boxes.forEach(box => {
            const drawState = this.currentActivityState.drawings[box.id];
            if (drawState.points.length < 10) {
              checkAllDone = false;
              drawFail = true;
            } else if (!drawState.evaluate()) {
              drawFail = true;
            }
          });

          if (!mcFail && !drawFail && checkAllDone) {
            isCorrect = true;
          }
        }

        if (isCorrect) {
          fb.textContent = "Excellent ! Bonne réponse !";
          fb.style.color = '#4ade80';

          const valBtn = document.getElementById('j3-val-btn');
          if (valBtn) {
            valBtn.src = 'journe 1/continuer.png';
            valBtn.setAttribute('data-action', 'next');
            valBtn.animate([
              { transform: 'scale(0.9)', opacity: 0.5 },
              { transform: 'scale(1.05)', opacity: 1 },
              { transform: 'scale(1)', opacity: 1 }
            ], { duration: 400, easing: 'ease-out' });
          }
        } else {
          fb.textContent = "Oups, ce n'est pas tout à fait ça. Réessaie !";
          fb.style.color = '#f87171';
          if (window.j1GentleShake) window.j1GentleShake(fb);

          if (activity.type === 'match' || activity.type === 'sentence') {
            setTimeout(() => this.loadJourney3Activity(), 1500);
          }
        }
      },
      handleJourney3Next() {
        this.currentExIndex++;
        this.loadJourney3Activity();
      },

      finishJourney3() {
        this.close();
        MapSystem.state.unlockedLevel = window.currentSelectedLevel + 1;
        MapSystem.saveProgress();
        MapSystem.updateVisuals(false);
        const targetLevel = MAP_LEVELS.find(l => l.id === MapSystem.state.unlockedLevel);

          setTimeout(() => {
            MapSystem.updateVisuals(true);

        }
      },

      validateJourney4Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j4-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'fill-connectors') {
          let allFilled = true;
          let allMatch = true;

          activity.slots.forEach(slot => {
            const val = state.slotValues[slot.id];
            if (!val) {
              allFilled = false;
            } else if (val.text !== slot.correctText) {
              allMatch = false;
            }
          });

          if (allFilled && allMatch) {
            isCorrect = true;
          } else {
            // Reset/delete answers in result slots and restore connectors as requested
            setTimeout(() => {
              activity.slots.forEach(slot => {
                const val = state.slotValues[slot.id];
                if (val) {
                  const connEl = state.connectorElements[val.connectorId];
                  if (connEl) {
                    connEl.style.opacity = '1';
                    connEl.style.pointerEvents = 'auto';
                  }
                }
                delete state.slotValues[slot.id];
                const slotEl = state.slotElements[slot.id];
                if (slotEl) {
                  slotEl.textContent = '';
                }
              });
            }, 1200);
          }
        }
        else if (activity.type === 'writing') {
          const inputs = activity.inputs.map(inp => {
            const el = document.getElementById(inp.id);
            return el ? el.value.trim() : '';
          });

          const normalize = (str) => {
            return str
              .toLowerCase()
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/['’]/g, "'")
              .replace(/[^a-z0-9'\s]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          };

          // Semantic flexible validation for each of the 3 sentences
          // 1. D'abord, un élève est dans la classe et prépare ses feuilles.
          const checkSentence1 = (raw) => {
            const c = normalize(raw);
            if (c.length < 8) return false;
            const hasConnector = c.includes('dabord') || c.includes("d'abord") || c.includes('premierement') || c.includes('au debut');
            const hasSubject = c.includes('eleve') || c.includes('garcon') || c.includes('enfant') || c.includes('sami') || c.includes('il');
            const hasActionOrPlace = c.includes('classe') || c.includes('prepare') || c.includes('feuille') || c.includes('bureau') || c.includes('table');
            return hasSubject && (hasConnector || (hasActionOrPlace && c.includes('feuille')));
          };

          // 2. Ensuite, il distribue les feuilles à ses camarades.
          const checkSentence2 = (raw) => {
            const c = normalize(raw);
            if (c.length < 8) return false;
            const hasConnector = c.includes('ensuite') || c.includes('puis') || c.includes('apres');
            const hasAction = c.includes('distribue') || c.includes('donne') || c.includes('partage');
            const hasObjectOrTarget = c.includes('feuille') || c.includes('camarade') || c.includes('ami') || c.includes('eleve');
            return (hasConnector && (hasAction || hasObjectOrTarget)) || (hasAction && hasObjectOrTarget);
          };

          // 3. Enfin, il commence l’activité avec les élèves.
          const checkSentence3 = (raw) => {
            const c = normalize(raw);
            if (c.length < 8) return false;
            const hasConnector = c.includes('enfin') || c.includes('finalement') || c.includes('a la fin');
            const hasAction = c.includes('commence') || c.includes('debut') || c.includes('fait') || c.includes('travaille');
            const hasContext = c.includes('activite') || c.includes('eleve') || c.includes('camarade') || c.includes('dessin') || c.includes('classe');
            return (hasConnector && (hasAction || hasContext)) || (hasAction && hasContext);
          };

          const s1Ok = checkSentence1(inputs[0] || '');
          const s2Ok = checkSentence2(inputs[1] || '');
          const s3Ok = checkSentence3(inputs[2] || '');

          state.writingTrials = (state.writingTrials || 0) + 1;

          if (s1Ok && s2Ok && s3Ok) {
            isCorrect = true;
          } else {
            const hintEl = document.getElementById('j4-hints-area');
            if (hintEl) {
              if (state.writingTrials === 1) {
                hintEl.innerHTML = `
                  <div style="font-size: 0.92em; color: #9a3412; font-weight: 700; margin-bottom: 3px;">
                    💡 Indice : Pense à commencer chaque phrase par un connecteur :
                  </div>
                  <div style="font-size: 0.90em; color: #78350f; line-height: 1.45; font-weight: 600;">
                    • <b style="color: #b45309;">1.</b> D’abord, un élève prépare ses feuilles...<br>
                    • <b style="color: #b45309;">2.</b> Ensuite, il distribue les feuilles...<br>
                    • <b style="color: #b45309;">3.</b> Enfin, il commence l’activité...
                  </div>
                `;
              } else {
                // After 2 trials, show the full model sentences clearly
                hintEl.innerHTML = `
                  <div style="font-size: 0.90em; color: #166534; font-weight: 700; margin-bottom: 2px;">
                    ⭐ Réponses modèles (tu peux t'inspirer ou recopier) :
                  </div>
                  <div style="font-size: 0.88em; color: #14532d; line-height: 1.42; font-weight: 600;">
                    <b style="color: #15803d;">1.</b> D’abord, un élève est dans la classe et prépare ses feuilles.<br>
                    <b style="color: #15803d;">2.</b> Ensuite, il distribue les feuilles à ses camarades.<br>
                    <b style="color: #15803d;">3.</b> Enfin, il commence l’activité avec les élèves.
                  </div>
                `;
              }
              hintEl.animate([{ transform: 'scale(0.98)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
            }
          }
        }

        if (isCorrect) {
          fb.textContent = "Excellent ! Bonne réponse !";
          fb.style.color = '#4ade80';

          const valBtn = document.getElementById('j4-val-btn');
          if (valBtn) {
            valBtn.src = 'journe 1/continuer.png';
            valBtn.setAttribute('data-action', 'next');
            valBtn.animate([
              { transform: 'scale(0.9)', opacity: 0.5 },
              { transform: 'scale(1.05)', opacity: 1 },
              { transform: 'scale(1)', opacity: 1 }
            ], { duration: 400, easing: 'ease-out' });
          }
        } else {
          fb.textContent = "Oups, ce n'est pas tout à fait ça. Réessaie !";
          fb.style.color = '#f87171';
          if (window.j1GentleShake) window.j1GentleShake(fb);
        }
      },

            valBtn.setAttribute('data-action', 'next');
            valBtn.animate([
              { transform: 'scale(0.9)', opacity: 0.5 },
              { transform: 'scale(1.05)', opacity: 1 },
              { transform: 'scale(1)', opacity: 1 }
            ], { duration: 400, easing: 'ease-out' });
          }
        } else {
          fb.textContent = "Oups, ce n'est pas tout à fait ça. Réessaie !";
          fb.style.color = '#f87171';
          if (window.j1GentleShake) window.j1GentleShake(fb);
        }
      },

      handleJourney5Next() {
        this.currentExIndex++;
        this.loadJourney5Activity();
      },

      finishJourney5() {
        this.close();
        MapSystem.state.unlockedLevel = window.currentSelectedLevel + 1;
        MapSystem.saveProgress();
        MapSystem.updateVisuals(false);
        const targetLevel = MAP_LEVELS.find(l => l.id === MapSystem.state.unlockedLevel);
        if (targetLevel) {
          MapCamera.focusOn(targetLevel, 1.8, 2000);
          setTimeout(() => {
            MapSystem.updateVisuals(true);
          }, 2100);
        }
      },

      loadExercise() {
        this.state.isAnswerCorrect = false;
        const btn = document.getElementById('btn-check-answer');
        if (btn) btn.src = 'journe 1/valider.png';
        const ex = this.currentLevelData[this.currentExIndex];
        document.getElementById('exercise-bg').src = ex.bg;

        const progress = ((this.currentExIndex) / this.currentLevelData.length) * 100;
        document.getElementById('exercise-progress-fill').style.width = progress + '%';

        document.getElementById('exercise-feedback').textContent = '';

        const container = document.getElementById('exercise-content-area');
        container.innerHTML = '<div class="exercise-instruction">' + ex.instruction + '</div>';

        if (ex.type === 'select-objects') {
          this.state.selected = new Set();
          const grid = document.createElement('div');
          grid.className = 'obj-grid';
          ex.objects.forEach(obj => {
            const card = document.createElement('div');
            card.className = 'obj-card';
            card.textContent = obj.label;
            card.onclick = () => {
              if (this.state.selected.has(obj.id)) {
                this.state.selected.delete(obj.id);
                card.classList.remove('selected');
              } else {
                this.state.selected.add(obj.id);
                card.classList.add('selected');
              }
            };
            grid.appendChild(card);
          });
          container.appendChild(grid);
        }
        else if (ex.type === 'highlight-words') {
          this.state.selected = new Set();
          const box = document.createElement('div');
          box.className = 'sentence-container';

          const words = ex.sentence.split(' ');
          words.forEach((w, idx) => {
            const span = document.createElement('span');
            span.className = 'word-token';
            span.textContent = w;
            span.onclick = () => {
              if (this.state.selected.has(idx)) {
                this.state.selected.delete(idx);
                span.classList.remove('highlighted');
              } else {
                this.state.selected.add(idx);
                span.classList.add('highlighted');
              }
            };
            box.appendChild(span);
          });
          container.appendChild(box);
        }
        else if (ex.type === 'match-syllables') {
          this.state.leftSel = null;
          this.state.matched = new Set();
          this.state.matchedLines = [];

          const flex = document.createElement('div');
          flex.className = 'match-container';

          const colL = document.createElement('div'); colL.className = 'match-col';
          const colR = document.createElement('div'); colR.className = 'match-col';

          ex.left.forEach(l => {
            const btn = document.createElement('button');
            btn.className = 'syllable-btn left-btn';
            btn.textContent = l;
            btn.id = 'left-' + l;
            btn.onclick = () => {
              if (this.state.matched.has(l)) return;
              document.querySelectorAll('.left-btn').forEach(b => b.classList.remove('selected-left'));
              btn.classList.add('selected-left');
              this.state.leftSel = l;
            };
            colL.appendChild(btn);
          });

          ex.right.forEach(r => {
            const btn = document.createElement('button');
            btn.className = 'syllable-btn right-btn';
            btn.textContent = r;
            btn.id = 'right-' + r;
            btn.onclick = () => {
              if (this.state.matched.has(r)) return;
              if (this.state.leftSel) {
                const l = this.state.leftSel;
                this.state.matchedLines.push({ left: l, right: r });
                this.state.matched.add(l);
                this.state.matched.add(r);
                document.getElementById('left-' + l).classList.add('matched');
                btn.classList.add('matched');
                document.querySelectorAll('.left-btn').forEach(b => b.classList.remove('selected-left'));
                this.state.leftSel = null;
              }
            };
            colR.appendChild(btn);
          });

          flex.appendChild(colL);
          flex.appendChild(colR);
          container.appendChild(flex);
        }
        else if (ex.type === 'build-sentence') {
          this.state.sentence = [];

          const dropzone = document.createElement('div');
          dropzone.className = 'dropzone';

          const pool = document.createElement('div');
          pool.className = 'labels-pool';

          ex.labels.forEach(lbl => {
            const btn = document.createElement('div');
            btn.className = 'word-label in-pool';
            btn.textContent = lbl;

            btn.onclick = () => {
              if (btn.classList.contains('in-pool')) {
                btn.classList.remove('in-pool');
                dropzone.appendChild(btn);
                this.state.sentence.push(lbl);
              } else {
                btn.classList.add('in-pool');
                pool.appendChild(btn);
                this.state.sentence = this.state.sentence.filter(x => x !== lbl);
              }
            };
            pool.appendChild(btn);
          });

          container.appendChild(dropzone);
          container.appendChild(pool);
        }
      },

      checkAnswer() {
        if (this.state.isAnswerCorrect) {
          this.nextExercise();
          return;
        }

        const ex = this.currentLevelData[this.currentExIndex];
        let isCorrect = false;
        const fb = document.getElementById('exercise-feedback');
        fb.textContent = "";

        if (ex.type === 'select-objects') {
          let fail = false;
          let validsFound = 0;
          this.state.selected.forEach(id => {
            const obj = ex.objects.find(o => o.id === id);
            if (!obj.valid) fail = true;
            else validsFound++;
          });

          const totalValids = ex.objects.filter(o => o.valid).length;
          if (!fail && validsFound === totalValids) isCorrect = true;
        }
        else if (ex.type === 'highlight-words') {
          const words = ex.sentence.split(' ');
          let selectedWords = [];
          this.state.selected.forEach(idx => {
            selectedWords.push(words[idx].replace(/[,\.]/g, ''));
          });

          let allValid = true;
          selectedWords.forEach(w => {
            if (!ex.validWords.includes(w)) allValid = false;
          });

          if (allValid && selectedWords.length === ex.validWords.length) isCorrect = true;
        }
        else if (ex.type === 'match-syllables') {
          let correctPairs = 0;
          let wrongPair = false;
          this.state.matchedLines.forEach(pair => {
            if (ex.matches[pair.left] === pair.right) correctPairs++;
            else wrongPair = true;
          });

          if (!wrongPair && correctPairs === Object.keys(ex.matches).length) isCorrect = true;
        }
        else if (ex.type === 'build-sentence') {
          const built = this.state.sentence.join(' ');
          if (ex.validSentences.includes(built)) {
            isCorrect = true;
          }
        }

        if (isCorrect) {
          if (window.SoundSystem) SoundSystem.playSuccess();
          this.state.isAnswerCorrect = true;
          const btn = document.getElementById('btn-check-answer');
          btn.src = 'journe 1/continuer.png';
        } else {
          if (window.SoundSystem) SoundSystem.playIncorrect();
          fb.textContent = "";
          if (ex.type === 'match-syllables') {
            setTimeout(() => this.loadExercise(), 1500);
          }
        }
      },

      nextExercise() {
        this.state.isAnswerCorrect = false;
        this.currentExIndex++;
        const btn = document.getElementById('btn-check-answer');
        btn.style.display = 'block';
        btn.src = 'journe 1/valider.png';
        if (this.currentExIndex >= this.currentLevelData.length) {
          document.getElementById('exercise-progress-fill').style.width = '100%';
          document.getElementById('exercise-content-area').innerHTML = '<div class="exercise-instruction" style="font-size: 50px; color: #FFD700; border-color: #FFD700;">Félicitations ! Tu as gagné des étoiles ! ⭐⭐⭐</div>';
          document.getElementById('exercise-feedback').textContent = "";
          document.getElementById('btn-check-answer').style.display = 'none';

          setTimeout(() => {
            this.close();
            MapSystem.state.unlockedLevel = window.currentSelectedLevel + 1;
            MapSystem.saveProgress();
            MapSystem.updateVisuals(false);
            const targetLevel = MAP_LEVELS.find(l => l.id === MapSystem.state.unlockedLevel);
            if (targetLevel) {
              MapCamera.focusOn(targetLevel, 1.8, 2000);
              setTimeout(() => {
                MapSystem.updateVisuals(true);
              }, 2100);
            }
          }, 3500);
        } else {
          this.loadExercise();
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      MapSystem.init();
    });
  </script>
  <script src="ambient_life.js"></script>
  <script src="sound_system.js"></script>
  <script src="dev_overlay.js"></script>
</body>

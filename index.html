<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royaume des Connaissances</title>
  <meta name="description" content="Royaume des Connaissances – Application éducative interactive." />

  <!-- Premium Friendly & Smooth French Educational Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Quicksand:wght@600;700;800&family=Outfit:wght@600;700;800;900&display=swap"
    rel="stylesheet" />

  <style>
    /* ─── Reset & Base ──────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Nunito', 'Quicksand', 'Outfit', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background: #15457a;
    }

    /* ─── Viewport Stage ────────────────────────────────────────────── */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* ─── Background World & Camera Zoom ────────────────────────────── */
    #initial-bg {
      position: absolute;
      top: -4%;
      left: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 1s ease;
      animation: homeBgSway 32s ease-in-out infinite alternate;
      will-change: transform;
      pointer-events: none;
    }

    @keyframes homeBgSway {
      0% {
        transform: translate3d(2.2%, 0.8%, 0) scale(1.02);
      }
      50% {
        transform: translate3d(-1.8%, -0.6%, 0) scale(1.04);
      }
      100% {
        transform: translate3d(2.2%, 0.8%, 0) scale(1.02);
      }
    }

    #home-ambient-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      transition: opacity 1.2s ease;
    }

    /* Ambient Life canvas (wind gusts, seagulls, sun motes) – driven by ambient_life.js */
    #home-ambient-canvas,
    #map-ambient-canvas,
    .ambient-canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }
    #map-ambient-canvas {
      z-index: 6;
    }

    /* Ocean Surface Sparkles */
    .sea-sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      background: radial-gradient(circle, #ffffff 0%, rgba(186, 230, 253, 0.85) 45%, rgba(255, 255, 255, 0) 75%);
      border-radius: 50%;
      animation: seaTwinkle 4.2s ease-in-out infinite;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95));
    }

    @keyframes seaTwinkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0.2) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.25) rotate(45deg);
      }
    }

    /* Soft Ambient Sunlight Caustics / Subtle Warm Sunbeam */
    .ambient-sun-glow {
      position: absolute;
      top: -10%;
      right: -10%;
      width: 65vw;
      height: 65vh;
      background: radial-gradient(circle at 80% 20%, rgba(254, 243, 199, 0.16) 0%, rgba(254, 215, 170, 0.08) 40%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      animation: sunGlowPulse 8s ease-in-out infinite alternate;
    }

    @keyframes sunGlowPulse {
      0% {
        opacity: 0.65;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    #world-camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transform: scale(1.18);
      transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    #world-camera.camera-zoom-out {
      transform: scale(1.0);
    }

    #map-world-content {
      position: absolute;
      top: -3%;
      left: -3%;
      width: 106%;
      height: 106%;
      animation: mapWorldSway 32s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes mapWorldSway {
      0% {
        transform: translate3d(1.8%, 0.6%, 0) scale(1.015);
      }
      50% {
        transform: translate3d(-1.4%, -0.5%, 0) scale(1.035);
      }
      100% {
        transform: translate3d(1.8%, 0.6%, 0) scale(1.015);
      }
    }

    #bg-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }

    /* ─── Cloud Layer ───────────────────────────────────────────────── */
    #clouds-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .cloud-wrap {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      will-change: transform, opacity;
    }

    .cloud-wrap.entering {
      transition: transform 2.2s cubic-bezier(0.2, 0.9, 0.3, 1),
        opacity 1.8s ease;
    }

    .cloud-wrap.reacting {
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    }

    .cloud-wrap.closing {
      transition: transform 2s cubic-bezier(0.65, 0, 0.15, 1) !important;
    }

    .cloud-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      /* Super soft edges for clouds to blend perfectly */
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    }

    /* To avoid hard masking on purely pure clouds, we only apply a very subtle mask or skip it for large pieces */
    .pure-edge {
      mask-image: none !important;
      -webkit-mask-image: none !important;
    }

    /* ─── Cloud Final Resting Positions (Massively dense coverage) ─── */
    /* LEFT SIDE */
    #cw-left-1 {
      /* Main TL Corner */
      top: -15%;
      left: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 25;
    }

    #cw-left-2 {
      /* Mid Left fill - shifted further left to hide cut edge */
      top: 25%;
      left: -20%;
      width: clamp(400px, 50vw, 750px);
      z-index: 24;
    }

    #cw-left-3 {
      /* Bottom Left Corner */
      bottom: -15%;
      left: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 26;
    }

    #cw-left-4 {
      /* Extra left edge density using pure cloud to cover gap */
      top: 40%;
      left: -18%;
      width: clamp(350px, 45vw, 650px);
      z-index: 22;
      transform-origin: center left;
    }

    /* RIGHT SIDE */
    #cw-right-1 {
      /* Main TR Corner */
      top: -15%;
      right: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 25;
    }

    #cw-right-2 {
      /* Mid Right fill */
      top: 20%;
      right: -15%;
      width: clamp(350px, 45vw, 650px);
      z-index: 24;
    }

    #cw-right-3 {
      /* Bottom Right Corner */
      bottom: -15%;
      right: -15%;
      width: clamp(400px, 60vw, 900px);
      z-index: 26;
    }

    #cw-right-4 {
      /* Extra right edge density */
      top: 45%;
      right: -20%;
      width: clamp(400px, 50vw, 700px);
      z-index: 22;
      transform-origin: center right;
    }

    /* TOP & BOTTOM FILL */
    #cw-top-fill {
      top: -6%;
      left: 18%;
      width: clamp(500px, 64vw, 960px);
      z-index: 24;
    }

    #cw-bottom-fill {
      bottom: -15%;
      left: 10%;
      width: clamp(500px, 80vw, 1200px);
      z-index: 24;
    }

    /* ─── Constant Idle Floating ─────────────────────────────────────── */
    @keyframes floatVertical {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(15px);
      }
    }

    @keyframes floatVerticalRev {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-15px);
      }
    }

    @keyframes floatHorizontal {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(12px);
      }
    }

    @keyframes floatHorizontalRev {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-12px);
      }
    }

    .f-v1 {
      animation: floatVertical 4s ease-in-out infinite alternate;
    }

    .f-v2 {
      animation: floatVerticalRev 4.5s ease-in-out infinite alternate;
    }

    .f-h1 {
      animation: floatHorizontal 3.8s ease-in-out infinite alternate;
    }

    .f-h2 {
      animation: floatHorizontalRev 4.2s ease-in-out infinite alternate;
    }

    /* ─── UI Layer ─────────────────────────────────────────────────── */
    #ui-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 2.5vh;
      pointer-events: none;
      z-index: 60;
    }

    #logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 1vh;
      margin-bottom: 1.5vh;
      pointer-events: auto;
      z-index: 65;
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    #logo-img {
      width: clamp(290px, 33vw, 520px);
      height: auto;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
      display: block;
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    #buttons-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4vh;
      pointer-events: auto;
      z-index: 70;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #buttons-group.fade-out {
      opacity: 0;
      transform: scale(0.86) translateY(18px);
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s 0.4s;
    }

    #btn-commencer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(280px, 21vw, 350px);
      height: clamp(64px, 4.8vw, 76px);
      border-radius: 9999px;
      cursor: pointer;
      border: 3.5px solid #ffffff;
      outline: none;
      background: linear-gradient(180deg, #65cb2a 0%, #52b61f 38%, #3fa116 70%, #2d7a0e 100%);
      box-shadow: 0 0 0 2.5px #1f5209, 0 7px 0 #184406, 0 12px 24px rgba(0, 0, 0, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.7), inset 0 -2px 5px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-commencer:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 2.5px #1f5209, 0 9px 0 #184406, 0 15px 28px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.8), inset 0 -2px 5px rgba(0, 0, 0, 0.3);
    }

    #btn-commencer:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 2.5px #1f5209, 0 3px 0 #184406, 0 6px 14px rgba(0, 0, 0, 0.35), inset 0 1px 3px rgba(255, 255, 255, 0.5), inset 0 -1px 3px rgba(0, 0, 0, 0.25);
    }

    #btn-commencer::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 10%;
      width: 80%;
      height: 42%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    #btn-commencer span.btn-label {
      position: relative;
      z-index: 5;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(26px, 2vw, 34px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2.5px 0 #1b4b08, 0 4px 10px rgba(0, 0, 0, 0.35);
      padding-top: 1px;
    }

    #btn-google {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: clamp(260px, 19vw, 315px);
      height: clamp(52px, 3.8vw, 60px);
      border-radius: 9999px;
      cursor: pointer;
      background: #ffffff;
      border: 1.8px solid #2d3b48;
      box-shadow: 0 3px 0 rgba(40, 55, 70, 0.15), 0 8px 20px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 rgba(40, 55, 70, 0.15), 0 12px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    #btn-google:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(40, 55, 70, 0.15), 0 4px 10px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .google-icon {
      width: clamp(22px, 1.6vw, 26px);
      height: clamp(22px, 1.6vw, 26px);
      flex-shrink: 0;
    }

    .google-btn-text {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(15.5px, 1.15vw, 19px);
      font-weight: 800;
      color: #1a394d;
      white-space: nowrap;
    }

    /* ─── Skip Intro Button ───────────────────────────────────────── */
    #btn-skip-intro {
      position: absolute;
      top: 24px;
      right: 28px;
      width: clamp(56px, 5.5vw, 76px);
      height: clamp(56px, 5.5vw, 76px);
      z-index: 95;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      outline: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, opacity 0.4s ease;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btn-skip-intro.visible {
      display: flex;
    }

    #btn-skip-intro:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
    }

    #btn-skip-intro:active {
      transform: scale(0.95) translateY(1px);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }

    #btn-skip-intro img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* ─── Fneck Guide Layer ─────────────────────────────────────────── */
    #fneck-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    #fneck-guide {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.4));
      opacity: 0;
      display: none;
    }

    #fneck-guide.visible {
      display: block;
    }

    .fneck-image {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }

    /* Centered Text Overlay */
    .fneck-bubble-overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      pointer-events: none;
      box-sizing: border-box;
      padding: 5% 6%;
      /* Visual debugging can be removed later */
      /* border: 1px solid rgba(255,0,0,0.3); */
    }

    .fneck-dialogue-content {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      font-size: clamp(11px, 1.15vw, 16px);
      font-weight: 700;
      color: #2b1707;
      line-height: 1.3;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: opacity 0.3s ease;
      width: 100%;
      word-break: break-word;
    }

    #interactive-tap-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 75;
      cursor: pointer;
      display: none;
    }

    #interactive-tap-stage.active {
      display: block;
    }

    #btn-adventure-start {
      position: relative;
      margin-top: 8px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 8px 22px;
      border-radius: 9999px;
      cursor: pointer;
      pointer-events: auto;
      border: 2.5px solid #ffffff;
      outline: none;
      background: linear-gradient(180deg, #65cb2a 0%, #52b61f 38%, #3fa116 70%, #2d7a0e 100%);
      box-shadow: 0 0 0 2px #1f5209, 0 4px 0 #184406, 0 7px 14px rgba(0, 0, 0, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.55), inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      font-family: 'Nunito', sans-serif;
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 0 #1b4b08, 0 3px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btn-adventure-start::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      width: 80%;
      height: 45%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    @keyframes bounceArrow {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .arrow-anim {
      animation: bounceArrow 1.5s infinite ease-in-out;
    }

    .pulse-marker {
      animation: pulseMarker 1.5s infinite;
      transform-origin: center;
    }

    @keyframes pulseMarker {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.3);
        opacity: 0.5;
      }
    }

    .clash-arrow-anim {
      animation: clashBounce 1.3s infinite;
      transform-origin: 0px 0px;
    }

    @keyframes clashBounce {
      0% {
        transform: translateY(-60px) scale(1, 1);
        animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
      }

      40% {
        transform: translateY(-5px) scale(1, 1);
        animation-timing-function: linear;
      }

      45% {
        transform: translateY(0px) scale(1.3, 0.6);
        animation-timing-function: linear;
      }

      50% {
        transform: translateY(-5px) scale(0.85, 1.15);
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      100% {
        transform: translateY(-60px) scale(1, 1);
      }
    }

    /* POPUP STYLES */
    #level-popup-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #level-popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .level-popup-container {
      position: relative;
      width: 50vw;
      max-width: 700px;
      min-width: 350px;
      transform: scale(0.5);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #level-popup-overlay.active .level-popup-container {
      transform: scale(1);
    }

    .level-popup-bg {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .popup-bubble-text {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      color: #63432a;
      line-height: 1.2;
    }

    .popup-title {
      position: absolute;
      text-align: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      color: white;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .popup-description {
      position: absolute;
      text-align: left;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: #4a2511;
      line-height: 1.2;
    }

    .popup-reward-text {
      position: absolute;
      text-align: left;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      color: #6a1a41;
      line-height: 1.1;
    }

    .popup-commencer-btn {
      position: absolute;
      cursor: pointer;
      border-radius: 50px;
      transition: transform 0.1s;
    }

    .popup-commencer-btn:active {
      transform: scale(0.95);
    }

    .popup-close-btn {
      position: absolute;
      top: -15px;
      right: -15px;
      width: 45px;
      height: 45px;
      background: #ff4757;
      color: white;
      border: 3px solid white;
      border-radius: 50%;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .popup-close-btn:hover {
      transform: scale(1.1);
    }

    /* ─── EXERCISE STAGE ─── */
    #exercise-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      z-index: 200;
      display: none;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #exercise-stage.active {
      display: flex;
      opacity: 1;
    }

    #exercise-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    #exercise-header {
      position: relative;
      z-index: 10;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
    }

    .progress-bar-container {
      width: 40%;
      height: 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    #exercise-progress-fill {
      height: 100%;
      width: 0%;
      background: #FFD700;
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    #btn-close-exercise {
      background: rgba(255, 50, 50, 0.8);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    #exercise-content-area {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .exercise-instruction {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(24px, 3vw, 40px);
      color: white;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
      margin-bottom: 40px;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 30px;
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
    }

    #exercise-footer {
      position: relative;
      z-index: 10;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);

    #exercise-feedback {
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      font-weight: bold;
      height: 35px;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .feedback-success {
      color: #4ade80;
    }

    .feedback-error {
      color: #f87171;
    }

    #btn-check-answer {
      width: clamp(200px, 20vw, 300px);
      height: auto;
      cursor: pointer;
      transition: transform 0.1s;
      display: block;
      margin: 0 auto;
    }

    #btn-check-answer:active {
      transform: scale(0.95);
    }

    /* Ex1: Select Objects */
    .obj-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 800px;
    }

    .obj-card {
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #ccc;
      border-radius: 15px;
      padding: 20px 30px;
      font-family: 'Quicksand', sans-serif;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      color: #333;
    }

    .obj-card.selected {
      border-color: #3fa116;
      background: #e6ffed;
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(63, 161, 22, 0.4);
    }

    /* Ex2: Highlight Words */
    .sentence-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      line-height: 2;
    }

    .word-token {
      font-family: 'Nunito', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #222;
      padding: 5px 10px;
      margin: 0 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .word-token.highlighted {
      background: #ffeaa7;
      color: #d63031;
    }

    /* Ex3: Match Syllables */
    .match-container {
      display: flex;
      gap: 60px;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .syllable-btn {
      background: white;
      border: 3px solid #0984e3;
      border-radius: 12px;
      padding: 15px 30px;
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      color: #0984e3;
      transition: all 0.2s;
    }

    .syllable-btn.selected-left {
      background: #0984e3;
      color: white;
      transform: scale(1.05);
    }

    .syllable-btn.selected-right {
      background: #d63031;
      border-color: #d63031;
      color: white;
      transform: scale(1.05);
    }

    .syllable-btn.matched {
      background: #00b894;
      border-color: #00b894;
      color: white;
      cursor: default;
      opacity: 0.8;
    }

    /* Ex4: Build Sentence */
    .dropzone {
      min-height: 80px;
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.5);
      border: 3px dashed rgba(255, 255, 255, 0.5);
      border-radius: 15px;
      margin-bottom: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 15px;
      align-items: center;
      justify-content: flex-start;
    }

    .labels-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      max-width: 900px;
    }

    .word-label {
      background: white;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      color: #333;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .word-label.in-pool:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

    let currentSceneIndex = -1;
    let isTransitioning = false;

    const btnCommencer = document.getElementById('btn-commencer');
    const buttonsGroup = document.getElementById('buttons-group');
    const worldCamera = document.getElementById('world-camera');
    const cloudsLayer = document.getElementById('clouds-layer');
    const tapStage = document.getElementById('interactive-tap-stage');
    const btnAdventureStart = document.getElementById('btn-adventure-start');
    const fneckGuide = document.getElementById('fneck-guide');
    const fneckImg = document.getElementById('fneck-img');
    const fneckBubbleText = document.getElementById('fneck-bubble-text');
    const fneckDialogue = document.getElementById('fneck-dialogue');

    /* ─── CLOUD ENTRANCE ORCHESTRATOR ─── */
    function startCloudEntrance() {
      const wraps = document.querySelectorAll('.cloud-wrap');
      wraps.forEach(wrap => {
        const startTransform = wrap.getAttribute('data-start');
        const delayMs = parseInt(wrap.getAttribute('data-delay'), 10);

        wrap.style.transform = startTransform;
        wrap.style.opacity = '0';

        setTimeout(() => {
          wrap.classList.add('entering');
          void wrap.offsetWidth;
          wrap.style.transform = 'translate(0, 0)';
          wrap.style.opacity = '1';
        }, delayMs);
      });
    }

    function reactClouds() {
      const wraps = document.querySelectorAll('.cloud-wrap.entering');
      wraps.forEach(wrap => {
        const dx = (Math.random() - 0.5) * 12;
        const dy = (Math.random() - 0.5) * 10;
        wrap.classList.add('reacting');
        wrap.style.transform = `translate(${dx}px, ${dy}px)`;
        setTimeout(() => {
          wrap.style.transform = 'translate(0, 0)';
          setTimeout(() => wrap.classList.remove('reacting'), 1000);
        }, 450);
      });
    }

    /* ─── FNECK ANIMATION ─── */
    function positionFneck(scene) {
      fneckGuide.style.top = scene.containerPos.top;
      fneckGuide.style.right = scene.containerPos.right;
      fneckGuide.style.bottom = scene.containerPos.bottom;
      fneckGuide.style.left = scene.containerPos.left;
      fneckGuide.style.width = scene.containerSize;

      fneckBubbleText.style.top = scene.bubbleArea.top;
      fneckBubbleText.style.left = scene.bubbleArea.left;
      fneckBubbleText.style.width = scene.bubbleArea.width;
      fneckBubbleText.style.height = scene.bubbleArea.height;
    }

    function showFneckScene(index) {
      const scene = SCENES[index];
      currentSceneIndex = index;
      fneckImg.src = scene.asset;

      // We wait for the image to load to ensure bounding boxes are correct
      fneckImg.onload = () => {
        fneckGuide.style.transition = 'none';
        positionFneck(scene);
        fneckGuide.style.transform = scene.enterFrom;
        fneckGuide.style.opacity = '0';
        fneckGuide.style.pointerEvents = 'none';
        fneckGuide.classList.add('visible');
        void fneckGuide.offsetWidth;

        fneckGuide.style.transition = 'transform 0.75s cubic-bezier(0.34, 1.35, 0.64, 1), opacity 0.5s ease';
        void fneckGuide.offsetWidth;
        fneckGuide.style.transform = scene.enterTo;
        fneckGuide.style.opacity = '1';

        fneckDialogue.style.opacity = '0';
        setTimeout(() => {
          fneckDialogue.textContent = scene.text;
          fneckDialogue.style.opacity = '1';
          if (scene.isFinal) {
            btnAdventureStart.style.display = 'inline-flex';
            tapStage.style.display = 'none'; // Hide the invisible overlay so the button can be clicked!
          } else {
            btnAdventureStart.style.display = 'none';
          }
        }, 350);
      };
    }

    function hideFneck(callback) {
      if (currentSceneIndex < 0 || currentSceneIndex >= SCENES.length) {
        if (callback) callback();
        return;
      }
      const scene = SCENES[currentSceneIndex];
      fneckGuide.style.transition = 'transform 0.6s cubic-bezier(0.55, 0, 0.68, 0.53), opacity 0.45s ease';
      fneckGuide.style.transform = scene.exitTo;
      fneckGuide.style.opacity = '0';
      fneckGuide.style.pointerEvents = 'none';
      setTimeout(() => {
        fneckGuide.classList.remove('visible');
        fneckDialogue.textContent = '';
        btnAdventureStart.style.display = 'none';
        if (callback) callback();
      }, 650);
    }

    function advanceToScene(index) {
      if (isTransitioning) return;
      isTransitioning = true;
      // reactClouds(); // Removed per user feedback to rely only on constant floating
      if (currentSceneIndex >= 0) {
        hideFneck(() => {
          setTimeout(() => {
            showFneckScene(index);
            isTransitioning = false;
          }, 380);
        });
      } else {
        showFneckScene(index);
        isTransitioning = false;
      }
    }

    const btnSkipIntro = document.getElementById('btn-skip-intro');

    function skipToMap() {
      // Hide skip button
      if (btnSkipIntro) {
        btnSkipIntro.classList.remove('visible');
        btnSkipIntro.style.display = 'none';
      }

      // Hide fneck & dialog
      if (fneckGuide) {
        fneckGuide.style.transition = 'opacity 0.3s ease';
        fneckGuide.style.opacity = '0';
        fneckGuide.style.pointerEvents = 'none';
        setTimeout(() => {
          fneckGuide.classList.remove('visible');
          fneckGuide.style.display = 'none';
        }, 300);
      }
      if (btnAdventureStart) btnAdventureStart.style.display = 'none';
      if (tapStage) {
        tapStage.classList.remove('active');
        tapStage.style.display = 'none';
      }

      // Hide start screen UI
      if (buttonsGroup) buttonsGroup.classList.add('fade-out');

      // Instantly or swiftly clean up clouds layer
      const cloudLayer = document.getElementById('clouds-layer');
      if (cloudLayer) {
        cloudLayer.style.transition = 'opacity 0.4s ease';
        cloudLayer.style.opacity = '0';
        setTimeout(() => {
          cloudLayer.style.display = 'none';
        }, 400);
      }

      const logo = document.getElementById('logo-container');
      if (logo) {
        logo.style.transition = 'opacity 0.4s ease';
        logo.style.opacity = '0';
        setTimeout(() => {
          logo.style.display = 'none';
        }, 400);
      }

      const initialBg = document.getElementById('initial-bg');
      if (initialBg) {
        initialBg.style.transition = 'opacity 0.4s ease';
        initialBg.style.opacity = '0';
        setTimeout(() => {
          initialBg.style.display = 'none';
        }, 400);
      }

      const homeAmbient = document.getElementById('home-ambient-layer');
      if (homeAmbient) {
        homeAmbient.style.transition = 'opacity 0.6s ease';
        homeAmbient.style.opacity = '0';
        setTimeout(() => {
          homeAmbient.style.display = 'none';
        }, 600);
      }

      // Bring up world camera and map interaction
      if (worldCamera) {
        worldCamera.classList.add('camera-zoom-out');
        worldCamera.style.opacity = '1';
        worldCamera.style.pointerEvents = 'auto';
      }

      const mapLayer = document.getElementById('map-interaction-layer');
      if (mapLayer) mapLayer.style.opacity = '1';

      // Start dramatic zoom and display arrow so the player can click activities immediately
      MapSystem.startAdventureDramaticZoom();
    }

    if (btnSkipIntro) {
      btnSkipIntro.addEventListener('click', (e) => {
        e.stopPropagation();
        skipToMap();
      });
    }

    /* ─── EVENTS ─── */
    btnCommencer.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isTransitioning) return;
      isTransitioning = true;
      buttonsGroup.classList.add('fade-out');
      worldCamera.classList.add('camera-zoom-out');
      if (btnSkipIntro) {
        btnSkipIntro.classList.add('visible');
      }
      startCloudEntrance();
      setTimeout(() => {
        showFneckScene(0);
        tapStage.classList.add('active');
        isTransitioning = false;
      }, 2300);
    });

    tapStage.addEventListener('click', () => {
      if (isTransitioning) return;
      if (currentSceneIndex >= SCENES.length - 1) return;
      advanceToScene(currentSceneIndex + 1);
    });

    fneckGuide.addEventListener('click', (e) => {
      if (e.target === btnAdventureStart) return;
      if (isTransitioning) return;
      if (currentSceneIndex < SCENES.length - 1) {
        advanceToScene(currentSceneIndex + 1);
      }
    });

    btnAdventureStart.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btnSkipIntro) {
        btnSkipIntro.classList.remove('visible');
        btnSkipIntro.style.display = 'none';
      }
      fneckDialogue.textContent = "C'est parti pour la grande aventure !";
      btnAdventureStart.style.display = 'none';

      // Fade out fneck
      fneckGuide.style.transition = 'opacity 0.8s ease';
      fneckGuide.style.opacity = '0';
      fneckGuide.style.pointerEvents = 'none';

      // 1. Gently expand the edge clouds so their straight cuts never show!
      const cloudLayer = document.getElementById('clouds-layer');
      const wraps = document.querySelectorAll('.cloud-wrap');

      wraps.forEach(wrap => {
        wrap.classList.add('closing');
        // Force the browser to register the transition class before applying transform
        void wrap.offsetWidth;

        // Very subtle movement so flat edges stay completely hidden off-screen
        if (wrap.id.includes('left')) {
          wrap.style.transform = 'translate(10vw, 0) scale(1.35)';
        } else if (wrap.id.includes('right')) {
          wrap.style.transform = 'translate(-10vw, 0) scale(1.35)';
        } else if (wrap.id.includes('bottom')) {
          wrap.style.transform = 'translate(0, -15vh) scale(1.35)';
        } else if (wrap.id.includes('top')) {
          wrap.style.transform = 'translate(0, 15vh) scale(1.35)';
        }
      });

      // 2. Spawn perfectly fluid, organic clouds to rush the absolute center!
      const fluidAssets = [
        { src: 'clean_clouds/cloud_c_32_x360_y608.png', start: 'translate(-100vw, 10vh)', end: 'translate(-15vw, 0) scale(1.8)' },
        { src: 'clean_clouds/cloud_c_21_x0_y381.png', start: 'translate(100vw, -10vh)', end: 'translate(15vw, 0) scale(1.8)' },
        { src: 'clean_clouds/cloud_c_2_x463_y0.png', start: 'translate(-10vw, -100vh)', end: 'translate(0, -15vh) scale(1.8)' },
        { src: 'clean_clouds/cloud_c_32_x360_y608.png', start: 'translate(10vw, 100vh)', end: 'translate(0, 15vh) scale(1.8)' }
      ];

      fluidAssets.forEach(data => {
        const fluidCloud = document.createElement('div');
        fluidCloud.className = 'cloud-wrap';
        fluidCloud.style.top = '50%';
        fluidCloud.style.left = '50%';
        fluidCloud.style.width = 'clamp(500px, 60vw, 1000px)';
        fluidCloud.style.marginLeft = 'calc(-1 * clamp(250px, 30vw, 500px))';
        fluidCloud.style.marginTop = '-30vh';

        fluidCloud.style.transition = 'none';
        fluidCloud.style.transform = data.start;
        fluidCloud.style.zIndex = '35';

        const img = document.createElement('img');
        img.className = 'cloud-img pure-edge';
        img.src = data.src;
        img.draggable = false;

        fluidCloud.appendChild(img);
        cloudLayer.appendChild(fluidCloud);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            fluidCloud.style.transition = 'transform 1.8s cubic-bezier(0.65, 0, 0.15, 1)';
            fluidCloud.style.transform = data.end;
          });
        });
      });

      // Keep the map hidden/covered for a short moment, then reveal it smoothly
      setTimeout(() => {
        const cloudLayer = document.getElementById('clouds-layer');
        cloudLayer.style.transition = 'opacity 1.5s ease';
        cloudLayer.style.opacity = '0';

        // Also fade out the logo!
        const logo = document.getElementById('logo-container');
        if (logo) {
          logo.style.transition = 'opacity 1.5s ease';
          logo.style.opacity = '0';
        }

        // Fade out the initial background and reveal the map
        const initialBg = document.getElementById('initial-bg');
        if (initialBg) {
          initialBg.style.opacity = '0';
        }
        const homeAmbient = document.getElementById('home-ambient-layer');
        if (homeAmbient) {
          homeAmbient.style.transition = 'opacity 1.0s ease';
          homeAmbient.style.opacity = '0';
        }
        const worldCamera = document.getElementById('world-camera');
        worldCamera.style.opacity = '1';
        worldCamera.style.pointerEvents = 'auto';

        // Show the interactive SVG layer (overlays and hitboxes)
        document.getElementById('map-interaction-layer').style.opacity = '1';

        // Start the dramatic zoom as the clouds fade out!
        MapSystem.startAdventureDramaticZoom();

        // Wait for the clouds to completely fade out before cleaning up
        setTimeout(() => {
          cloudLayer.style.display = 'none';
          if (logo) logo.style.display = 'none';
          if (initialBg) initialBg.style.display = 'none';
          if (homeAmbient) homeAmbient.style.display = 'none';
        }, 1500);
      }, 2200);
    });

    /* ═══════════════════════════════════════════════════════════════════
       MAP PROGRESSION & CAMERA SYSTEM
       ═══════════════════════════════════════════════════════════════════ */
    const MAP_LEVELS = [
      { id: 1, name: null, x: 1687, y: 82, w: 333, h: 218 }, // Tunis (Level 1 / Journey 1)
      { id: 2, name: 'Layer_13', x: 1466, y: 230, w: 226, h: 145 }, // Level 2 / Journey 2 (Layer 13)
      { id: 3, name: 'Layer_1', x: 1412, y: 401, w: 253, h: 160 }, // Level 3 / Journey 3 (Layer 1)
      { id: 4, name: 'Layer_2', x: 1682, y: 455, w: 180, h: 140 }, // Level 4 / Journey 4 (Layer 2)
      { id: 5, name: 'Layer_4', x: 1389, y: 615, w: 288, h: 119 }, // Level 5 / Journey 5 (Layer 4)
      { id: 6, name: 'Layer_3', x: 1756, y: 556, w: 278, h: 137 }, // Level 6 / Journey 6 (Layer 3)
      { id: 7, name: 'Layer_5', x: 1312, y: 758, w: 331, h: 207 }, // Level 7 / Journey 7 (Layer 5)
      { id: 8, name: 'Layer_6', x: 1528, y: 961, w: 211, h: 125 }, // Level 8 / Journey 8 (Layer 6)
      // Closed / Unused layers (Fog overlay stays permanently on, hitboxes disabled)
      { id: 9, name: 'Layer_11', x: 2120, y: 1271, w: 163, h: 226 },
      { id: 10, name: 'Layer_7', x: 1937, y: 906, w: 251, h: 166 },
      { id: 11, name: 'Layer_8', x: 1605, y: 1226, w: 213, h: 120 },
      { id: 12, name: 'Layer_9', x: 1828, y: 1124, w: 315, h: 165 },
      { id: 13, name: 'Layer_10', x: 2118, y: 1148, w: 140, h: 81 },
      { id: 14, name: 'Layer_12', x: 2014, y: 1505, w: 144, h: 150 }
    ];

    const MapCamera = {
      scale: 1,
      x: 0,
      y: 0,
      isDragging: false,
      startX: 0,
      startY: 0,
      initialX: 0,
      initialY: 0,
      el: null,

      init() {
        this.el = document.getElementById('world-camera');
        const stage = document.getElementById('game-stage');

        this.el.style.transformOrigin = '0 0';

        stage.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.zoom(e.clientX, e.clientY, -Math.sign(e.deltaY) * 0.2 * this.scale);
        }, { passive: false });

        stage.addEventListener('mousedown', (e) => {
          this.isDragging = true;
          this.startX = e.clientX;
          this.startY = e.clientY;
          this.initialX = this.x;
          this.initialY = this.y;
          this.el.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          const dx = e.clientX - this.startX;
          const dy = e.clientY - this.startY;
          this.x = this.initialX + dx;
          this.y = this.initialY + dy;
          this.clamp();
          this.update();
        });

        window.addEventListener('mouseup', () => {
          this.isDragging = false;
        });

        // Touch events
        stage.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.isDragging = true;
            this.startX = e.touches[0].clientX;
            this.startY = e.touches[0].clientY;
            this.initialX = this.x;
            this.initialY = this.y;
            this.el.style.transition = 'none';
          }
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
          if (!this.isDragging) return;
          const dx = e.touches[0].clientX - this.startX;
          const dy = e.touches[0].clientY - this.startY;
          this.x = this.initialX + dx;
          this.y = this.initialY + dy;
          this.clamp();
          this.update();
        }, { passive: false });
        window.addEventListener('touchend', () => {
          this.isDragging = false;
        });
      },

      getScreenCoords(percentX, percentY) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const imgA = 3436 / 1832;
        const winA = w / h;

        let screenX, screenY;

        if (winA > imgA) {
          const scale = w / 3436;
          const scaledH = 1832 * scale;
          const topEdge = (h - scaledH) / 2;
          screenX = (percentX / 100) * w;
          screenY = topEdge + (percentY / 100) * scaledH;
        } else {
          const scale = h / 1832;
          const scaledW = 3436 * scale;
          const leftEdge = (w - scaledW) / 2;
          screenX = leftEdge + (percentX / 100) * scaledW;
          screenY = (percentY / 100) * h;
        }

        return { x: screenX, y: screenY };
      },

      zoom(px, py, delta) {
        this.el.style.transition = 'none';
        const xs = (px - this.x) / this.scale;
        const ys = (py - this.y) / this.scale;

        this.scale = Math.max(1, Math.min(4, this.scale + delta));

        this.x = px - xs * this.scale;
        this.y = py - ys * this.scale;

        this.clamp();
        this.update();
      },

      focusOn(level, zoomLevel, durationMs = 2500) {
        this.el.style.transition = "transform " + durationMs + "ms cubic-bezier(0.25, 1, 0.5, 1)";
        this.scale = zoomLevel;

        const percentX = ((level.x + (level.w / 2)) / 3436) * 100;
        const percentY = ((level.y + (level.h / 2)) / 1832) * 100;
        const coords = this.getScreenCoords(percentX, percentY);

        const w = window.innerWidth;
        const h = window.innerHeight;

        this.x = (w / 2) - (coords.x * this.scale);
        this.y = (h / 2) - (coords.y * this.scale);

        this.clamp();
        this.update();
      },

      clamp() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const minX = w - w * this.scale;
        const minY = h - h * this.scale;

        this.x = Math.max(minX, Math.min(0, this.x));
        this.y = Math.max(minY, Math.min(0, this.y));
      },

      update() {
        this.el.style.transform = "translate(" + this.x + "px, " + this.y + "px) scale(" + this.scale + ")";
      }
    };

    const MapSystem = {
      state: {
        unlockedLevel: 1,
        introducedLevels: []
      },

      init() {
        this.loadProgress();
        this.renderMap();
        MapCamera.init();

        this.updateVisuals(false);

        // Zoom toward the currently unlocked location
        const targetLevel = MAP_LEVELS.find(l => l.id === this.state.unlockedLevel);
        if (targetLevel) {
          MapCamera.focusOn(targetLevel, 1.8, 2600);
          setTimeout(() => {
            this.updateVisuals(true);
          }, 2700);
        }
      },

      loadProgress() {
        try {
          const saved = localStorage.getItem('tunisiaMapProgress');
          if (saved) {
            const parsed = JSON.parse(saved);
            this.state.unlockedLevel = parsed.unlockedLevel || 1;
            this.state.introducedLevels = parsed.introducedLevels || [];
          } else {
            this.state.unlockedLevel = 1;
          }
        } catch (e) {
          console.error("Could not load progress", e);
        }
      },

      saveProgress() {
        localStorage.setItem('tunisiaMapProgress', JSON.stringify(this.state));
      },

      renderMap() {
        const overlaysGroup = document.getElementById('map-overlays');
        const hitboxesGroup = document.getElementById('map-hitboxes');

        overlaysGroup.innerHTML = '';
        hitboxesGroup.innerHTML = '';

        MAP_LEVELS.forEach(level => {
          if (level.name) {
            const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
            img.setAttribute("id", `overlay-${level.id}`);
            img.setAttribute("href", `map_assets_full/${level.name}.png`);
            img.setAttributeNS("http://www.w3.org/1999/xlink", "href", `map_assets_full/${level.name}.png`);
            img.setAttribute("x", "0");
            img.setAttribute("y", "0");
            img.setAttribute("width", "3436");
            img.setAttribute("height", "1832");
            img.style.pointerEvents = "none";
            img.style.transition = "opacity 0.8s ease";
            overlaysGroup.appendChild(img);
          }

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("id", `hitbox-${level.id}`);
          rect.setAttribute("x", level.x);
          rect.setAttribute("y", level.y);
          rect.setAttribute("width", level.w);
          rect.setAttribute("height", level.h);
          rect.setAttribute("fill", "transparent");

          rect.addEventListener("click", () => this.handleLevelClick(level.id));
          hitboxesGroup.appendChild(rect);
        });
      },

      updateVisuals(showArrow = true) {
        const arrow = document.getElementById('tutorial-arrow');
        let arrowTarget = null;

        MAP_LEVELS.forEach(level => {
          const overlay = document.getElementById("overlay-" + level.id);
          const hitbox = document.getElementById("hitbox-" + level.id);

          const isUnlocked = level.id <= 8 && level.id <= this.state.unlockedLevel;
          const isIntroduced = this.state.introducedLevels.includes(level.id);

          if (overlay) {
            if (isUnlocked) {
              overlay.style.opacity = "0";
            } else {
              overlay.style.opacity = "1";
            }
          }

          if (hitbox) {
            hitbox.style.cursor = isUnlocked ? "pointer" : "not-allowed";
            hitbox.style.pointerEvents = level.id <= 8 ? "auto" : "none";
          }

          if (isUnlocked && !isIntroduced && level.id === this.state.unlockedLevel) {
            arrowTarget = level;
          }
        });

        if (arrowTarget && showArrow) {
          arrow.style.display = "block";
          const arrowX = arrowTarget.x + (arrowTarget.w / 2);
          const arrowY = arrowTarget.y + 40; // Arrow positioned near center
          arrow.setAttribute("transform", "translate(" + arrowX + ", " + arrowY + ")");
        } else {
          arrow.style.display = "none";
        }
      },

      handleLevelClick(levelId) {
        if (levelId > 8 || levelId > this.state.unlockedLevel) {
          return;
        }

        if (!this.state.introducedLevels.includes(levelId)) {
          this.state.introducedLevels.push(levelId);
          this.saveProgress();
          const arrow = document.getElementById('tutorial-arrow');
          if (arrow) arrow.style.display = 'none';
        }

        window.currentSelectedLevel = levelId;
        const popup = document.getElementById('level-popup-overlay');
        const imgEl = popup.querySelector('.level-popup-bg');
        const bubbleText = popup.querySelector('.popup-bubble-text');
        const titleEl = popup.querySelector('.popup-title');
        const descEl = popup.querySelector('.popup-description');
        const btn = popup.querySelector('.popup-commencer-btn');

        if (levelId === 2 || levelId === 3 || levelId === 4 || levelId === 5 || levelId === 6 || levelId === 7 || levelId === 8) {
          if (levelId === 2) {
            imgEl.src = 'journe 2/pop for journe 2.png';
          } else if (levelId === 3) {
            imgEl.src = 'JOURNE 3/pop for jouene 3.png';
          } else if (levelId === 4) {
            imgEl.src = 'journe 4/popup of journe 4.png';
          } else if (levelId === 5) {
            imgEl.src = 'journe 5/first popup.png';
          } else if (levelId === 6) {
            imgEl.src = 'journe 6/first popup.png';
          } else if (levelId === 7) {
            imgEl.src = 'journe 7/first pop up.png';
          } else if (levelId === 8) {
            imgEl.src = 'journe 8/FIRST POPUP.png';
          }
          bubbleText.style.display = 'none';
          titleEl.style.display = 'none';
          descEl.style.display = 'none';

        // --- EXERCISE 3: LINE MATCHING (CONNECT TOP CIRCLES TO BOTTOM CIRCLES) ---
        // --- EXERCISE 3: LINE MATCHING (CONNECT TOP CIRCLES TO BOTTOM CIRCLES) ---
        else if (activity.type === 'j7-line-match') {
          let activeDrag = null; // { startCircle, startType: 'top'|'bottom', currentX, currentY }
          let selectedCircle = null; // for click-to-connect { id, type: 'top'|'bottom' }
          const userMatches = {}; // topId -> bottomId
          let isAnswerCorrect = false;

          // SVG Overlay with viewBox="0 0 100 100" so percentage coordinates map 1:1 precisely!
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 100 100');

          svg.style.height = '100%';
          svg.style.pointerEvents = 'none';
          svg.style.zIndex = '24';
          imgContainer.appendChild(svg);

          const getCircleCenter = (c) => ({
            x: c.left + c.width / 2,
            y: c.top + c.height / 2
          });

          // Distinct lively color palette for each line
          const lineColors = [
            { stroke: '#0284c7', glow: '#38bdf8' },
            { stroke: '#ec4899', glow: '#f472b6' },
            { stroke: '#10b981', glow: '#34d399' }
          ];

          const redrawSVG = () => {
            svg.innerHTML = `
              <defs>
                <filter id="j7-glow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0284c7" flood-opacity="0.6"/>
                </filter>
                <filter id="j7-glow-drag" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.75"/>
                </filter>
              </defs>
            `;

            // Draw established matches with smooth bezier curves
            let pairIdx = 0;
            Object.entries(userMatches).forEach(([topIdStr, botId]) => {
              const topId = Number(topIdStr);
              const topObj = activity.topCircles.find(c => c.id === topId);
              const botObj = activity.bottomCircles.find(c => c.id === botId);
              if (!topObj || !botObj) return;

              const p1 = getCircleCenter(topObj);
              const p2 = getCircleCenter(botObj);
              const color = lineColors[pairIdx % lineColors.length];
              pairIdx++;

              const dy = (p2.y - p1.y) * 0.5;
              const pathD = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y + dy}, ${p2.x} ${p2.y - dy}, ${p2.x} ${p2.y}`;

              const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              path.setAttribute('d', pathD);
              path.setAttribute('fill', 'none');
              path.setAttribute('stroke', color.stroke);
              path.setAttribute('stroke-width', '2.4');
              path.setAttribute('stroke-linecap', 'round');
              path.setAttribute('filter', 'url(#j7-glow)');
              svg.appendChild(path);

              // Endpoint beads
              [p1, p2].forEach(p => {
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', p.x);
                dot.setAttribute('cy', p.y);
                dot.setAttribute('r', '1.6');
                dot.setAttribute('fill', color.stroke);
                dot.setAttribute('stroke', '#ffffff');
                dot.setAttribute('stroke-width', '0.5');
                svg.appendChild(dot);
              });
            });

            // Draw active line being dragged
            if (activeDrag) {
              const p1 = getCircleCenter(activeDrag.startCircle);
              const p2 = { x: activeDrag.currentX, y: activeDrag.currentY };
              const dy = (p2.y - p1.y) * 0.5;
              const pathD = `M ${p1.x} ${p1.y} C ${p1.x} ${p1.y + dy}, ${p2.x} ${p2.y - dy}, ${p2.x} ${p2.y}`;

              const dragPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              dragPath.setAttribute('d', pathD);
              dragPath.setAttribute('fill', 'none');
              dragPath.setAttribute('stroke', '#f59e0b');
              dragPath.setAttribute('stroke-width', '2.6');
              dragPath.setAttribute('stroke-dasharray', '3.5, 2');
              dragPath.setAttribute('stroke-linecap', 'round');
              dragPath.setAttribute('filter', 'url(#j7-glow-drag)');
              svg.appendChild(dragPath);

              const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              dot.setAttribute('cx', p2.x);
              dot.setAttribute('cy', p2.y);
              dot.setAttribute('r', '1.6');
              dot.setAttribute('fill', '#f59e0b');
              dot.setAttribute('stroke', '#ffffff');
              dot.setAttribute('stroke-width', '0.5');
              svg.appendChild(dot);
            }
          };

          const updateCirclesUI = () => {
            activity.topCircles.forEach(tc => {
              const el = document.getElementById('j7-tcirc-' + tc.id);
              if (!el) return;
              const isMatched = userMatches[tc.id] !== undefined;
              const isSelected = selectedCircle && selectedCircle.type === 'top' && selectedCircle.id === tc.id;
              const isDragging = activeDrag && activeDrag.startType === 'top' && activeDrag.startCircle.id === tc.id;

              if (isSelected || isDragging) {
                el.style.border = '4px solid #0284c7';
                el.style.backgroundColor = 'rgba(2, 132, 199, 0.45)';
                el.style.boxShadow = '0 0 14px rgba(2, 132, 199, 0.85)';
                el.style.transform = 'scale(1.22)';
              } else if (isMatched) {
                el.style.border = '3px solid #16a34a';
                el.style.backgroundColor = 'rgba(22, 163, 74, 0.35)';
                el.style.boxShadow = '0 0 8px rgba(22, 163, 74, 0.5)';
                el.style.transform = 'scale(1)';
              } else {
                el.style.border = '2.5px solid rgba(2, 132, 199, 0.5)';
                el.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
                el.style.boxShadow = 'none';
                el.style.transform = 'scale(1)';
              }
            });

            activity.bottomCircles.forEach(bc => {

                  this.currentActivityState.lines.push({ l: currentLeft.id, r: opt.id });

                  // Smooth curved bezier connector with animated glow
                  const x1 = currentLeft.left + currentLeft.width;
                  const y1 = currentLeft.top + currentLeft.height / 2;
                  const x2 = opt.left;
                  const y2 = opt.top + opt.height / 2;
                  const dx = (x2 - x1) * 0.45;
                  const pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

                  // Ensure defs and filter exist
                  if (!svg.querySelector('#match-glow')) {
                    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    defs.innerHTML = `
                      <filter id="match-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.35"/>
                      </filter>
                      <linearGradient id="match-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#0ea5e9"/>
                        <stop offset="50%" stop-color="#38bdf8"/>
                        <stop offset="100%" stop-color="#2563eb"/>
                      </linearGradient>
                    `;
                    svg.insertBefore(defs, svg.firstChild);
                  }

                  // Path element
                  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                  path.setAttribute('d', pathD);
                  path.setAttribute('fill', 'none');
                  path.setAttribute('stroke', 'url(#match-grad)');
                  path.setAttribute('stroke-width', '4.5');
                  path.setAttribute('stroke-linecap', 'round');
                  path.setAttribute('filter', 'url(#match-glow)');
                  svg.appendChild(path);

                  // Endpoint dots
                  const startDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                  startDot.setAttribute('cx', x1 + '%');

                  const endDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                  endDot.setAttribute('cx', x2 + '%');
                  endDot.setAttribute('cy', y2 + '%');
                  endDot.setAttribute('r', '0');
                  endDot.setAttribute('fill', '#2563eb');
                  svg.appendChild(endDot);

                  const len = path.getTotalLength();
                  path.style.strokeDasharray = len;
                  path.style.strokeDashoffset = len;
                  const anim = path.animate(
                    [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
                    { duration: 480, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }

                  anim.onfinish = () => {

                      { transform: 'scale(1) translateY(0)', opacity: 1 }
                    ], { duration: 450, delay: 200, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });

                    // Confetti / sparkle burst at the result box

          activity.left.forEach(opt => setupMatchBtn(opt, true));
          activity.right.forEach(opt => setupMatchBtn(opt, false));
        }

        if (activity.type === 'drawing') {
          this.currentActivityState.drawings = {};

          const resamplePath = (points, numPoints) => {
            if (points.length === 0) return [];
            if (points.length === 1) return Array(numPoints).fill(points[0]);
            let totalLength = 0;
            for (let i = 1; i < points.length; i++) {
              totalLength += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
            }
            const step = totalLength / (numPoints - 1);
            const newPoints = [points[0]];
            let currentD = 0;
            for (let i = 1; i < points.length; i++) {
              let p0 = points[i - 1];
              let p1 = points[i];
              let dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
              while (currentD + dist >= step && newPoints.length < numPoints - 1) {
                let t = (step - currentD) / dist;
                let nx = p0.x + t * (p1.x - p0.x);
                let ny = p0.y + t * (p1.y - p0.y);
                newPoints.push({ x: nx, y: ny });
                p0 = { x: nx, y: ny };
                dist -= (step - currentD);
                currentD = 0;
              }
              currentD += dist;
            }
            while (newPoints.length < numPoints) newPoints.push(points[points.length - 1]);
            return newPoints;
          };



          activity.boxes.forEach(box => {
            this.currentActivityState.drawings[box.id] = { points: [], passed: false, evalTimeout: null };
            const state = this.currentActivityState.drawings[box.id];

            const canvasWrapper = document.createElement('div');
            canvasWrapper.style.position = 'absolute';
            canvasWrapper.style.left = box.left + '%';
            canvasWrapper.style.top = box.top + '%';

            const canvas = document.createElement('canvas');
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.touchAction = 'none';
            canvas.style.cursor = 'crosshair';
            canvasWrapper.appendChild(canvas);

            const btnClear = document.createElement('button');
            btnClear.textContent = '✖';
            btnClear.title = 'Effacer';
            btnClear.style.position = 'absolute';
            btnClear.style.top = '5px';
            btnClear.style.right = '5px';
            btnClear.style.width = '30px';
            btnClear.style.height = '30px';

            btnClear.style.cursor = 'pointer';
            btnClear.style.boxShadow = '0 2px 5px rgba(0,0,0,0.3)';
            canvasWrapper.appendChild(btnClear);

            imgContainer.appendChild(canvasWrapper);

            let ctx = canvas.getContext('2d');
            let isDrawing = false;

            const ensureCanvasSize = () => {
              const rect = canvas.getBoundingClientRect();
              const w = Math.round(rect.width || canvas.clientWidth || canvasWrapper.clientWidth);
              const h = Math.round(rect.height || canvas.clientHeight || canvasWrapper.clientHeight);
              if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
                canvas.width = w;
                canvas.height = h;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#2d3436';
                ctx.fillStyle = '#2d3436';
                if (state.points && state.points.length > 0) {
                  redrawStrokes(state.passed ? '#4ade80' : '#2d3436');
                }
              }
            };

            ensureCanvasSize();
            img.addEventListener('load', () => {
              ensureCanvasSize();
              setTimeout(ensureCanvasSize, 50);
              setTimeout(ensureCanvasSize, 250);
            });
            setTimeout(ensureCanvasSize, 50);
            setTimeout(ensureCanvasSize, 200);
            setTimeout(ensureCanvasSize, 600);

            const getPos = (e) => {
              ensureCanvasSize();
              const rect = canvas.getBoundingClientRect();
              let clientX = e.clientX;
              let clientY = e.clientY;
              if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
              } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
              }
              const rw = rect.width || canvas.clientWidth || 1;
              const rh = rect.height || canvas.clientHeight || 1;
              return {
                x: (clientX - rect.left) * (canvas.width / rw),
                y: (clientY - rect.top) * (canvas.height / rh),
                nx: Math.max(0, Math.min(1, (clientX - rect.left) / rw)),
                ny: Math.max(0, Math.min(1, (clientY - rect.top) / rh))
              };
            };

            const redrawStrokes = (color) => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              if (state.points.length === 0) return;
              ctx.strokeStyle = color;
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              const p0 = state.points[0];
              const p0x = p0.nx != null ? p0.nx * canvas.width : p0.x;
              const p0y = p0.ny != null ? p0.ny * canvas.height : p0.y;
              ctx.moveTo(p0x, p0y);
              for (let i = 1; i < state.points.length; i++) {
                const pi = state.points[i];
                const pix = pi.nx != null ? pi.nx * canvas.width : pi.x;
                const piy = pi.ny != null ? pi.ny * canvas.height : pi.y;
                ctx.lineTo(pix, piy);
              }
              ctx.stroke();
            };

            state.evaluate = () => {
              if (state.passed) return true;
              const pts = state.points;
              if (pts.length < 5) return false;

              const N = 30;
              const userResampled = resamplePath(pts, N);
              const expectedResampled = resamplePath(box.expected, N);

              let totalDist = 0;
              let totalDistRev = 0;
              const revExpected = [...expectedResampled].reverse();
              for (let i = 0; i < N; i++) {
                totalDist += Math.hypot(userResampled[i].x - expectedResampled[i].x, userResampled[i].y - expectedResampled[i].y);
                totalDistRev += Math.hypot(userResampled[i].x - revExpected[i].x, userResampled[i].y - revExpected[i].y);
              }
              const avgDist = Math.min(totalDist / N, totalDistRev / N);

              let minX = 1, maxX = 0, minY = 1, maxY = 0;
              pts.forEach(p => {
                const px = p.nx != null ? p.nx : p.x;
                const py = p.ny != null ? p.ny : p.y;
                if (px < minX) minX = px;
                if (px > maxX) maxX = px;
                if (py < minY) minY = py;
                if (py > maxY) maxY = py;
              });
              const spanX = maxX - minX;
              const spanY = maxY - minY;

              if (avgDist < 0.48 || (spanX > 0.20 && spanY > 0.20 && pts.length >= 8)) {
                state.passed = true;
                btnClear.style.display = 'none';
                redrawStrokes('#4ade80');
                return true;
              }
              return false;
            };

            const startDraw = (e) => {
              if (state.passed) return;
              if (e.cancelable) e.preventDefault();
              ensureCanvasSize();
              isDrawing = true;

              const pos = getPos(e);
              ctx.strokeStyle = '#2d3436';
              ctx.fillStyle = '#2d3436';
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
              ctx.fill();

              ctx.beginPath();
              ctx.moveTo(pos.x, pos.y);
              state.points.push({ x: pos.nx, y: pos.ny, nx: pos.nx, ny: pos.ny });
            };

            const moveDraw = (e) => {
              if (!isDrawing || state.passed) return;
              if (e.cancelable) e.preventDefault();
              const pos = getPos(e);
              ctx.lineTo(pos.x, pos.y);
              ctx.stroke();
              state.points.push({ x: pos.nx, y: pos.ny, nx: pos.nx, ny: pos.ny });
            };

            const endDraw = (e) => {
              if (isDrawing) {
                if (e && e.cancelable) e.preventDefault();
                isDrawing = false;
              }
            };

            if (window.PointerEvent) {
              canvas.addEventListener('pointerdown', startDraw);
              canvas.addEventListener('pointermove', moveDraw);
              window.addEventListener('pointerup', endDraw);
              window.addEventListener('pointercancel', endDraw);
            } else {
              canvas.addEventListener('mousedown', startDraw);
              canvas.addEventListener('mousemove', moveDraw);
              window.addEventListener('mouseup', endDraw);

              canvas.addEventListener('touchstart', startDraw, { passive: false });
              canvas.addEventListener('touchmove', moveDraw, { passive: false });
              window.addEventListener('touchend', endDraw);
            }

            btnClear.onclick = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              state.points = [];
              state.passed = false;
              const fb = document.getElementById('j1-feedback');
              if (fb) fb.textContent = '';
            };
          });
        }

        if (activity.type === 'sentence') {
          const overlayText = document.createElement('div');
          overlayText.style.position = 'absolute';
          overlayText.style.left = activity.textBox.left + '%';
          overlayText.style.top = activity.textBox.top + '%';
          overlayText.style.width = activity.textBox.width + '%';
          overlayText.style.height = activity.textBox.height + '%';
          overlayText.style.display = 'flex';
          overlayText.style.alignItems = 'center';
          overlayText.style.padding = '0 2%';
          overlayText.style.fontFamily = "'Quicksand', 'Nunito', sans-serif";
          overlayText.style.fontSize = 'calc(var(--img-width) * 0.025)';
          overlayText.style.fontWeight = '700';
          overlayText.style.color = '#1b305f';
          overlayText.style.whiteSpace = 'nowrap';
          overlayText.style.pointerEvents = 'none';
          imgContainer.appendChild(overlayText);

          activity.labels.forEach(lbl => {
            const btn = document.createElement('div');
            btn.style.position = 'absolute';

      validateJourney1Activity(activity) {
        let isCorrect = false;
        const fb = document.getElementById('j1-feedback');
        const state = this.currentActivityState;

        if (activity.type === 'multiple-choice') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids) isCorrect = true;
        }
        else if (activity.type === 'highlight' || activity.type === 'underline') {
          let fail = false;
          let validsFound = 0;
          state.selected.forEach(id => {
            const opt = activity.options.find(o => o.id === id);
            if (!opt.correct) fail = true;
            else validsFound++;
          });
          const totalValids = activity.options.filter(o => o.correct).length;
          if (!fail && validsFound === totalValids && totalValids > 0) isCorrect = true;
        }
        else if (activity.type === 'match') {
          let correctPairs = 0;
          let wrongPair = false;
          state.lines.forEach(pair => {
            if (activity.matches[pair.l] === pair.r) correctPairs++;
            else wrongPair = true;
          });
          if (!wrongPair && correctPairs === Object.keys(activity.matches).length) isCorrect = true;
        }
        else if (activity.type === 'sentence') {
          const built = state.sentence.join(' ');
          if (activity.validSentences.includes(built)) {
            isCorrect = true;
          }
        }
        else if (activity.type === 'drawing') {
          let fail = false;
          let checkAllDone = true;
          activity.boxes.forEach(box => {
            const drawState = this.currentActivityState.drawings[box.id];
            if (drawState.points.length < 10) checkAllDone = false;
            else if (!drawState.evaluate()) fail = true;
          });
          if (checkAllDone && !fail) isCorrect = true;
        }

        if (isCorrect) {
          if (activity.type === 'underline') {
            fb.textContent = "Bravo ! Très bien !";
          } else if (activity.type === 'match') {
            fb.textContent = "Bravo ! Tu as trouvé tous les mots !";
          } else {
            fb.textContent = "Excellent ! Bonne réponse !";
          }
          fb.style.color = '#4ade80';

          // Transform button to "Continuer" and wait for user click to advance
          const valBtn = document.getElementById('j1-val-btn');
          if (valBtn) {
            valBtn.src = 'journe 1/continuer.png';
            valBtn.setAttribute('data-action', 'next');
            valBtn.animate([
              { transform: 'scale(0.9)', opacity: 0.5 },
              { transform: 'scale(1.05)', opacity: 1 },
              { transform: 'scale(1)', opacity: 1 }
            ], { duration: 400, easing: 'ease-out' });
          } else {
            setTimeout(() => this.handleJourney1Next(), 1500);
          }
        } else {
          if (activity.type === 'underline') {
            fb.textContent = "Essaie encore ! Écoute bien le son [z].";
          } else {
            fb.textContent = "Oups, ce n'est pas tout à fait ça. Réessaie !";
          }
          fb.style.color = '#f87171';
          window.j1GentleShake(fb);

          // Optional: hide error after a few seconds or allow immediate retry
          if (activity.type === 'match' || activity.type === 'sentence') {
            setTimeout(() => this.loadJourney1Activity(), 1500);
          }
        }
      },

      handleJourney1Next() {
        this.currentExIndex++;
        this.loadJourney1Activity();
      },

      finishJourney1() {
        this.close();
        MapSystem.state.unlockedLevel = window.currentSelectedLevel + 1;
        MapSystem.saveProgress();
        MapSystem.updateVisuals(false);
        const targetLevel = MAP_LEVELS.find(l => l.id === MapSystem.state.unlockedLevel);
        if (targetLevel) {
          MapCamera.focusOn(targetLevel, 1.8, 2000);
          setTimeout(() => {
            MapSystem.updateVisuals(true);
          }, 2100);
        }
      },

        if (activity.type === 'writing') {

            inputEl.id = inp.id;

        if (activity.type === 'multiple-choice') {

        if (activity.type === 'match') {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

          let activeLine = null;

          const getCenter = (el) => {
            if (el.dataset.cx !== undefined) {
              return { x: parseFloat(el.dataset.cx), y: parseFloat(el.dataset.cy) };
            }
            const rect = el.getBoundingClientRect();
            const containerRect = imgContainer.getBoundingClientRect();
            return {
              x: ((rect.left - containerRect.left + rect.width / 2) / containerRect.width) * 100,
              y: ((rect.top - containerRect.top + rect.height / 2) / containerRect.height) * 100
            };
          };

          activity.left.forEach(l => {
